<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Portal Sat GPS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif}
body{background:#0F0F0F;height:100vh;display:flex;align-items:center;justify-content:center;padding:10px}
#device{width:100%;max-width:980px;aspect-ratio:16/10;background:#111;border-radius:18px;padding:10px;box-shadow:0 10px 40px rgba(0,0,0,.6);display:flex;border:4px solid #222}
#screen{flex:1;background:#EDE9D6;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;position:relative}
#top{height:46px;background:#367C2B;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:white;border-bottom:4px solid #FFDE00}
#top b{font-size:20px;letter-spacing:0.5px}
#top small{font-size:12px;opacity:0.9;display:flex;gap:10px;align-items:center}
#lightbar{height:42px;background:#0A0A0A;margin:6px 8px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;border:2px solid #000;box-shadow:inset 0 2px 8px #000}
.led{width:14px;height:14px;border-radius:3px;background:#222;border:1px solid #000}
.led.g{background:#2ECC40;box-shadow:0 0 8px #2ECC40}
.led.y{background:#FFDE00;box-shadow:0 0 8px #FFDE00}
.led.o{background:#FF8C00;box-shadow:0 0 8px #FF8C00}
.led.r{background:#444}
#center{display:flex;flex:1;position:relative}
#map-area{flex:1;position:relative;background:linear-gradient(#D8D2B8,#CFC8A8);overflow:hidden}
#grid{position:absolute;inset:-50%;background-image:linear-gradient(#C9C3A3 1px,transparent 1px),linear-gradient(90deg,#C9C3A3 1px,transparent 1px);background-size:52px 52px;transform:perspective(500px) rotateX(55deg)}
#tractor-wrap{position:absolute;top:58%;left:50%;transform:translate(-50%,-50%);z-index:5;text-align:center}
#impl{width:220px;height:14px;background:#1E5AA7;border-radius:4px;border:2px solid #0A3A7A;box-shadow:0 2px 6px rgba(0,0,0,.4);position:relative;margin:0 auto}
#impl::before{content:'...';position:absolute;top:-12px;left:0;right:0;text-align:center;letter-spacing:6px;color:#1E5AA7;font-weight:900}
#trator{font-size:32px;margin-top:6px;display:block}
#left-card{position:absolute;left:12px;top:12px;width:148px;background:white;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.3);border:2px solid #367C2B;z-index:10;padding:10px 12px}
#left-card div{border-bottom:1px solid #EEE;padding:8px 0}
#left-card div:last-child{border:none}
#left-card span{font-size:12px;color:#367C2B;font-weight:800;display:block}
#left-card b{font-size:20px;color:#111}
#right-card{position:absolute;right:12px;top:12px;width:148px;background:white;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.3);border:2px solid #9B2C2C;z-index:10;padding:10px 12px;text-align:center}
#right-card span{font-size:12px;color:#9B2C2C;font-weight:800;display:block}
#right-card b{font-size:26px;color:#111;display:block;margin:6px 0}
#right-card small{font-size:12px;color:#555}
#side-panel{width:88px;background:#1E1E1E;display:flex;flex-direction:column;gap:10px;padding:10px 8px;border-left:3px solid #000}
.side-btn{background:#2E2E2E;color:white;border:2px solid #444;border-radius:10px;padding:14px 4px;text-align:center;font-weight:900;font-size:12px;cursor:pointer}
.side-btn:active{background:#367C2B}
#bottom{height:58px;background:rgba(255,255,255,0.0);display:flex;gap:8px;padding:8px;z-index:10}
.bbtn{flex:1;border-radius:10px;border:2px solid #999;background:white;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.bbtn.yellow{background:#FFDE00;border-color:#C9AC00}
.bbtn.green{background:#2FAA2F;color:white;border-color:#1E7A1E}
.bbtn:active{transform:scale(0.96)}
#canvas-track{position:absolute;inset:0;z-index:2;pointer-events:none}
@media(max-width:700px){#device{aspect-ratio:9/16;max-width:420px}#top b{font-size:16px}#left-card,#right-card{width:122px}#left-card b{font-size:16px}#right-card b{font-size:18px}#impl{width:160px}}
</style>
</head>
<body>
<div id="device">
<div id="screen">
<div id="top"><b>Portal Sat GPS</b><small><span>GPS FIX • RTK • ±<span id="accTop">1.2</span> cm</span><span>🛰️</span><span>📶</span><span style="border:1px solid white;padding:2px 4px;border-radius:4px" id="bat">87%</span></small></div>
<div id="lightbar"></div>
<div id="center">
<div id="map-area">
<div id="grid"></div>
<canvas id="canvas-track"></canvas>
<div id="left-card">
<div><span>LARGURA</span><b id="txtLarg">12.2 m</b></div>
<div><span>VELOCIDADE</span><b id="txtVel">0.0 km/h</b></div>
<div><span>ÁREA</span><b id="txtArea">0.00 ha</b></div>
</div>
<div id="right-card">
<span>DESVIO</span>
<b id="txtDesv">-0.03 m</b>
<small>Desvio p/ Linha</small>
<div style="margin:10px 0">÷</div>
<small>LINHA A-B</small>
</div>
<div id="tractor-wrap">
<div id="impl"></div>
<div id="trator">🚜</div>
</div>
</div>
<div id="side-panel">
<div class="side-btn" onclick="openCfg()">⚙️ CONFIG</div>
<div class="side-btn" onclick="limpar()">🧹 LIMPAR</div>
<div class="side-btn" onclick="centrar()">◎ CENTRO</div>
<div class="side-btn" style="margin-top:auto;background:#FFDE00;color:#111" onclick="simular()">▶ SIMULAR</div>
</div>
</div>
<div id="bottom">
<button class="bbtn" id="bA" onclick="marcaA()">📍 MARCAR A</button>
<button class="bbtn" id="bB" onclick="marcaB()">📍 MARCAR B</button>
<button class="bbtn yellow" onclick="openCfg()">🚜 IMPLEMENTO</button>
<button class="bbtn green" id="bGo" onclick="go()">▶ INICIAR</button>
</div>
</div>
</div>

<div id="modal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:100;align-items:center;justify-content:center;padding:16px" onclick="this.style.display='none'">
<div style="background:white;width:100%;max-width:360px;border-radius:14px;overflow:hidden" onclick="event.stopPropagation()">
<div style="background:#367C2B;color:white;padding:12px;font-weight:900">CONFIG - Portal Sat GPS</div>
<div style="padding:14px">
<b>Largura</b><br>
<span class="chip" style="padding:8px 12px;border:2px solid #CCC;border-radius:20px;margin:4px;display:inline-block;cursor:pointer" onclick="setLarg(6,this)">6 m</span>
<span class="chip" style="padding:8px 12px;border:2px solid #CCC;border-radius:20px;margin:4px;display:inline-block;cursor:pointer" onclick="setLarg(12.2,this)">12.2 m</span>
<span class="chip" style="padding:8px 12px;border:2px solid #CCC;border-radius:20px;margin:4px;display:inline-block;cursor:pointer;background:#367C2B;color:white" onclick="setLarg(20,this)">20 m</span>
<span class="chip" style="padding:8px 12px;border:2px solid #CCC;border-radius:20px;margin:4px;display:inline-block;cursor:pointer" onclick="setLarg(24,this)">24 m</span>
<br><br><button onclick="document.getElementById('modal').style.display='none'" style="width:100%;height:44px;background:#367C2B;color:white;border:none;border-radius:8px;font-weight:900">SALVAR</button>
</div>
</div>
</div>

<script>
const lb=document.getElementById('lightbar');let leds=[];for(let i=0;i<20;i++){let d=document.createElement('div');d.className='led';lb.appendChild(d);leds.push(d);}
const canvas=document.getElementById('canvas-track');const ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight;}window.addEventListener('resize',resize);resize();
let state={larg:12.2,A:null,B:null,bear:0,track:[],dist:0,area:0,run:false,last:null,err:0,simInt:null};
function hav(a,b){const R=6371000,toR=x=>x*Math.PI/180;const dLat=toR(b.lat-a.lat),dLon=toR(b.lon-a.lon);const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function bear(a,b){const toR=x=>x*Math.PI/180,toD=x=>x*180/Math.PI;const y=Math.sin(toR(b.lon-a.lon))*Math.cos(toR(b.lat));const x=Math.cos(toR(a.lat))*Math.sin(toR(b.lat))-Math.sin(toR(a.lat))*Math.cos(toR(b.lat))*Math.cos(toR(b.lon-a.lon));return (toD(Math.atan2(y,x))+360)%360;}
function cross(p){if(!state.A||!state.B)return state.err;const d=hav(state.A,p);const br=bear(state.A,p);return Math.asin(Math.sin(d/6371000)*Math.sin((br-state.bear)*Math.PI/180))*6371000;}
function light(e){leds.forEach(l=>l.className='led r');leds[9].className='led g';leds[10].className='led g';let q=Math.round(Math.abs(e)/0.15);let cls=Math.abs(e)<0.25?'g':Math.abs(e)<0.6?'y':'o';if(e<0){for(let i=0;i<q&&i<9;i++)leds[8-i].className='led '+cls;}else{for(let i=0;i<q&&i<9;i++)leds[11+i].className='led '+cls;}document.getElementById('txtDesv').innerText=(e>0?'+':'')+e.toFixed(2)+' m';}
function drawTrack(){ctx.clearRect(0,0,canvas.width,canvas.height);if(state.track.length<2)return;ctx.strokeStyle='rgba(54,124,43,0.5)';ctx.lineWidth=state.larg*1.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();let b=state.track[state.track.length-1];state.track.forEach((p,i)=>{let x=canvas.width/2+(p.x-b.x)*1.3;let y=canvas.height/2+(p.y-b.y)*1.3;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();}
function update(p){document.getElementById('accTop').innerText=p.acc.toFixed(1);document.getElementById('txtVel').innerText=p.vel.toFixed(1)+' km/h';if(state.last){let d=hav(state.last,p);if(d>0.8&&state.run){state.dist+=d/1000;state.area+=(d*state.larg)/10000;document.getElementById('txtArea').innerText=state.area.toFixed(1)+' ha';}}state.last=p;let px=state.track.length?state.track[state.track.length-1].x:0;let py=state.track.length?state.track[state.track.length-1].y:0;let nx=px+(p.lon-(state.last?.lon||p.lon))*90000;let ny=py+(p.lat-(state.last?.lat||p.lat))*110000;if(state.track.length==0||hav(state.track[state.track.length-1],p)>0.5){state.track.push({x:nx,y:ny,lat:p.lat,lon:p.lon});if(state.track.length>500)state.track.shift();}light(state.A&&state.B?cross(p):state.err);drawTrack();}
function marcaA(){if(!state.last&&!state.simInt){alert('Clique em SIMULAR para testar dentro de casa, ou vá para área aberta com GPS');return;}let p=state.last||{lat:-24.5,lon:-54.5};state.A={lat:p.lat,lon:p.lon};document.getElementById('bA').innerText='✓ A OK';}
function marcaB(){if(!state.A){alert('Marque A primeiro');return;}let p=state.last||{lat:-24.5004,lon:-54.5};state.B={lat:p.lat,lon:p.lon};state.bear=bear(state.A,state.B);document.getElementById('bB').innerText='✓ B OK';}
function go(){state.run=!state.run;document.getElementById('bGo').innerText=state.run?'⏸ PAUSAR':'▶ INICIAR';}
function setLarg(v,el){state.larg=v;document.getElementById('txtLarg').innerText=v+' m';document.getElementById('impl').style.width=(100+v*6)+'px';document.querySelectorAll('.chip').forEach(c=>c.style.background='');if(el)el.style.background='#367C2B';if(el)el.style.color='white';drawTrack();}
function limpar(){state.track=[];state.dist=0;state.area=0;state.A=null;state.B=null;document.getElementById('txtArea').innerText='0.00 ha';document.getElementById('bA').innerText='📍 MARCAR A';document.getElementById('bB').innerText='📍 MARCAR B';ctx.clearRect(0,0,canvas.width,canvas.height);}
function centrar(){state.track=[];ctx.clearRect(0,0,canvas.width,canvas.height);}
function openCfg(){document.getElementById('modal').style.display='flex';}
function simular(){if(state.simInt){clearInterval(state.simInt);state.simInt=null;return;}let lat=-24.5,lon=-54.5;state.simInt=setInterval(()=>{lon+=0.00002;state.err=Math.sin(Date.now()/800)*0.5;update({lat:lat+(Math.random()-0.5)*0.00001,lon:lon,acc:1.2+Math.random(),vel:8+Math.random()*2});},200);}
if(navigator.geolocation){navigator.geolocation.watchPosition(p=>{update({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,vel:(p.coords.speed||0)*3.6});},e=>{}, {enableHighAccuracy:true,maximumAge:0,timeout:10000});}
light(0);resize();
</script>
</body>
</html>
