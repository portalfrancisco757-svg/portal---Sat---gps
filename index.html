<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PORTAL SAT GPS PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#000;color:#fff;height:100vh;overflow:hidden;display:flex}
#left{width:280px;background:#121212;border-right:2px solid #333;display:flex;flex-direction:column}
#left h2{background:#fff;color:#000;padding:10px;font-size:16px;display:flex;align-items:center;gap:6px}
#left h2 b{color:#0B5E20}
#left h2 strong{color:#0D47A1}
#formT{padding:10px;background:#1e1e1e;display:flex;flex-direction:column;gap:6px}
#formT input,#formT select{padding:10px;border-radius:6px;border:none;background:#2a2a2a;color:#fff}
#formT button{background:#2E7D32;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:900}
#lista{flex:1;overflow-y:auto;padding:8px}
.itemT{background:#222;padding:10px;border-radius:8px;margin-bottom:8px;cursor:pointer;border-left:4px solid #4CAF50}
.itemT.active{border-left-color:#FFC400;background:#333}
.itemT small{display:block;color:#aaa;margin-top:4px}
.itemT.del{float:right;background:#C62828;color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:11px}
#main{flex:1;display:flex;flex-direction:column;background:#111}
#lightbar{background:#000;display:flex;padding:5px 8px;gap:2px}
.led{flex:1;height:16px;background:#222;border-radius:2px;transition:0.1s}
.led.g{background:#00E676;box-shadow:0 0 6px #00E676}
.led.y{background:#FFD600;box-shadow:0 0 6px #FFD600}
.led.r{background:#FF3D00}
#header{background:#fff;color:#000;display:flex;justify-content:space-between;align-items:center;padding:6px 10px}
#header b{font-size:20px;color:#0D47A1}
#rtk{padding:4px 8px;border-radius:12px;color:#fff;font-size:11px;font-weight:900}
.rtk-bad{background:#C62828}.rtk-ok{background:#2E7D32}.rtk-float{background:#EF6C00}
#campo{flex:1;position:relative;background:#3a5f2d;overflow:hidden}
#canvas,#canvas2{position:absolute;top:0;left:0;width:100%;height:100%}
#trator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;width:40px;height:60px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60"><rect x="8" y="5" width="24" height="20" fill="%232E7D32"/><rect x="10" y="25" width="20" height="25" fill="%231B5E20"/><circle cx="10" cy="55" r="6" fill="%23333"/><circle cx="30" cy="55" r="6" fill="%23333"/></svg>') no-repeat center/contain;pointer-events:none}
#cross{position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(255,255,255,0.3)}
#lineAB{position:absolute;top:50%;left:5%;right:5%;height:3px;background:#2196F3;display:none;z-index:5}
#lineAB::before,#lineAB::after{content:'A';position:absolute;top:-18px;background:#2196F3;color:#fff;padding:2px 6px;font-weight:900;border-radius:3px}
#lineAB::after{content:'B';right:0}
#bottom{background:#1c1c1c}
#dados{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:8px;font-size:11px;gap:4px}
#dados b{font-size:15px;color:#4CAF50;display:block}
#btns{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;padding:8px;background:#252525}
#btns button{height:48px;border:none;border-radius:8px;font-weight:900;font-size:12px}
.bA{background:#1976D2;color:#fff}.bGo{background:#2E7D32;color:#fff}.bStop{background:#EF6C00;color:#fff}.bCl{background:#424242;color:#fff}
#warn{position:absolute;top:45px;left:50%;transform:translateX(-50%);background:#FF3D00;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:900;z-index:20;display:none}
@media(max-width:800px){body{flex-direction:column}#left{width:100%;height:32vh}#main{height:68vh}}
</style>
</head>
<body>
<div id="left">
<h2><span>🛰️</span> <b>FP</b> PORTAL AGRO <strong>SERVICIOS</strong></h2>
<div id="formT">
<input id="nomeT" placeholder="Nome do Talhão (ex: Lote 1)">
<div style="display:flex;gap:6px">
<select id="cultura"><option>Soja</option><option>Milho</option><option>Trigo</option><option>Pulverização</option><option>Plantio</option></select>
<input id="largura" type="number" value="20" style="width:90px"> <span style="line-height:40px">m</span>
</div>
<button onclick="criarTalhao()">+ CRIAR TALHÃO</button>
<button onclick="exportar()" style="background:#1565C0;margin-top:4px">EXPORTAR KML</button>
</div>
<div id="lista"></div>
</div>

<div id="main">
<div id="lightbar"></div>
<div id="header">
<div><b>PORTAL SAT GPS</b> <small id="talhaoNome">- Sem talhão</small></div>
<div id="rtk" class="rtk-bad">SEM GPS</div>
</div>
<div id="campo">
<div id="warn">⚠️ ANDA 3m PRA COMEÇAR A PINTAR</div>
<canvas id="canvas2"></canvas>
<canvas id="canvas"></canvas>
<div id="lineAB"></div>
<div id="cross"></div>
<div id="trator"></div>
</div>
<div id="bottom">
<div id="dados">
<div>DESVIO<b id="vD">0.00 m</b></div>
<div>LARGURA<b id="vL">20.0 m</b></div>
<div>ÁREA<b id="vA">0.00 ha</b></div>
<div>GPS<b id="vG">--</b></div>
</div>
<div id="btns">
<button class="bA" id="bA" onclick="marcaA()">MARCAR A</button>
<button class="bA" id="bB" onclick="marcaB()">MARCAR B</button>
<button class="bGo" id="bGo" onclick="toggleRun()">▶ INICIAR</button>
<button class="bCl" onclick="limparTela()">LIMPAR</button>
</div>
</div>
</div>

<script>
var leds=[], canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d'), canvas2=document.getElementById('canvas2'), ctx2=canvas2.getContext('2d');
for(var i=0;i<21;i++){var d=document.createElement('div');d.className='led';document.getElementById('lightbar').appendChild(d);leds.push(d);}
function resize(){[canvas,canvas2].forEach(function(c){c.width=c.offsetWidth;c.height=c.offsetHeight}); desenhaGrade(); redesenha();}
window.addEventListener('resize',resize);

function desenhaGrade(){
 ctx2.clearRect(0,0,canvas2.width,canvas2.height);
 ctx2.strokeStyle='rgba(255,255,255,0.08)'; ctx2.lineWidth=1;
 for(var x=0;x<canvas2.width;x+=40){ctx2.beginPath();ctx2.moveTo(x,0);ctx2.lineTo(x,canvas2.height);ctx2.stroke();}
 for(var y=0;y<canvas2.height;y+=40){ctx2.beginPath();ctx2.moveTo(0,y);ctx2.lineTo(canvas2.width,y);ctx2.stroke();}
}

var talhoes=JSON.parse(localStorage.getItem('portal_talhoes_v2')||'[]');
var talhaoAtivo=JSON.parse(localStorage.getItem('portal_ativo')||'null');
var pts=[], pA=null, pB=null, run=false, watchId=null, lastPos=null, area=0, larg=20, totalPintado=[], distAcum=0;

function salvar(){
 localStorage.setItem('portal_talhoes_v2', JSON.stringify(talhoes));
 if(talhaoAtivo) localStorage.setItem('portal_ativo', JSON.stringify(talhaoAtivo));
 renderLista();
}
function criarTalhao(){
 var nome=document.getElementById('nomeT').value.trim(); if(!nome){alert('Digite nome do talhão');return;}
 larg=parseFloat(document.getElementById('largura').value)||20;
 var t={id:Date.now(), nome:nome, cultura:document.getElementById('cultura').value, larg:larg, area:0, pontos:[], abA:null, abB:null, data:new Date().toLocaleDateString()};
 talhoes.push(t); talhaoAtivo=t; document.getElementById('nomeT').value=''; salvar(); carregarTalhao(t.id);
}
function renderLista(){
 var h=''; for(var i=0;i<talhoes.length;i++){
  var t=talhoes[i]; var act=talhaoAtivo&&talhaoAtivo.id==t.id?' active':'';
  h+='<div class="itemT'+act+'" onclick="carregarTalhao('+t.id+')"><button class="del" onclick="apagar('+t.id+',event)">X</button><b>'+t.nome+'</b> - '+t.cultura+'<small>'+t.area.toFixed(2)+' ha | '+t.larg+'m | '+(t.pontos.length||0)+' pts<br>'+t.data+'</small></div>';
 }
 document.getElementById('lista').innerHTML=h||'<div style="padding:10px;color:#777">Nenhum talhão criado</div>';
 if(talhaoAtivo){document.getElementById('talhaoNome').innerText=' - '+talhaoAtivo.nome; document.getElementById('vL').innerText=talhaoAtivo.larg.toFixed(1)+' m';}
}
function carregarTalhao(id){
 var t=talhoes.find(function(x){return x.id==id}); if(!t) return;
 talhaoAtivo=t; larg=t.larg; pts=t.pontos||[]; pA=t.abA; pB=t.abB; area=t.area||0;
 document.getElementById('vA').innerText=area.toFixed(2)+' ha';
 document.getElementById('lineAB').style.display=(pA&&pB)?'block':'none';
 document.getElementById('bA').innerText=pA?'✓ A':'MARCAR A'; document.getElementById('bB').innerText=pB?'✓ B':'MARCAR B';
 totalPintado=[]; ctx.clearRect(0,0,canvas.width,canvas.height); redesenha(); salvar();
}
function apagar(id,e){e.stopPropagation(); if(!confirm('Apagar talhão?'))return; talhoes=talhoes.filter(function(t){return t.id!=id}); if(talhaoAtivo&&talhaoAtivo.id==id) talhaoAtivo=null; localStorage.removeItem('portal_ativo'); salvar(); ctx.clearRect(0,0,canvas.width,canvas.height);}

function toRad(d){return d*Math.PI/180}
function distM(a,b){var R=6371000,dLat=toRad(b.lat-a.lat),dLon=toRad(b.lon-a.lon),lat1=toRad(a.lat),lat2=toRad(b.lat),h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.asin(Math.sqrt(h))}
function bearing(a,b){var y=Math.sin(toRad(b.lon-a.lon))*Math.cos(toRad(b.lat)),x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lon-a.lon));return (Math.atan2(y,x)*180/Math.PI+360)%360}
