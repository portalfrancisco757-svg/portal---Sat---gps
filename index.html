<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Portal Sat GPS Agrícola</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101417;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 62px;
  background: #20272b;
  display: flex;
  align-items: center;
  padding: 7px 10px;
  gap: 9px;
  border-bottom: 1px solid #394247;
}

.logo {
  font-size: 19px;
  font-weight: bold;
  white-space: nowrap;
}

.logo span {
  color: #67d45c;
}

.status {
  margin-left: auto;
  padding: 9px 13px;
  border-radius: 6px;
  background: #4b2020;
  font-weight: bold;
  font-size: 13px;
}

.status.ok {
  background: #155b29;
}

button, select, input {
  font: inherit;
}

button {
  border: 0;
  border-radius: 6px;
  background: #303a40;
  color: white;
  padding: 10px 13px;
  font-weight: bold;
}

button:active {
  transform: scale(.97);
}

button.green {
  background: #20752e;
}

button.orange {
  background: #956218;
}

button.red {
  background: #8b2929;
}

.main {
  flex: 1;
  min-height: 0;
  display: flex;
}

.sidebar {
  width: 250px;
  background: #20272b;
  padding: 9px;
  overflow-y: auto;
}

.panel {
  background: #171d20;
  border: 1px solid #384147;
  border-radius: 7px;
  margin-bottom: 9px;
  padding: 9px;
}

.panel h3 {
  margin: 0 0 8px;
  font-size: 13px;
  color: #aeb8bd;
  text-transform: uppercase;
}

.bigValue {
  font-size: 25px;
  font-weight: bold;
}

.unit {
  color: #9aa5aa;
  font-size: 12px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.data {
  background: #242d31;
  border-radius: 5px;
  padding: 8px;
}

.data small {
