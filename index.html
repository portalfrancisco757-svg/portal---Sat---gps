<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Portal Sat GPS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial,Helvetica,sans-serif}
#tablet{width:100%;max-width:900px;height:100vh;background:#111;border:8px solid #222;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;position:relative}
#lightbar{background:#000;display:flex;justify-content:space-between;padding:6px 10px}
.led{flex:1;height:18px;margin:0 2px;background:#222;border-radius:3px}
.led.on-green{background:#00FF00;box-shadow:0 0 8px #0f0}
.led.on-yellow{background:#FFC400;box-shadow:0 0 8px #FFC400}
#header{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
#logo{display:flex;align-items:center;gap:8px;font-weight:900}
#logo span{color:#0B5E20}
#logo b{color:#003366;font-size:26px;letter-spacing:-1px}
#rtk{background:#2E7D32;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px}
#campo{flex:1;position:relative;background:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1200') center/cover;overflow:hidden}
#canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#trator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:42px;z-index:5;filter:drop-shadow(0 2px 4px #000)}
#lineAB{position:absolute;top:55%;left:0;right:0;height:3px;background:#1E88E5;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:0 5%}
.pointA,.pointB{background:#1E88E5;color:#fff;font-weight:900;padding:2px 8px;border-radius:3px;font-size:18px}
#infoAB{position:absolute;top:58%;left:50%;transform:translateX(-50%);color:#1E88E5;font-weight:900;font-size:14px;background:rgba(255,255,255,0.8);padding:2px 6px;border-radius:4px;z-index:4}
#bottom{background:#1a1a1a;color:#fff}
#dados{display:flex;justify-content:space-around;padding:10px;text-align:center;font-size:12px}
#dados b{display:block;font-size:16px;margin-top:2px}
#dados i{font-style:normal;font-size:18px}
#btns{display:flex;gap:6px;padding:8px;background:#2a2a2a}
#btns button{flex:1;height:44px;border:none;border-radius:8px;font-weight:900;font-size:13px;cursor:pointer}
.bA{background:#1E88E5;color:#fff}
.bB{background:#1E88E5;color:#fff}
.bGo{background:#2E7D32;color:#fff}
.bClear{background:#C62828;color:#fff}
</style>
</head>
<body>
<div id="tablet">
<div id="lightbar"></div>
<div id="header">
<div id="logo">🛰️ <span>FP</span> PORTAL AGRO<br>SERVICIOS</div>
<div><b>PORTAL SAT GPS</b></div>
<div id="rtk">✓ RTK FIX</div>
</div>
<div id="campo">
<canvas id="canvas"></canvas>
<div id="lineAB"><div class="pointA">A</div><div class="pointB">B</div></div>
<div id="infoAB">Linha A-B &nbsp; A-----B</div>
<div id="trator">🚜</div>
</div>
<div id="bottom">
<div id="dados">
<div><i>↔️</i> LARGURA<b id="vL">20.0 m</b></div>
<div><i>🎯</i> DESVIO<b id="vD">0.00 m</b></div>
<div><i>🌱</i> ÁREA<b id="vA">0.00 ha</b></div>
<div><i>🛰️</i> GPS<b id="vG">--</b></div>
</div>
<div id="btns">
<button class="bA" id="btnA" onclick="marcaA()">🚩 MARCAR A</button>
<button class="bA" id="btnB" onclick="marcaB()">🚩 MARCAR B</button>
<button class="bGo" id="btnGo" onclick="iniciar()">◀ INICIAR</button>
<button class="bClear" onclick="limpar()">🗑️ LIMPAR</button>
</div>
</div>
</div>

<script>
var leds=[];
var bar=document.getElementById('lightbar');
for(var i=0;i<21;i++){var d=document.createElement('div');d.className='led';bar.appendChild(d);leds.push(d);}
var canvas=document.getElementById('canvas');
var ctx=canvas.getContext('2d');
var larg=20, area=0, run=false, watchId=null, timer=null, lastPos=null, pA=null, pB=null, hasA=false, hasB=false, desv=0, totalDist=0;

function resize(){canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;}
window.addEventListener('resize',resize); resize();

function toRad(d){return d*Math.PI/180;}
function dist(a,b){
 var R=6371000; var dLat=toRad(b.lat-a.lat); var dLon=toRad(b.lon-a.lon);
 var lat1=toRad(a.lat); var lat2=toRad(b.lat);
 var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)*Math.sin(dLon/2);
 return R*2*Math.asin(Math.sqrt(h));
}
function bearing(a,b){
 var y=Math.sin(toRad(b.lon-a.lon))*Math.cos(toRad(b.lat));
 var x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lon-a.lon));
 return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function crossTrack(A,B,P){
 var d13=dist(A,P)/6371000; var brng13=toRad(bearing(A,P)-bearing(A,B));
 return Math.asin(Math.sin(d13)*Math.sin(brng13))*6371000;
}
function setLight(v){
 for(var i=0;i<leds.length;i++) leds[i].className='led';
 var center=10; leds[center].className='led on-green';
 var q=Math.round(Math.abs(v)/0.2); if(q>10) q=10;
 for(var i=1;i<=q;i++){
  if(v<0 && leds[center-i]) leds[center-i].className='led on-yellow';
  if(v>0 && leds[center+i]) leds[center+i].className='led on-yellow';
 }
 if(Math.abs(v)<0.05){ for(var i=0;i<leds.length;i++) if(i>=8&&i<=12) leds[i].className='led on-green'; }
 document.getElementById('vD').innerText=v.toFixed(2)+' m';
}
function marcaA(){
 if(!lastPos){ alert('Clique INICIAR e permita GPS primeiro'); return; }
 pA={lat:lastPos.lat,lon:lastPos.lon}; hasA=true;
 document.getElementById('btnA').innerText='✓ A OK'; document.getElementById('btnA').style.background='#2E7D32';
}
function marcaB(){
 if(!hasA){ alert('Marque A primeiro'); return; }
 pB={lat:lastPos.lat,lon:lastPos.lon}; hasB=true;
 document.getElementById('btnB').innerText='✓ B OK'; document.getElementById('btnB').style.background='#2E7D32';
}
function paintStrip(d){
 var w=canvas.width; var h=canvas.height;
 ctx.fillStyle='rgba(180,255,100,0.55)';
 var x=w/2 - (desv*12);
 var lw = (larg*3); // escala visual
 ctx.fillRect(x - lw/2, h*0.2, lw, h*0.8);
}
function iniciar(){
 if(run){ run=false; if(watchId) navigator.geolocation.clearWatch(watchId); if(timer) clearInterval(timer); document.getElementById('btnGo').innerText='◀ INICIAR'; document.getElementById('vG').innerText='--'; return; }
 run=true; document.getElementById('btnGo').innerText='⏸ PARAR'; document.getElementById('vG').innerText='BUSCANDO...';
 if(navigator.geolocation){
  watchId=navigator.geolocation.watchPosition(function(p){
   var pos={lat:p.coords.latitude,lon:p.coords.longitude};
   document.getElementById('vG').innerText= p.coords.accuracy.toFixed(0)+'m RTK';
   document.getElementById('rtk').innerText='✓ '+p.coords.accuracy.toFixed(0)+'m';
   if(!lastPos){ lastPos=pos; return; }
   var d=dist(lastPos,pos); if(d<0.5) return;
   area+=d*larg/10000; document.getElementById('vA').innerText=area.toFixed(2)+' ha';
   if(hasA&&hasB){ desv=crossTrack(pA,pB,pos); } else { desv=(Math.random()-0.5)*0.4; }
   setLight(desv); paintStrip(d); document.getElementById('trator').style.marginLeft=(desv*14)+'px';
   lastPos=pos;
  },function(e){ document.getElementById('vG').innerText='SIMULADO'; simul(); },{enableHighAccuracy:true,maximumAge:0,timeout:8000});
  setTimeout(function(){ if(!lastPos) simul(); },4000);
 } else { simul(); }
}
function simul(){
 if(timer) clearInterval(timer); var t=0;
 timer=setInterval(function(){
  t+=0.08; desv=Math.sin(t)*0.8; area+=0.0008*larg/10;
  document.getElementById('vA').innerText=area.toFixed(2)+' ha';
  document.getElementById('vG').innerText='SIM 2cm';
  setLight(desv); paintStrip(1);
  document.getElementById('trator').style.marginLeft=(desv*14)+'px';
 },120);
}
function limpar(){ area=0; ctx.clearRect(0,0,canvas.width,canvas.height); document.getElementById('vA').innerText='0.00 ha'; setLight(0); document.getElementById('trator').style.marginLeft='0px'; }
setLight(0);
</script>
</body>
</html>
