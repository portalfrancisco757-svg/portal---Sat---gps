<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#00ff00">
    <title>PORTAL SAT GPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
        }

        /* 🟩 TELA QUADRICULADA — SEM CÍRCULO */
        .tela-navegacao {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #051a05;
            overflow: hidden;
        }

        /* Grade verde — TELA COMPLETA */
        .grade {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0,255,80,0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,80,0.12) 1px, transparent 1px);
            background-size: 35px 35px;
        }

        /* Linhas guia centrais */
        .linha-vertical {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: linear-gradient(180deg, transparent, #00ff00, #00ccff, #00ff00, transparent);
            transform: translateX(-50%);
            box-shadow: 0 0 8px rgba(0,255,0,0.5);
            z-index: 6;
        }
        .linha-horizontal {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ff00, transparent);
            transform: translateY(-50%);
            box-shadow: 0 0 8px rgba(0,255,0,0.5);
            z-index: 6;
        }

        /* ✨ BARRA DE LUZ — LINHA GUIADA ENTRE A E B */
        .barra-luz-linha {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 5px;
            background: linear-gradient(90deg, transparent, #00ff00, #aaff00, #00ff00, transparent);
            box-shadow: 
                0 0 20px #00ff00,
                0 0 40px rgba(0,255,0,0.6),
                inset 0 0 10px #fff;
            transform-origin: left center;
            z-index: 9;
            transition: all 0.25s ease;
            opacity: 0;
            border-radius: 3px;
        }
        .barra-luz-linha.ativa { opacity: 1; }

        /* 🟩 FAIXA/PINTURA QUE ACOMPANHA O TRIÂNGULO */
        .faixa-direcao {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 120px;
            background: linear-gradient(90deg, 
                rgba(0,255,0,0.05) 0%, 
                rgba(0,255,0,0.25) 30%, 
                rgba(0,255,0,0.4) 50%, 
                rgba(0,255,0,0.25) 70%, 
                rgba(0,255,0,0.05) 100%);
            transform-origin: left center;
            transform: translateY(-50%);
            z-index: 8;
            pointer-events: none;
            transition: all 0.15s ease;
            border-radius: 60px;
        }

        /* Triângulo amarelo — veículo */
        .triangulo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-left: 24px solid transparent;
            border-right: 24px solid transparent;
            border-bottom: 40px solid #ffcc00;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 15px #ffcc00);
            z-index: 15;
            transition: transform 0.1s linear;
        }

        /* Distância no canto direito */
        .distancia-display {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 32px;
            font-weight: bold;
            color: #00ff00;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(0,255,0,0.5);
            z-index: 20;
        }

        /* Botões Ponto A e B */
        .bloco-pontos {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
        }
        .btn-ponto {
            width: 90px;
            height: 70px;
            border-radius: 8px;
            border: 3px solid #fff;
            font-size: 18px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s;
        }
        .btn-a {
            background: linear-gradient(180deg, #00c800, #008800);
            border-color: #00ff00;
        }
        .btn-a.ativo {
            box-shadow: 0 0 15px #00ff00, inset 0 0 10px rgba(255,255,255,0.3);
        }
        .btn-b {
            background: linear-gradient(180deg, #0066ff, #0044cc);
            border-color: #0088ff;
        }
        .btn-b:disabled {
            background: #222;
            border-color: #444;
            color: #666;
        }
        .btn-b.ativo {
            box-shadow: 0 0 15px #0088ff, inset 0 0 10px rgba(255,255,255,0.3);
        }

        /* Controles lado direito */
        .bloco-controles {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }
        .btn-controle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #555;
            font-size: 20px;
            cursor: pointer;
            background: #222;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-controle:hover { background: #333; }
        .btn-controle.primario {
            background: #005500;
            border-color: #00ff00;
        }
        .btn-controle.primario.ativo {
            box-shadow: 0 0 15px rgba(0,255,0,0.5);
        }
        .btn-2d {
            background: #0055aa;
            border-color: #00aaff;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-2d.ativo {
            box-shadow: 0 0 15px rgba(0,100,255,0.5);
        }

        /* Status GPS topo */
        .status-topo {
            position: absolute;
            top: 10px;
            left: 15px;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .titulo-app {
            font-size: 16px;
            font-weight: bold;
            color: #00ff00;
        }
        .status-gps {
            padding: 4px 10px;
            background: #333;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-gps.ativo {
            background: #008800;
            color: #fff;
        }
    </style>
</head>
<body>

<!-- Tela Principal - QUADRÍCULA COMPLETA -->
<div class="tela-navegacao" id="telaNavegacao">
    <div class="grade"></div>
    
    <!-- Status GPS -->
    <div class="status-topo">
        <div class="titulo-app">PORTAL SAT GPS</div>
        <div class="status-gps" id="statusGPS">GPS</div>
    </div>

    <!-- Distância -->
    <div class="distancia-display" id="distanciaDisplay">+0.00 m</div>
    
    <!-- Linhas Guia -->
    <div class="linha-vertical"></div>
    <div class="linha-horizontal"></div>

    <!-- ✨ BARRA DE LUZ — SEGUE A LINHA A → B -->
    <div class="barra-luz-linha" id="barraLuzLinha"></div>

    <!-- 🟩 FAIXA/PINTURA — ACOMPANHA O TRIÂNGULO -->
    <div class="faixa-direcao" id="faixaDirecao"></div>

    <!-- Triângulo Veículo -->
    <div class="triangulo" id="triangulo"></div>

    <!-- Botões Ponto A / B -->
    <div class="bloco-pontos">
        <button class="btn-ponto btn-a" id="btnPontoA">PONTO A</button>
        <button class="btn-ponto btn-b" id="btnPontoB" disabled>PONTO B</button>
    </div>

    <!-- Controles Direitos -->
    <div class="bloco-controles">
        <button class="btn-controle primario ativo" title="Cobertura">🟩</button>
        <button class="btn-controle" id="btnZoomMais" title="+">+</button>
        <button class="btn-controle" id="btnZoomMenos" title="−">−</button>
        <button class="btn-controle btn-2d ativo" id="btnModo" title="2D">2D</button>
    </div>
</div>

<script>
// ==================================================
// PORTAL SAT GPS — BARRA DE LUZ + FAIXA DIREÇÃO
// ✅ Barra de luz segue linha A→B
// ✅ Faixa/pintura acompanha o triângulo
// ✅ Todo o restante permanece igual
// ==================================================

const ESTADO = {
    lat: null,
    lon: null,
    rumo: 0,
    pontoA: null,
    pontoB: null,
    distancia: 0,
    precisao: null,
    ativo: false
};

// 📡 GPS — FUNCIONA OFFLINE, SEM INTERNET
function iniciarGPS() {
    if (!navigator.geolocation) {
        alert('❌ GPS não disponível no dispositivo');
        return;
    }

    document.getElementById('statusGPS').textContent = 'BUSCANDO...';

    const opcoes = {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 10000
    };

    navigator.geolocation.watchPosition(
        pos => {
            ESTADO.lat = pos.coords.latitude;
            ESTADO.lon = pos.coords.longitude;
            ESTADO.precisao = pos.coords.accuracy;
            
            if (pos.coords.heading !== null) {
                ESTADO.rumo = Math.round(pos.coords.heading);
            }

            // Atualizar status
            const status = document.getElementById('statusGPS');
            status.textContent = ESTADO.precisao <= 5 ? 'GPS FIX' : 'GPS';
            status.classList.add('ativo');

            // Girar triângulo + FAIXA QUE ACOMPANHA
            atualizarDirecao();

            // Calcular distância e barra de luz se A e B marcados
            if (ESTADO.pontoA && ESTADO.pontoB) {
                ESTADO.distancia = calcularDistancia(
                    ESTADO.pontoA.lat, ESTADO.pontoA.lon,
                    ESTADO.lat, ESTADO.lon
                );
                document.getElementById('distanciaDisplay').textContent = 
                    '+' + ESTADO.distancia.toFixed(2) + ' m';
                
                // ✨ Atualizar barra de luz entre A e B
                atualizarBarraLuz();
            }
        },
        erro => {
            document.getElementById('statusGPS').textContent = 'SEM SINAL';
            document.getElementById('statusGPS').classList.remove('ativo');
            console.warn('GPS Erro:', erro.message);
        },
        opcoes
    );
}

// 🟩 ATUALIZA FAIXA/PINTURA QUE ACOMPANHA O TRIÂNGULO
function atualizarDirecao() {
    const triangulo = document.getElementById('triangulo');
    const faixa = document.getElementById('faixaDirecao');
    const rumo = ESTADO.rumo;

    // Triângulo gira
    triangulo.style.transform = `translate(-50%, -50%) rotate(${rumo}deg)`;
    
    // Faixa verde se espalha na direção do triângulo
    const comprimento = 180; // pixels de alcance da faixa
    faixa.style.width = comprimento + 'px';
    faixa.style.transform = `translateY(-50%) rotate(${rumo}deg)`;
}

// ✨ ATUALIZA BARRA DE LUZ — LINHA ENTRE A E B
function atualizarBarraLuz() {
    if (!ESTADO.pontoA || !ESTADO.lat) return;

    const barra = document.getElementById('barraLuzLinha');
    barra.classList.add('ativa');

    // Calcula ângulo entre A e posição atual
    const angulo = calcularAngulo(
        ESTADO.pontoA.lat, ESTADO.pontoA.lon,
        ESTADO.lat, ESTADO.lon
    );

    // Mapeia distância para comprimento visual (escala ajustável)
    const dist = ESTADO.distancia;
    const comprimentoVisivel = Math.min(40 + (dist / 10), 250); // escala dinâmica

    barra.style.width = comprimentoVisivel + 'px';
    barra.style.transform = `translateY(-50%) rotate(${angulo}deg)`;
}

// 📍 Ponto A
document.getElementById('btnPontoA').addEventListener('click', () => {
    if (!ESTADO.lat) {
        alert('📡 Aguarde o sinal GPS...');
        return;
    }
    ESTADO.pontoA = { lat: ESTADO.lat, lon: ESTADO.lon };
    ESTADO.pontoB = null;
    document.getElementById('btnPontoA').classList.add('ativo');
    document.getElementById('btnPontoB').classList.remove('ativo');
    document.getElementById('btnPontoB').disabled = false;
    document.getElementById('distanciaDisplay').textContent = '+0.00 m';
    document.getElementById('barraLuzLinha').classList.remove('ativa');
    ESTADO.ativo = true;
});

// 📍 Ponto B — ATIVA BARRA DE LUZ
document.getElementById('btnPontoB').addEventListener('click', () => {
    if (!ESTADO.pontoA || !ESTADO.lat) return;
    ESTADO.pontoB = { lat: ESTADO.lat, lon: ESTADO.lon };
    document.getElementById('btnPontoB').classList.add('ativo');
    ESTADO.distancia = calcularDistancia(
        ESTADO.pontoA.lat, ESTADO.pontoA.lon,
        ESTADO.lat, ESTADO.lon
    );
    document.getElementById('distanciaDisplay').textContent = 
        '+' + ESTADO.distancia.toFixed(2) + ' m';
    
    // ✨ Ativar barra de luz
    atualizarBarraLuz();
});

// 📐 CÁLCULO DE DISTÂNCIA (Haversine)
function calcularDistancia(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + 
              Math.cos(lat1 * Math.PI / 180) * 
              Math.cos(lat2 * Math.PI / 180) * 
              Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// 📐 CÁLCULO DE ÂNGULO ENTRE DOIS PONTOS
function calcularAngulo(lat1, lon1, lat2, lon2) {
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const lat1Rad = lat1 * Math.PI / 180;
    const lat2Rad = lat2 * Math.PI / 180;
    const y = Math.sin(dLon) * Math.cos(lat2Rad);
    const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - 
              Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
    let ang = Math.atan2(y, x) * 180 / Math.PI;
    return (ang + 360) % 360;
}

// 🔍 Zoom
let zoom = 1;
document.getElementById('btnZoomMais').addEventListener('click', () => {
    zoom = Math.min(zoom * 1.15, 3);
    document.getElementById('telaNavegacao').style.transform = `scale(${zoom})`;
});
document.getElementById('btnZoomMenos').addEventListener('click', () => {
    zoom = Math.max(zoom / 1.15, 0.5);
    document.getElementById('telaNavegacao').style.transform = `scale(${zoom})`;
});

// ▶️ Iniciar GPS ao carregar
window.addEventListener('load', iniciarGPS);

// Salvar dados localmente (funciona offline)
window.addEventListener('beforeunload', () => {
    if (ESTADO.pontoA) {
        localStorage.setItem('ultimoPontoA', JSON.stringify(ESTADO.pontoA));
    }
});
</script>
</body>
</html>
