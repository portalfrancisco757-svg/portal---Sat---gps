<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PORTAL SAT GPS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        html, body {
            background: #121212; color: white;
            height: 100vh; height: 100dvh;
            width: 100vw; overflow: hidden; position: fixed;
        }

        /* 🔦 BARRA DE LEDS */
        .barra-led {
            height: 26px; background: #000;
            display: flex; justify-content: center; align-items: center;
            gap: 1px; padding: 0 5px; border-bottom: 2px solid #333;
        }
        .led {
            width: 9px; height: 14px; border-radius: 2px;
            background: #222; transition: all 0.1s;
        }
        .led.verde { background: #0c0; box-shadow: 0 0 4px #0c0; }
        .led.laranja { background: #f80; box-shadow: 0 0 4px #f80; }
        .led.vermelho { background: #c00; box-shadow: 0 0 4px #c00; }
        .led.centro { width: 11px; background: #333; }
        .led.centro.ativo { background: #fff; box-shadow: 0 0 6px #fff; }

        /* 📱 BARRA SUPERIOR */
        .topo {
            background: linear-gradient(180deg, #2a2a2a, #1a1a1a);
            padding: 8px 12px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #000; height: 56px;
        }
        .titulo { font-size: 15px; font-weight: bold; color: #6cf; }
        .status { display: flex; gap: 8px; align-items: center; font-size: 12px; }
        .status-sinal { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .rtk { background: #080; } .dgps { background: #08c; }
        .gps { background: #c80; } .sem-sinal { background: #400; }
        .relogio { font-family: monospace; font-size: 13px; }
        .btn-config {
            width: 36px; height: 36px; border-radius: 6px; border: none;
            background: #333; color: white; font-size: 18px; cursor: pointer;
            touch-action: manipulation;
        }
        .btn-config:active { background: #444; transform: scale(0.95); }

        /* 📊 DADOS */
        .dados {
            position: absolute; top: 62px; left: 10px;
            background: rgba(0,0,0,0.8); border: 1px solid #333;
            border-radius: 6px; padding: 10px; min-width: 170px; z-index: 10;
        }
        .linha { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
        .etiqueta { color: #888; }
        .valor { font-family: monospace; font-weight: bold; color: #0f0; }
        .valor.azul { color: #0cf; } .valor.amarelo { color: #fc0; } .valor.vermelho { color: #f44; }

        /* 🎯 NAVEGAÇÃO */
        .navegacao {
            position: absolute; top: 120px; bottom: 100px; left: 0; right: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .seta {
            width: 0; height: 0;
            border-left: 35px solid transparent;
            border-right: 35px solid transparent;
            border-bottom: 55px solid #fc0;
            filter: drop-shadow(0 0 8px rgba(255,200,0,0.5));
            transition: transform 0.2s ease-out;
            transform-origin: center bottom;
        }
        .desvio-grande {
            position: absolute; top: 130px; right: 15px;
            font-size: 28px; font-weight: bold; font-family: monospace;
            color: #fc0; text-shadow: 0 0 8px rgba(255,200,0,0.4);
        }
        .linha-centro {
            position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
            background: #0cf; opacity: 0; transform: translateX(-50%);
            box-shadow: 0 0 10px #0cf;
        }
        .linha-centro.ativa { opacity: 0.5; }

        /* 🔘 BOTÕES */
        .botoes {
            position: absolute; bottom: 15px; left: 10px; right: 10px;
            display: flex; gap: 8px; justify-content: space-between;
        }
        .btn {
            flex: 1; height: 70px; border-radius: 8px; border: none;
            font-size: 15px; font-weight: bold; color: white;
            cursor: pointer; touch-action: manipulation;
            transition: all 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-a { background: linear-gradient(180deg, #0c0, #080); border: 2px solid #0f0; }
        .btn-b { background: #333; color: #888; border: 2px solid #444; }
        .btn-b.ativo { background: linear-gradient(180deg, #08f, #06c); color: white; border-color: #0cf; }
        .btn-parar { background: linear-gradient(180deg, #c00, #800); border: 2px solid #f44; }
        .btn-reiniciar { background: linear-gradient(180deg, #555, #333); border: 2px solid #666; font-size: 20px; }

        /* 📋 MODAL DE CONFIGURAÇÕES */
        .fundo-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            display: none; align-items: center; justify-content: center;
            z-index: 100; padding: 15px;
        }
        .fundo-modal.mostrar { display: flex; }
        .modal {
            background: #1a1a1a; border: 2px solid #333;
            border-radius: 10px; padding: 20px;
            width: 100%; max-width: 420px;
            max-height: 85vh; overflow-y: auto;
        }
        .modal-titulo { font-size: 18px; font-weight: bold; color: #0cf; margin-bottom: 15px; text-align: center; }
        .abas { display: flex; gap: 8px; margin-bottom: 15px; }
        .aba { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; background: #333; color: white; touch-action: manipulation; }
        .aba.ativa { background: #069; }
        .campo {
            width: 100%; padding: 12px; margin: 8px 0;
            background: #2a2a2a; border: 1px solid #444;
            color: white; border-radius: 6px; font-size: 15px;
        }
        .grupo-botoes { display: flex; gap: 10px; margin-top: 15px; }
        .btn-modal { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; touch-action: manipulation; }
        .btn-cancelar { background: #444; color: white; }
        .btn-salvar { background: #080; color: white; }
        .item-talhao {
            padding: 12px; background: #2a2a2a; border-radius: 6px;
            margin: 6px 0; border-left: 3px solid #0cf;
        }
        .info-bloco {
            background: #2a2a2a; padding: 12px; border-radius: 6px;
            margin-top: 10px;
        }
        label { color: #aaa; font-size: 13px; display: block; margin-bottom: 4px; }
        select.campo { appearance: none; cursor: pointer; }
        .sem-dados { color: #666; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <!-- 🔦 BARRA DE 27 LEDS -->
    <div class="barra-led" id="barraLED"></div>

    <!-- 📱 BARRA SUPERIOR -->
    <div class="topo">
        <div class="titulo">🛰️ PORTAL SAT GPS</div>
        <div class="status">
            <span class="status-sinal sem-sinal" id="statusSinal">SEM SINAL</span>
            <span class="relogio" id="relogio">00:00</span>
        </div>
        <button class="btn-config" id="btnConfig">⚙</button>
    </div>

    <!-- 📊 DADOS -->
    <div class="dados" id="dados">
        <div class="linha"><span class="etiqueta">Talhão</span><span class="valor" id="nomeTalhaoAtual">---</span></div>
        <div class="linha"><span class="etiqueta">Implemento</span><span class="valor azul" id="larguraFaixa">--- m</span></div>
        <div class="linha"><span class="etiqueta">Latitude</span><span class="valor" id="lat">---</span></div>
        <div class="linha"><span class="etiqueta">Longitude</span><span class="valor" id="lon">---</span></div>
        <div class="linha"><span class="etiqueta">Rumo</span><span class="valor" id="rumo">0.0°</span></div>
        <div class="linha"><span class="etiqueta">Velocidade</span><span class="valor azul" id="vel">0.0 km/h</span></div>
        <div class="linha"><span class="etiqueta">Desvio</span><span class="valor amarelo" id="desvio">+0.00 m</span></div>
        <div class="linha"><span class="etiqueta">Precisão</span><span class="valor azul" id="precisao">--- m</span></div>
    </div>

    <!-- 🎯 NAVEGAÇÃO -->
    <div class="desvio-grande" id="desvioGrande">0.00 m</div>
    <div class="navegacao">
        <div class="linha-centro" id="linhaCentro"></div>
        <div class="seta" id="seta"></div>
    </div>

    <!-- 🔘 BOTÕES -->
    <div class="botoes">
        <button class="btn btn-a" id="btnA">PONTO A</button>
        <button class="btn btn-b" id="btnB" disabled>PONTO B</button>
        <button class="btn btn-parar" id="btnParar">PARAR</button>
        <button class="btn btn-reiniciar" id="btnReiniciar">↻</button>
    </div>

    <!-- 📋 MODAL DE CONFIGURAÇÕES COMPLETO -->
    <div class="fundo-modal" id="modal">
        <div class="modal">
            <h3 class="modal-titulo">⚙ CONFIGURAÇÕES</h3>
            <div class="abas">
                <button class="aba ativa" data-aba="criar">Criar</button>
                <button class="aba" data-aba="talhoes">Talhões</button>
                <button class="aba" data-aba="config">Geral</button>
            </div>

            <!-- ABA CRIAR TALHÃO -->
            <div id="aba-criar">
                <div class="info-bloco">
                    <label>Nome do Talhão *</label>
                    <input type="text" id="nomeTalhao" class="campo" placeholder="Ex: Talhão 1 - Soja">
                    
                    <label>Largura do Implemento (m) *</label>
                    <input type="number" id="larguraImplemento" class="campo" placeholder="Ex: 12.0" step="0.1" min="0.5" value="12.0">
                    
                    <label>Cultura / Observação</label>
                    <input type="text" id="observacao" class="campo" placeholder="Ex: Soja - Safra 2026">
                </div>
                <div class="grupo-botoes">
                    <button class="btn-modal btn-cancelar" id="btnFechar">Fechar</button>
                    <button class="btn-modal btn-salvar" id="btnSalvarTalhao">💾 Salvar</button>
                </div>
            </div>

            <!-- ABA GERENCIAR TALHÕES -->
            <div id="aba-talhoes" style="display:none;">
                <div id="listaTalhoes">
                    <p class="sem-dados">Nenhum talhão salvo ainda</p>
                </div>
            </div>

            <!-- ABA CONFIGURAÇÕES GERAIS -->
            <div id="aba-config" style="display:none;">
                <div class="info-bloco">
                    <label>Tipo de Linha de Guia</label>
                    <select id="tipoLinhaGuia" class="campo">
                        <option selected>AB Reta</option>
                        <option>Curva Contínua</option>
                        <option>Contorno</option>
                        <option>Espiral</option>
                    </select>
                    
                    <label>Unidades de Medida</label>
                    <select id="unidades" class="campo">
                        <option selected>Métrico (metros, km/h)</option>
                        <option>Imperial (pés, mph)</option>
                    </select>
                    
                    <label>Largura Padrão de Faixa (m)</label>
                    <input type="number" id="larguraPadrao" class="campo" value="12.0" step="0.5" min="0.5">
                </div>
                <div class="grupo-botoes">
                    <button class="btn-modal btn-cancelar" id="btnFecharConfig">Fechar</button>
                    <button class="btn-modal btn-salvar" id="btnAplicarConfig">✅ Aplicar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==============================================
        // 🚜 PORTAL SAT GPS — VERSÃO FINAL
        // ==============================================

        // === VARIÁVEIS GLOBAIS ===
        let lat = null, lon = null;
        let rumo = 0, velocidade = 0, precisao = null;
        let desvio = 0;
        let temA = false, temB = false;
        let pontoA = null, pontoB = null;
        let larguraFaixa = 12.0;
        let nomeTalhaoAtual = '---';
        let unidadesMetricas = true;
        let tipoLinha = 'AB Reta';
        let talhoes = [];
        const TOTAL_LEDS = 27;
        const CENTRO_LED = 13;
        const leds = [];

        // === ELEMENTOS ===
        const el = {
            barraLED: document.getElementById('barraLED'),
            statusSinal: document.getElementById('statusSinal'),
            relogio: document.getElementById('relogio'),
            lat: document.getElementById('lat'),
            lon: document.getElementById('lon'),
            rumo: document.getElementById('rumo'),
            vel: document.getElementById('vel'),
            desvio: document.getElementById('desvio'),
            desvioGrande: document.getElementById('desvioGrande'),
            precisao: document.getElementById('precisao'),
            seta: document.getElementById('seta'),
            linhaCentro: document.getElementById('linhaCentro'),
            btnA: document.getElementById('btnA'),
            btnB: document.getElementById('btnB'),
            btnParar: document.getElementById('btnParar'),
            btnReiniciar: document.getElementById('btnReiniciar'),
            btnConfig: document.getElementById('btnConfig'),
            modal: document.getElementById('modal'),
            nomeTalhaoAtual: document.getElementById('nomeTalhaoAtual'),
            larguraFaixaEl: document.getElementById('larguraFaixa'),
        };

        // ==============================================
        // 🔦 INICIALIZAR BARRA DE LEDS
        // ==============================================
        function inicializarLEDs() {
            el.barraLED.innerHTML = '';
            leds.length = 0;
            for (let i = 0; i < TOTAL_LEDS; i++) {
                const led = document.createElement('div');
                led.className = 'led';
                if (i === CENTRO_LED) led.classList.add('centro');
                el.barraLED.appendChild(led);
                leds.push(led);
            }
        }
        inicializarLEDs();

        // ==============================================
        // 🔦 ATUALIZAR LEDS CONFORME DESVIO
        // ==============================================
        function atualizarLEDs(desvioMetros) {
            leds.forEach(led => {
                led.classList.remove('verde', 'laranja', 'vermelho', 'ativo');
                led.style.background = '#222';
            });
            leds[CENTRO_LED].classList.add('centro', 'ativo');

            if (!temA || !temB) return;

            const maxDesvio = 0.6;
            const fator = (desvioMetros / maxDesvio) * (TOTAL_LEDS / 2);
            let alvo = Math.round(CENTRO_LED - fator);
            alvo = Math.max(0, Math.min(TOTAL_LEDS - 1, alvo));

            const qtd = Math.max(1, Math.abs(alvo - CENTRO_LED));
            const dir = alvo > CENTRO_LED ? 1 : -1;

            for (let i = 1; i <= qtd; i++) {
                const idx = CENTRO_LED + (i * dir);
                if (idx < 0 || idx >= TOTAL_LEDS) break;
                if (Math.abs(idx - CENTRO_LED) <= 4) leds[idx].classList.add('verde');
                else if (Math.abs(idx - CENTRO_LED) <= 9) leds[idx].classList.add('laranja');
                else leds[idx].classList.add('vermelho');
            }
        }

        // ==============================================
        // 🕐 RELÓGIO
        // ==============================================
        function atualizarRelogio() {
            const agora = new Date();
            el.relogio.textContent = agora.toLocaleTimeString('pt-BR', {
                hour: '2-digit', minute: '2-digit', hour12: false
            });
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        // ==============================================
        // 📏 CALCULAR DESVIO LATERAL
        // ==============================================
        function calcularDesvio(lat1, lon1, lat2, lon2, lat3, lon3) {
            const toRad = g => g * Math.PI / 180;
            const dLon = toRad(lon2 - lon1);
            const lat1r = toRad(lat1), lat2r = toRad(lat2), lat3r = toRad(lat3);
            const lon1r = toRad(lon1), lon3r = toRad(lon3);
            const dX = dLon * Math.cos((lat1r + lat2r) / 2);
            const dY = toRad(lat2 - lat1);
            const lenLinha = Math.sqrt(dX * dX + dY * dY);
            if (lenLinha < 0.000001) return 0;

            const dX3 = toRad(lon3 - lon1);
            const dY3 = toRad(lat3 - lat1);
            const proj = (dX3 * dX + dY3 * dY) / (lenLinha * lenLinha);
            const distX = dX3 - dX * proj, distY = dY3 - dY * proj;
            let desv = Math.sqrt(distX * distX + distY * distY) * 6371000;
            if ((dX * dY3 - dY * dX3) < 0) desv = -desv;
            return Math.max(-0.6, Math.min(0.6, desv));
        }

        // ==============================================
        // 🔄 ATUALIZAR TELA
        // ==============================================
        function atualizarTela() {
            el.nomeTalhaoAtual.textContent = nomeTalhaoAtual;
            el.larguraFaixaEl.textContent = larguraFaixa.toFixed(1) + (unidadesMetricas ? ' m' : ' ft');
            el.lat.textContent = lat ? lat.toFixed(6) : '---';
            el.lon.textContent = lon ? lon.toFixed(6) : '---';
            el.rumo.textContent = rumo.toFixed(1) + '°';
            el.vel.textContent = velocidade.toFixed(1) + (unidadesMetricas ? ' km/h' : ' mph');
            el.precisao.textContent = precisao ? precisao.toFixed(2) + ' m' : '---';
            
            const desvioStr = (desvio >= 0 ? '+' : '') + desvio.toFixed(2) + ' m';
            el.desvio.textContent = desvioStr;
            el.desvioGrande.textContent = desvioStr;
            const cor = Math.abs(desvio) > 0.5 ? '#f44' : Math.abs(desvio) > 0.25 ? '#fa0' : '#0f0';
            el.desvio.style.color = cor;
            el.desvioGrande.style.color = cor;

            el.seta.style.transform = `rotate(${rumo}deg)`;
            atualizarLEDs(desvio);
        }

        // ==============================================
        // 💾 GERENCIAMENTO DE TALHÕES
        // ==============================================
        function carregarTalhoesSalvos() {
            try {
                const salvos = localStorage.getItem('talhoesGPS');
                talhoes = salvos ? JSON.parse(salvos) : [];
            } catch (e) { talhoes = []; }
        }
        function salvarTalhoes() {
            localStorage.setItem('talhoesGPS', JSON.stringify(talhoes));
        }
        function renderizarListaTalhoes() {
            carregarTalhoesSalvos();
            const lista = document.getElementById('listaTalhoes');
            if (talhoes.length === 0) {
                lista.innerHTML = '<p class="sem-dados">Nenhum talhão salvo ainda</p>';
                return;
            }
            lista.innerHTML = '';
            talhoes.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'item-talhao';
                div.innerHTML = `
                    <div style="font-weight:bold;margin-bottom:4px;">🌱 ${t.nome}</div>
                    <div style="font-size:12px;color:#888;">Implemento: ${t.largura}m | ${t.data}</div>
                    <div style="font-size:11px;color:#666;margin-top:4px;">${t.obs || ''}</div>
                    <div style="display:flex;gap:8px;margin-top:10px;">
                        <button data-i="${i}" class="btnCarregar" style="padding:6px 14px;background:#06c;border:none;border-radius:4px;color:white;cursor:pointer;font-weight:bold;">Carregar</button>
                        <button data-i="${i}" class="btnExcluir" style="padding:6px 14px;background:#822;border:none;border-radius:4px;color:white;cursor:pointer;font-weight:bold;">Excluir</button>
                    </div>`;
                lista.appendChild(div);
            });
            document.querySelectorAll('.btnCarregar').forEach(b => {
                b.onclick = (e) => {
                    const t = talhoes[e.target.dataset.i];
                    nomeTalhaoAtual = t.nome;
                    larguraFaixa = t.largura;
                    fecharModal();
                    atualizarTela();
                    alert(`✅ Talhão "${t.nome}" carregado!\nImplemento: ${larguraFaixa}m`);
                };
            });
            document.querySelectorAll('.btnExcluir').forEach(b => {
                b.onclick = (e) => {
                    if (confirm('Excluir este talhão?')) {
                        talhoes.splice(e.target.dataset.i, 1);
                        salvarTalhoes();
                        renderizarListaTalhoes();
                    }
                };
            });
        }

        // ==============================================
        // 📋 CONTROLE DO MODAL
        // ==============================================
        el.btnConfig.addEventListener('click', () => {
            el.modal.classList.add('mostrar');
            carregarTalhoesSalvos();
            document.getElementById('larguraPadrao').value = larguraFaixa;
            document.getElementById('tipoLinhaGuia').value = tipoLinha;
            document.getElementById('unidades').value = unidadesMetricas ? 'Métrico (metros, km/h)' : 'Imperial (pés, mph)';
        });

        // Trocar abas
        document.querySelectorAll('[data-aba]').forEach(btn => {
            btn.addEventListener('click', () => {
                const aba = btn.dataset.aba;
                document.querySelectorAll('[data-aba]').forEach(b => b.classList.remove('ativa'));
                btn.classList.add('ativa');
                document.getElementById('aba-criar').style.display = aba === 'criar' ? 'block' : 'none';
                document.getElementById('aba-talhoes').style.display = aba === 'talhoes' ? 'block' : 'none';
                document.getElementById('aba-config').style.display = aba === 'config' ? 'block' : 'none';
                if (aba === 'talhoes') renderizarListaTalhoes();
            });
        });

        // Salvar novo talhão
        document.getElementById('btnSalvarTalhao').addEventListener('click', () => {
            const nome = document.getElementById('nomeTalhao').value.trim();
            const larg = parseFloat(document.getElementById('larguraImplemento').value);
            const obs = document.getElementById('observacao').value.trim();
            
            if (!nome) { alert('⚠️ Digite o nome do talhão!'); return; }
            if (!larg || larg <= 0) { alert('⚠️ Digite a largura do implemento!'); return; }
            
            const talhao = {
                nome, largura: larg, obs,
                lat: lat || 0, lon: lon || 0,
                data: new Date().toLocaleDateString('pt-BR')
            };
            talhoes.unshift(talhao);
            salvarTalhoes();
            
            nomeTalhaoAtual = nome;
            larguraFaixa = larg;
            
            alert(`✅ Talhão "${nome}" salvo!\nImplemento: ${larg}m`);
            document.getElementById('nomeTalhao').value = '';
            document.getElementById('observacao').value = '';
            fecharModal();
            atualizarTela();
        });

        // Aplicar configurações gerais
        document.getElementById('btnAplicarConfig').addEventListener('click', () => {
            larguraFaixa = parseFloat(document.getElementById('larguraPadrao').value) || 12;
            tipoLinha = document.getElementById('tipoLinhaGuia').value;
            unidadesMetricas = document.getElementById('unidades').value.startsWith('Métrico');
            
            localStorage.setItem('larguraPadrao', larguraFaixa);
            localStorage.setItem('tipoLinha', tipoLinha);
            localStorage.setItem('unidadesMetricas', unidadesMetricas);
            
            alert('✅ Configurações salvas!');
            fecharModal();
            atualizarTela();
        });

        // Fechar modal
        document.getElementById('btnFechar').addEventListener('click', fecharModal);
        document.getElementById('btnFecharConfig').addEventListener('click', fecharModal);
        function fecharModal() {
            el.modal.classList.remove('mostrar');
        }

        // ==============================================
        // 📍 BOTÕES DE NAVEGAÇÃO
        // ==============================================
        el.btnA.addEventListener('click', () => {
            if (!lat) { alert('⚠️ Aguarde o sinal GPS!'); return; }
            temA = true;
            pontoA = { lat, lon };
            el.btnA.style.background = '#060';
            el.btnB.disabled = false;
            el.btnB.classList.add('ativo');
            el.linhaCentro.classList.add('ativa');
            atualizarTela();
        });

        el.btnB.addEventListener('click', () => {
            if (!temA) { alert('⚠️ Marque o Ponto A primeiro!'); return; }
            if (!lat) { alert('⚠️ Aguarde o sinal GPS!'); return; }
            temB = true;
            pontoB = { lat, lon };
            el.btnB.style.background = '#008';
            atualizarTela();
        });

        el.btnParar.addEventListener('click', () => {
            desvio = 0;
            temB = false;
            atualizarLEDs(0);
            atualizarTela();
        });

        el.btnReiniciar.addEventListener('click', () => {
            temA = temB = false;
            desvio = 0;
            pontoA = pontoB = null;
            el.btnA.style.background = '';
            el.btnB.style.background = '';
            el.btnB.classList.remove('ativo');
            el.btnB.disabled = true;
            el.linhaCentro.classList.remove('ativa');
            atualizarLEDs(0);
            atualizarTela();
        });

        // ==============================================
        // 📡 GPS — RECEBIMENTO DE DADOS
        // ==============================================
        if (!navigator.geolocation) {
            alert('❌ GPS não suportado! Use Chrome ou Safari.');
        } else {
            navigator.geolocation.watchPosition(
                (posicao) => {
                    lat = posicao.coords.latitude;
                    lon = posicao.coords.longitude;
                    precisao = posicao.coords.accuracy;
                    if (posicao.coords.heading !== null) rumo = posicao.coords.heading;
                    if (posicao.coords.speed !== null) {
                        velocidade = Math.round((posicao.coords.speed * (unidadesMetricas ? 3.6 : 2.237)) * 10) / 10;
                    }

                    // Status do sinal
                    el.statusSinal.classList.remove('sem-sinal', 'gps', 'dgps', 'rtk');
                    if (precisao <= 0.3) {
                        el.statusSinal.textContent = 'RTK-FIX';
                        el.statusSinal.classList.add('rtk');
                    } else if (precisao <= 1) {
                        el.statusSinal.textContent = 'DGPS';
                        el.statusSinal.classList.add('dgps');
                    } else {
                        el.statusSinal.textContent = 'GPS';
                        el.statusSinal.classList.add('gps');
                    }

                    // Calcular desvio
                    if (temA && temB && pontoA && pontoB) {
                        desvio = calcularDesvio(pontoA.lat, pontoA.lon, pontoB.lat, pontoB.lon, lat, lon);
                    }
                    atualizarTela();
                },
                (erro) => {
                    el.statusSinal.classList.remove('rtk', 'dgps', 'gps');
                    el.statusSinal.classList.add('sem-sinal');
                    lat = lon = null;
                    if (erro.code === 1) {
                        el.statusSinal.textContent = 'PERMISSÃO NEGADA';
                    } else if (erro.code === 2) {
                        el.statusSinal.textContent = 'SINAL INDISPONÍVEL';
                    } else {
                        el.statusSinal.textContent = 'ERRO GPS';
                    }
                    atualizarTela();
                },
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
            );
        }

        // ==============================================
        // 🔄 ATUALIZAÇÃO CONTÍNUA
        // ==============================================
        setInterval(() => {
            if (temA && temB && lat && pontoA && pontoB) {
                desvio = calcularDesvio(pontoA.lat, pontoA.lon, pontoB.lat, pontoB.lon, lat, lon);
            }
            atualizarTela();
        }, 300);

        // ==============================================
        // 🚀 CARREGAR CONFIGURAÇÕES SALVAS
        // ==============================================
        const largSalva = localStorage.getItem('larguraPadrao');
        if (largSalva) larguraFaixa = parseFloat(largSalva);
        const tipoSalvo = localStorage.getItem('tipoLinha');
        if (tipoSalvo) tipoLinha = tipoSalvo;
        const unidSalva = localStorage.getItem('unidadesMetricas');
        if (unidSalva !== null) unidadesMetricas = unidSalva === 'true';
        carregarTalhoesSalvos();
        atualizarTela();
    </script>
</body>
</html>
