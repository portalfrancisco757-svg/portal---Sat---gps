<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Sat GPS</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column}
#top{background:#2E7D32;padding:10px;text-align:center;font-weight:900;font-size:18px;border-bottom:4px solid yellow}
#luz{height:24px;background:#111;display:flex;justify-content:center;gap:2px;padding:4px}
.led{width:14px;background:#222}
.led.on{background:#0f0}
#campo{flex:1;background:#2E7D32;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#campo:before{content:"PORTAL SAT GPS 🛰️ PORTAL SAT GPS 🛰️ PORTAL SAT GPS 🛰️";position:absolute;top:50%;left:-20%;font-size:30px;font-weight:900;color:rgba(255,255,255,0.15);transform:rotate(-15deg);white-space:nowrap}
#trator{font-size:50px;z-index:2;transition:0.2s}
#info{background:#fff;color:#000;padding:10px;display:flex;justify-content:space-around;font-weight:900}
#btns{background:#222;padding:6px;display:flex;gap:4px;flex-wrap:wrap}
button{flex:1;height:44px;border:none;border-radius:8px;font-weight:900}
.g{background:#2E7D32;color:#fff}.y{background:yellow;color:#000}.r{background:#900;color:#fff}.c{background:#444;color:#fff}
</style>
</head>
<body>
<div id="top">PORTAL SAT GPS 🛰️</div>
<div id="luz"></div>
<div id="campo"><div id="trator">🚜</div></div>
<div id="info">
<div>LARG <span id="vL">20.0m</span></div>
<div>DESV <span id="vD" style="color:red">0.00m</span></div>
<div>AREA <span id="vA">0.00ha</span></div>
<div id="vG">GPS--</div>
</div>
<div id="btns">
<button class="c" onclick="marcaA()" id="bA">A</button>
<button class="c" onclick="marcaB()" id="bB">B</button>
<button class="y" onclick="config()">LARGURA</button>
<button class="g" onclick="iniciar()" id="bG">INICIAR</button>
</div>
<div id="btns" style="background:#111">
<button class="c" onclick="esconder()" id="bH">👁️ LIMPA</button>
<button class="r" onclick="limpar()">LIMPAR</button>
</div>

<div id="cfg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);padding:20px;z-index:99">
<h2 style="color:#2E7D32">LARGURA 0.5 a 100m</h2><br>
<input type="range" id="rg" min="0.5" max="100" step="0.1" value="20" oninput="setL(this.value)" style="width:100%">
<h1 id="rgV" style="text-align:center;color:#2E7D32">20.0 m</h1><br>
<button onclick="setL(6)">6m</button> <button onclick="setL(12)">12m</button> <button onclick="setL(20)">20m</button> <button onclick="setL(30)">30m</button> <button onclick="setL(100)">100m</button>
<br><br>
<button class="g" style="width:100%;height:50px" onclick="document.getElementById('cfg').style.display='none'">FECHAR E VOLTAR</button>
</div>

<script>
var leds=[];for(var i=0;i<15;i++){var d=document.createElement('div');d.className='led';document.getElementById('luz').appendChild(d);leds.push(d);}
var larg=20,area=0,desv=0,run=false,timer=null,hasA=false;

function luz(v){
for(var i=0;i<leds.length;i++)leds[i].className='led';
leds[7].className='led on';
var q=Math.round(Math.abs(v)/0.3);
for(var i=0;i<q&&i<7;i++){
if(v<0)leds[6-i].className='led on';
else leds[8+i].className='led on';
}
document.getElementById('vD').innerText=v.toFixed(2)+'m';
}
function setL(v){larg=parseFloat(v);document.getElementById('vL').innerText=larg.toFixed(1)+'m';document.getElementById('rgV').innerText=larg.toFixed(1)+' m';document.getElementById('rg').value=larg;}
function config(){document.getElementById('cfg').style.display='block';}
function marcaA(){hasA=true;document.getElementById('bA').innerText='✓A';}
function marcaB(){if(!hasA){alert('Marca A primeiro');return;}document.getElementById('bB').innerText='✓B';}
function iniciar(){
if(run){run=false;clearInterval(timer);document.getElementById('bG').innerText='INICIAR';document.getElementById('vG').innerText='GPS--';return;}
run=true;document.getElementById('bG').innerText='PARAR';document.getElementById('vG').innerText='ON';
var t=0;
timer=setInterval(function(){
t+=0.05;
desv=Math.sin(t)*1.0;
area+=0.001*larg/20;
document.getElementById('vA').innerText=area.toFixed(2)+'ha';
luz(desv);
document.getElementById('trator').style.marginLeft=(desv*20)+'px';
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(function(p){
document.getElementById('vG').innerText='GPS '+p.coords.accuracy.toFixed(0)+'m';
});
}
},120);
}
function limpar(){area=0;document.getElementById('vA').innerText='0.00ha';luz(0);document.getElementById('trator').style.marginLeft='0px';}
function esconder(){
var h=document.getElementById('info').style.display==='none';
document.getElementById('info').style.display=h?'flex':'none';
document.getElementById('top').style.display=h?'block':'none';
document.getElementById('luz').style.display=h?'flex':'none';
document.getElementById('bH').innerText=h?'👁️ LIMPA':'👁️ MOSTRAR';
}
setL(20);luz(0);
</script>
</body>
</html>
