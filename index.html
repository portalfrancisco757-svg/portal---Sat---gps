<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PORTAL SAT GPS - FP Portal Agro Servicios</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#000;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#topbar{background:#000;display:flex;gap:2px;padding:4px 6px}
.led{flex:1;height:14px;background:#1a1a1a;border-radius:2px}
.led.onG{background:#00ff6a;box-shadow:0 0 6px #00ff6a}
.led.onY{background:#ffcc00;box-shadow:0 0 6px #ffcc00}
#header{background:#fff;color:#111;display:flex;align-items:center;justify-content:space-between;padding:6px 10px}
#header.brand{display:flex;align-items:center;gap:8px;font-weight:900}
#header.brand i{font-style:normal;background:#0a5a1a;color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center}
#header b{font-size:18px;color:#0d2a5e}
#rtk{font-size:11px;font-weight:900;padding:4px 10px;border-radius:20px;color:#fff}
.bad{background:#d32f2f}.good{background:#2e7d32}.float{background:#ef6c00}
#wrap{flex:1;display:flex;overflow:hidden}
#left{width:300px;background:#121212;border-right:2px solid #222;display:flex;flex-direction:column}
#left h3{padding:10px;font-size:13px;background:#1e1e1e}
#form{padding:10px;display:flex;flex-direction:column;gap:6px}
#form input,#form select{background:#2a2a2a;border:none;color:#fff;padding:10px;border-radius:6px}
#form button{padding:12px;border:none;border-radius:8px;font-weight:900;color:#fff;background:#2e7d32}
#list{flex:1;overflow:auto;padding:6px}
.item{background:#222;padding:10px;border-radius:8px;margin-bottom:6px;border-left:4px solid #4caf50;cursor:pointer}
.item.active{background:#333;border-left-color:#ffcc00}
.item small{color:#999;display:block}
#mapArea{flex:1;position:relative;background:#2e4d28;overflow:hidden}
#grid, #paint{position:absolute;top:0;left:0;width:100%;height:100%}
#abLine{position:absolute;top:50%;left:5%;right:5%;height:4px;background:#2196f3;display:none;z-index:4}
#abLine span{position:absolute;top:-20px;background:#2196f3;color:#fff;padding:2px 6px;font-weight:900;border-radius:3px}
#abLine.b{right:0}
#tractor{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;font-size:38px;transition:0.2s}
#warn{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:#ff3d00;color:#fff;padding:6px 14px;border-radius:20px;font-weight:900;font-size:12px;z-index:20;display:none}
#bottom{background:#1e1e1e}
#info{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:8px;font-size:11px;color:#aaa}
#info b{display:block;color:#4caf50;font-size:16px}
#btns{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;padding:8px;background:#252525}
#btns button{height:50px;border:none;border-radius:8px;font-weight:900;font-size:12px;color:#fff}
.a{background:#1976d2}.go{background:#2e7d32}.stop{background:#ef6c00}.cl{background:#444}
@media(max-width:900px){#wrap{flex-direction:column}#left{width:100%;height:35vh}#mapArea{height:65vh}}
</style>
</head>
<body>
<div id="topbar"></div>
<div id="header">
<div class="brand"><i>FP</i> PORTAL AGRO SERVICIOS <b>PORTAL SAT GPS</b></div>
<div style="display:flex;gap:8px;align-items:center"><small id="talhaoAtivoTxt">SEM TALHÃO</small><div id="rtk" class="bad">SEM GPS</div></div>
</div>
<div id="wrap">
<div id="left">
<h3>🌱 TALHÕES</h3>
<div id="form">
<input id="nome" placeholder="Nome do talhão - Ex: Lote 1">
<div style="display:flex;gap:6px"><select id="cultura"><option>Soja</option><option>Milho</option><option>Trigo</option><option>Pulverização</option><option>Plantio</option></select><input id="larg" type="number" value="20" style="width:80px"><span style="line-height:38px;color:#fff">m</span></div>
<button onclick="criar()">+ CRIAR E GUARDAR TALHÃO</button>
<button onclick="exportKML()" style="background:#1565c0">📤 EXPORTAR KML</button>
</div>
<div id="list"></div>
</div>
<div id="mapArea">
<canvas id="grid"></canvas><canvas id="paint"></canvas>
<div id="abLine"><span>A</span><span class="b">B</span></div>
<div id="tractor">🚜</div>
<div id="warn">⚠️ ANDA 3 METROS PRA PINTAR</div>
</div>
</div>
<div id="bottom">
<div id="info">
<div>DESVIO<b id="vD">0.00 m</b></div>
<div>LARGURA<b id="vL">20.0 m</b></div>
<div>ÁREA<b id="vA">0.00 ha</b></div>
<div>GPS<b id="vG">--</b></div>
</div>
<div id="btns">
<button class="a" id="btnA" onclick="setA()">MARCAR A</button>
<button class="a" id="btnB" onclick="setB()">MARCAR B</button>
<button class="go" id="btnGo" onclick="toggle()">▶ INICIAR</button>
<button class="cl" onclick="limpar()">LIMPAR</button>
</div>
</div>
<script>
var topbar=document.getElementById('topbar'),leds=[];
for(var i=0;i<21;i++){var e=document.createElement('div');e.className='led';topbar.appendChild(e);leds.push(e);}
function light(v){for(var i=0;i<leds.length;i++)leds[i].className='led';var c=10;leds[c].className='led onG';var q=Math.min(10,Math.round(Math.abs(v)/0.25));for(var j=1;j<=q;j++){if(v<0)leds[c-j].className='led onY';else leds[c+j].className='led onY';}if(Math.abs(v)<0.12)for(var k=8;k<=12;k++)leds[k].className='led onG';}
var grid=document.getElementById('grid'),g=grid.getContext('2d'),paint=document.getElementById('paint'),p=paint.getContext('2d');
function resize(){[grid,paint].forEach(function(c){c.width=c.offsetWidth;c.height=c.offsetHeight});drawGrid();}
function drawGrid(){g.clearRect(0,0,grid.width,grid.height);g.strokeStyle='rgba(255,255,255,0.07)';for(var x=0;x<grid.width;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,grid.height);g.stroke();}for(var y=0;y<grid.height;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(grid.width,y);g.stroke();}}
window.addEventListener('resize',resize);resize();light(0);
var talhoes=JSON.parse(localStorage.getItem('psat_talhoes')||'[]'),ativo=JSON.parse(localStorage.getItem('psat_ativo')||'null'),pts=[],pA=null,pB=null,run=false,watch=null,last=null,area=0,larg=20,distAcum=0;
function save(){localStorage.setItem('psat_talhoes',JSON.stringify(talhoes));if(ativo)localStorage.setItem('psat_ativo',JSON.stringify(ativo));render();}
function criar(){var n=document.getElementById('nome').value.trim();if(!n)return alert('Nome do talhão');larg=parseFloat(document.getElementById('larg').value)||20;var t={id:Date.now(),nome:n,cultura:document.getElementById('cultura').value,larg:larg,area:0,pontos:[],abA:null,abB:null,data:new Date().toLocaleDateString()};talhoes.push(t);ativo=t;document.getElementById('nome').value='';save();load(t.id);}
function render(){var h='';talhoes.forEach(function(t){h+='<div class="item '+(ativo&&ativo.id==t.id?'active':'')+'" onclick="load('+t.id+')"><b>'+t.nome+'</b> '+t.cultura+'<small>'+t.area.toFixed(2)+' ha | '+t.larg+'m | '+t.data+'</small></div>';});document.getElementById('list').innerHTML=h||'<small style="padding:10px;color:#666">Nenhum talhão</small>';if(ativo){document.getElementById('talhaoAtivoTxt').innerText=ativo.nome+' - '+ativo.cultura;document.getElementById('vL').innerText=ativo.larg.toFixed(1)+' m';}}
function load(id){var t=talhoes.find(function(x){return x.id==id});if(!t)return;ativo=t;larg=t.larg;pts=t.pontos||[];pA=t.abA;pB=t.abB;area=t.area||0;document.getElementById('vA').innerText=area.toFixed(2)+' ha';document.getElementById('abLine').style.display=(pA&&pB)?'block':'none';document.getElementById('btnA').innerText=pA?'✓ A':'MARCAR A';document.getElementById('btnB').innerText=pB?'✓ B':'MARCAR B';p.clearRect(0,0,paint.width,paint.height);pts.forEach(function(pt,i){if(i==0)return;drawStrip(pt.cross);});save();}
function dist(a,b){var R=6371000,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180,h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return R*2*Math.asin(Math.sqrt(h));}
function bear(a,b){var y=Math.sin((b.lon-a.lon)*Math.PI/180)*Math.cos(b.lat*Math.PI/180),x=Math.cos(a.lat*Math.PI/180)*Math.sin(b.lat*Math.PI/180)-Math.sin(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.cos((b.lon-a.lon)*Math.PI/180);return(Math.atan2(y,x)*180/Math.PI+360)%360;}
function cross(A,B,P){var d13=dist(A,P)/6371000,br=(bear(A,P)-bear(A,B))*Math.PI/180;return Math.asin(Math.sin(d13)*Math.sin(br))*6371000;}
function drawStrip(cross){var scale=10,cx=paint.width/2,cy=paint.height/2;p.fillStyle='rgba(130,255,90,0.75)';p.fillRect(cx+cross*scale-larg*scale/2,cy-35,larg*scale,70);}
function addPoint(pos){var cr=0;if(pA&&pB)cr=cross(pA,pB,pos);pos.cross=cr;pts.push(pos);if(pts.length>1){var d=dist(pts[pts.length-2],pos);if(d>150)return;distAcum+=d;if(distAcum>=3)document.getElementById('warn').style.display='none';if(distAcum>=3){area+=d*larg/10000;drawStrip(cr);}}document.getElementById('vA').innerText=area.toFixed(2)+' ha';document.getElementById('vD').innerText=cr.toFixed(2)+' m';light(cr);document.getElementById('tractor').style.marginLeft=(cr*10)+'px';if(ativo){ativo.area=area;ativo.pontos=pts;save();}}
function setA(){var src=last||pts[pts.length-1];if(!src)return alert('Inicia GPS primeiro');pA={lat:src.lat,lon:src.lon};if(ativo)ativo.abA=pA;document.getElementById('btnA').innerText='✓ A';if(pA&&pB)document.getElementById('abLine').style.display='block';save();}
function setB(){if(!pA)return alert('Marca A primeiro');var src=last||pts[pts.length-1];if(!src)return;pB={lat:src.lat,lon:src.lon};if(ativo)ativo.abB=pB;document.getElementById('btnB').innerText='✓ B';document.getElementById('abLine').style.display='block';save();}
function toggle(){if(!ativo)return alert('Cria um talhão primeiro');if(run){run=false;if(watch)navigator.geolocation.clearWatch(watch);document.getElementById('btnGo').innerText='▶ INICIAR';document.getElementById('btnGo').className='go';document.getElementById('rtk').innerText='PAUSADO';return;}run=true;distAcum=0;document.getElementById('warn').style.display='block';document.getElementById('btnGo').innerText='⏸ PARAR';document.getElementById('btnGo').className='stop';document.getElementById('rtk').innerText='BUSCANDO...';document.getElementById('rtk').className='bad';watch=navigator.geolocation.watchPosition(function(pos){var acc=pos.coords.accuracy;document.getElementById('vG').innerText=acc.toFixed(0)+'m';document.getElementById('rtk').innerText=acc<1.5?'RTK FIX '+acc.toFixed(1)+'m':acc<4?'FLOAT '+acc.toFixed(0)+'m':acc.toFixed(0)+'m';document.getElementById('rtk').className=acc<1.5?'good':acc<4?'float':'bad';var cur={lat:pos.coords.latitude,lon:pos.coords.longitude};if(!last){last=cur;return;}if(dist(last,cur)<0.6)return;last=cur;addPoint(cur);},function(){document.getElementById('rtk').innerText='SIMULAÇÃO';sim();},{enableHighAccuracy:true,maximumAge:0,timeout:10000});setTimeout(function(){if(!last)sim();},3500);}
function sim(){var t=0;setInterval(function(){t+=0.1;addPoint({lat:-24.5+Math.sin(t)*0.00004,lon:-54.5+Math.cos(t)*0.00004,cross:Math.sin(t)*0.8});document.getElementById('vG').innerText='SIM';},150);}
function limpar(){if(!confirm('Limpar pintura?'))return;pts=[];area=0;distAcum=0;p.clearRect(0,0,paint.width,paint.height);document.getElementById('vA').innerText='0.00 ha';if(ativo){ativo.pontos=[];ativo.area=0;save();}}
function exportKML(){if(!ativo||pts.length==0)return alert('Sem dados');var kml='<?xml version="1.0"?><kml><Document><name>'+ativo.nome+'</name><Placemark><LineString><coordinates>';pts.forEach(function(pt){kml+=pt.lon+','+pt.lat+',0 ';});kml+='</coordinates></LineString></Placemark></Document></kml>';var b=new Blob([kml],{type:'application/kml'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=ativo.nome+'.kml';a.click();}
render();if(ativo)load(ativo.id);
</script>
</body>
</html>
