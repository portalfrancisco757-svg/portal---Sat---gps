<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Portal Sat GPS 🛰️</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#101418;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

header{
  height:65px;
  background:#172027;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:2px solid #29343c;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.logo span{
  color:#45d66b;
}

#signal{
  padding:7px 11px;
  border-radius:8px;
  background:#333;
  font-size:13px;
}

#map{
  position:absolute;
  top:65px;
  bottom:215px;
  left:0;
  right:0;
  background:#18251c;
  overflow:hidden;
}

canvas{
  width:100%;
  height:100%;
}

.panel{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:215px;
  background:#172027;
  border-top:2px solid #29343c;
  padding:8px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.stat{
  background:#202b32;
  border-radius:7px;
  padding:6px;
  text-align:center;
}

.stat small{
  display:block;
  color:#9eabb3;
  font-size:10px;
}

.stat b{
  display:block;
  font-size:15px;
  margin-top:3px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:7px;
}

button{
  border:0;
  border-radius:7px;
  min-height:42px;
  background:#2b3941;
  color:#fff;
  font-weight:bold;
  font-size:12px;
}

button:active{
  transform:scale(.97);
}

.green{
  background:#15853b;
}

.red{
  background:#a72e2e;
}

.blue{
  background:#17669b;
}

input{
  width:100%;
  height:37px;
  border:0;
  border-radius:6px;
  background:#26333a;
  color:#fff;
  padding:0 9px;
}

.settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:7px;
}

.label{
  font-size:10px;
  color:#9eabb3;
  margin-bottom:3px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🛰️ <span>Portal Sat GPS</span></div>
  <div id="signal">GPS aguardando...</div>
</header>

<div id="map">
  <canvas id="canvas"></canvas>
</div>

<div class="panel">

  <div class="stats">

    <div class="stat">
      <small>VELOCIDADE</small>
      <b id="speed">0.0 km/h</b>
    </div>

    <div class="stat">
      <small>RUMO</small>
      <b id="heading">---</b>
    </div>

    <div class="stat">
      <small>PRECISÃO</small>
      <b id="accuracy">---</b>
    </div>

    <div class="stat">
      <small>ÁREA</small>
      <b id="area">0.000 ha</b>
    </div>

  </div>

  <div class="stats" style="margin-top:6px">

    <div class="stat">
      <small>LATITUDE</small>
      <b id="lat">---</b>
    </div>

    <div class="stat">
      <small>LONGITUDE</small>
      <b id="lon">---</b>
    </div>

    <div class="stat">
      <small>PASSADA</small>
      <b id="pass">0</b>
    </div>

    <div class="stat">
      <small>DISTÂNCIA</small>
      <b id="distance">0 m</b>
    </div>

  </div>

  <div class="settings">

    <div>
      <div class="label">LARGURA DO IMPLEMENTO (m)</div>
      <input id="width" type="number" value="6" min="0.5" step="0.1">
    </div>

    <div>
      <div class="label">ESPAÇAMENTO DAS PASSADAS (m)</div>
      <input id="spacing" type="number" value="6" min="0.5" step="0.1">
    </div>

  </div>

  <div class="controls">

    <button class="green" onclick="startGPS()">
      ▶ GPS
    </button>

    <button class="blue" onclick="setA()">
      A — MARCAR
    </button>

    <button class="blue" onclick="setB()">
      B — MARCAR
    </button>

    <button onclick="newField()">
      NOVO TALHÃO
    </button>

    <button onclick="nextPass()">
      PRÓXIMA PASSADA
    </button>

    <button onclick="saveField()">
      💾 SALVAR
    </button>

    <button onclick="clearTrack()">
      LIMPAR
    </button>

    <button class="red" onclick="stopGPS()">
      ■ PARAR
    </button>

  </div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let watchID = null;

let position = null;
let previousPosition = null;

let track = [];

let pointA = null;
let pointB = null;

let passNumber = 0;

let totalDistance = 0;

let heading = null;

let scale = 5;

let centerX = 0;
let centerY = 0;

function resizeCanvas(){

  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

  draw();

}

window.addEventListener("resize",resizeCanvas);

resizeCanvas();


function startGPS(){

  if(!navigator.geolocation){

    alert("Este dispositivo/navegador não possui suporte ao GPS.");

    return;
  }

  if(watchID !== null){

    navigator.geolocation.clearWatch(watchID);
  }

  watchID = navigator.geolocation.watchPosition(

    gpsSuccess,

    gpsError,

    {
      enableHighAccuracy:true,
      maximumAge:1000,
      timeout:10000
    }

  );

  document.getElementById("signal").innerText =
    "🛰️ Procurando GPS...";

}


function stopGPS(){

  if(watchID !== null){

    navigator.geolocation.clearWatch(watchID);

    watchID = null;

  }

  document.getElementById("signal").innerText =
    "GPS parado";

}


function gpsSuccess(pos){

  const c = pos.coords;

  previousPosition = position;

  position = {

    lat:c.latitude,
    lon:c.longitude,

    accuracy:c.accuracy || 0,

    speed:c.speed || 0

  };


  if(previousPosition){

    const d = distanceMeters(

      previousPosition.lat,
      previousPosition.lon,

      position.lat,
      position.lon

    );

    if(d < 100){

      totalDistance += d;

    }

  }


  track.push(position);

  if(track.length > 5000){

    track.shift();

  }


  if(previousPosition){

    heading = bearing(

      previousPosition.lat,
      previousPosition.lon,

      position.lat,
      position.lon

    );

  }


  updateInterface();

  draw();

}


function gpsError(error){

  let msg="Erro no GPS.";

  if(error.code===1)
    msg="Permissão de localização negada.";

  if(error.code===2)
    msg="Localização indisponível.";

  if(error.code===3)
    msg="Tempo esgotado procurando GPS.";

  document.getElementById("signal").innerText=msg;

}


function updateInterface(){

  if(!position)return;

  document.getElementById("lat").innerText =
    position.lat.toFixed(7);

  document.getElementById("lon").innerText =
    position.lon.toFixed(7);

  document.getElementById("accuracy").innerText =
    position.accuracy.toFixed(1)+" m";


  let kmh=(position.speed||0)*3.6;

  document.getElementById("speed").innerText =
    kmh.toFixed(1)+" km/h";


  if(heading!==null){

    document.getElementById("heading").innerText =
      compass(heading)+" "+Math.round(heading)+"°";

  }


  document.getElementById("distance").innerText =
    totalDistance.toFixed(1)+" m";


  document.getElementById("pass").innerText =
    passNumber;


  if(position.accuracy<=0.5){

    document.getElementById("signal").innerText =
      "🟢 RTK / alta precisão";

  }else if(position.accuracy<=3){

    document.getElementById("signal").innerText =
      "🟢 GPS bom";

  }else if(position.accuracy<=10){

    document.getElementById("signal").innerText =
      "🟡 GPS médio";

  }else{

    document.getElementById("signal").innerText =
      "🔴 GPS fraco";

  }

}


function setA(){

  if(!position){

    alert("Primeiro ligue o GPS.");

    return;
  }

  pointA={

    lat:position.lat,
    lon:position.lon

  };

  alert("Ponto A marcado.");

  draw();

}


function setB(){

  if(!position){

    alert("Primeiro ligue o GPS.");

    return;
  }

  if(!pointA){

    alert("Marque o ponto A primeiro.");

    return;
  }

  pointB={

    lat:position.lat,
    lon:position.lon

  };

  alert("Ponto B marcado. Linha AB criada.");

  draw();

}


function nextPass(){

  if(!pointA || !pointB){

    alert("Primeiro marque A e B.");

    return;
  }

  passNumber++;

  draw();

}


function newField(){

  if(!confirm("Começar um novo talhão?"))return;

  track=[];

  pointA=null;

  pointB=null;

  passNumber=0;

  totalDistance=0;

  document.getElementById("area").innerText="0.000 ha";

  draw();

}


function clearTrack(){

  track=[];

  totalDistance=0;

  draw();

}


function saveField(){

  const data={

    nome:"Portal Sat GPS",

    data:new Date().toISOString(),

    pontoA:pointA,

    pontoB:pointB,

    percurso:track,

    largura:document.getElementById("width").value,

    espacamento:document.getElementById("spacing").value

  };


  const blob=new Blob(

    [JSON.stringify(data,null,2)],

    {type:"application/json"}

  );


  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;

  a.download="portal-sat-gps-talhao.json";

  a.click();

  URL.revokeObjectURL(url);

}


function draw(){

  const w=canvas.clientWidth;

  const h=canvas.clientHeight;

  ctx.clearRect(0,0,w,h);

  ctx.fillStyle="#18251c";

  ctx.fillRect(0,0,w,h);


  // grade

  ctx.strokeStyle="#263a2b";

  ctx.lineWidth=1;

  const grid=50;

  for(let x=0;x<w;x+=grid){

    ctx.beginPath();

    ctx.moveTo(x,0);

    ctx.lineTo(x,h);

    ctx.stroke();

  }

  for(let y=0;y<h;y+=grid){

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(w,y);

    ctx.stroke();

  }


  if(!position)return;


  centerX=w/2;

  centerY=h/2;


  // percurso

  if(track.length>1){

    ctx.strokeStyle="#40d66a";

    ctx.lineWidth=4;

    ctx.beginPath();

    track.forEach((p,i)=>{

      const xy=project(p);

      if(i===0)

        ctx.moveTo(xy.x,xy.y);

      else

        ctx.lineTo(xy.x,xy.y);

    });

    ctx.stroke();

  }


  // linha AB

  if(pointA && pointB){

    const a=project(pointA);

    const b=project(pointB);

    ctx.strokeStyle="#ffffff";

    ctx.lineWidth=3;

    ctx.setLineDash([10,8]);

    ctx.beginPath();

    ctx.moveTo(a.x,a.y);

    ctx.lineTo(b.x,b.y);

    ctx.stroke();

    ctx.setLineDash([]);


    // passadas paralelas

    drawParallelLines(a,b);

  }


  // ponto atual

  ctx.fillStyle="#ff3333";

  ctx.beginPath();

  ctx.arc(centerX,centerY,8,0,Math.PI*2);

  ctx.fill();


  // direção

  if(heading!==null){

    const r=25;

    const rad=(heading-90)*Math.PI/180;

    ctx.strokeStyle="#ff3333";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(centerX,centerY);

    ctx.lineTo(

      centerX+Math.cos(rad)*r,

      centerY+Math.sin(rad)*r

    );

    ctx.stroke();

  }

}


function project(p){

  if(!position)

    return{x:centerX,y:centerY};


  const latMeters=

    (p.lat-position.lat)*111320;

  const lonMeters=

    (p.lon-position.lon)*

    111320*

    Math.cos(position.lat*Math.PI/180);


  return{

    x:centerX+lonMeters*scale,

    y:centerY-latMeters*scale

  };

}


function drawParallelLines(a,b){

  const spacing=

    parseFloat(document.getElementById("spacing").value)||6;


  const dx=b.x-a.x;

  const dy=b.y-a.y;

  const len=Math.sqrt(dx*dx+dy*dy);

  if(len===0)return;


  const nx=-dy/len;

  const ny=dx/len;


  ctx.strokeStyle="#e5d84a";

  ctx.lineWidth=2;


  for(let i=-5;i<=5;i++){

    if(i===0)continue;


    const off=i*spacing*scale;


    const ax=a.x+nx*off;

    const ay=a.y+ny*off;

    const bx=b.x+nx*off;

    const by=b.y+ny*off;


    ctx.beginPath();

    ctx.moveTo(ax,ay);

    ctx.lineTo(bx,by);

    ctx.stroke();

  }

}


function distanceMeters(lat1,lon1,lat2,lon2){

  const R=6371000;

  const p1=lat1*Math.PI/180;

  const p2=lat2*Math.PI/180;

  const dp=(lat2-lat1)*Math.PI/180;

  const dl=(lon2-lon1)*Math.PI/180;


  const a=

    Math.sin(dp/2)**2+

    Math.cos(p1)*Math.cos(p2)*

    Math.sin(dl/2)**2;


  return 2*R*Math.atan2(

    Math.sqrt(a),

    Math.sqrt(1-a)

  );

}


function bearing(lat1,lon1,lat2,lon2){

  const p1=lat1*Math.PI/180;

  const p2=lat2*Math.PI/180;

  const dl=(lon2-lon1)*Math.PI/180;


  const y=Math.sin(dl)*Math.cos(p2);

  const x=

    Math.cos(p1)*Math.sin(p2)-

    Math.sin(p1)*Math.cos(p2)*Math.cos(dl);


  return(Math.atan2(y,x)*180/Math.PI+360)%360;

}


function compass(deg){

  const dirs=[

    "N","NE","L","SE",

    "S","SO","O","NO"

  ];

  return dirs[Math.round(deg/45)%8];

}

</script>

</body>
</html>
