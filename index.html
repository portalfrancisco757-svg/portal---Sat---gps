<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PORTAL SAT GPS 🛰️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        html, body {
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; position: fixed;
            background: #000; color: #fff;
            user-select: none;
        }

        .tela {
            width: 100%; height: 100%;
            display: grid;
            grid-template-rows: 45px 1fr;
            grid-template-columns: 50px 1fr 50px;
            grid-template-areas:
                "topo topo topo"
                "esq mapa dir";
            gap: 0;
            background: #000;
        }

        .topo {
            grid-area: topo;
            background: #0b2344;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; border-bottom: 2px solid #2E7D32;
        }
        .logo { font-size: 18px; font-weight: bold; color: #4ade80; }
        .status-gps { display: flex; gap: 12px; font-size: 11px; align-items: center; }
        .bolinha { width: 11px; height: 11px; border-radius: 50%; background: #444; }
        .bolinha.verde { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .bolinha.amarela { background: #eab308; }
        .bolinha.vermelha { background: #ef4444; }

        .barra-luz {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
            width: 300px; height: 20px;
            background: #1a1a1a; border: 2px solid #333; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            z-index: 150;
        }
        .luz-esq, .luz-dir {
            height: 14px; width: 130px;
            background: linear-gradient(90deg, #ef4444, #eab308, #22c55e);
            border-radius: 2px; transform: scaleX(0); transition: transform 0.1s ease;
        }
        .luz-esq { transform-origin: right; margin-right: 2px; }
        .luz-dir { transform-origin: left; margin-left: 2px; }
        .centro-luz { width: 3px; height: 18px; background: #fff; border-radius: 2px; z-index: 5; }
        .desvio-valor {
            position: absolute; bottom: -22px; font-size: 14px; font-weight: bold;
            color: #ffd700; text-shadow: 0 0 3px #000;
        }

        .painel-esq, .painel-dir {
            background: #0f172a;
            display: flex; flex-direction: column; align-items: center;
            padding: 8px 4px; gap: 8px;
            border-right: 1px solid #2E7D32;
        }
        .painel-dir { border-right: none; border-left: 1px solid #2E7D32; }
        .btn {
            width: 40px; height: 40px; padding: 0; font-size: 18px;
            border-radius: 6px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            background: #1e293b; color: #fff;
        }
        .btn:active { transform: scale(0.92); background: #334155; }
        .btn.ativo { background: #2E7D32; box-shadow: inset 0 0 6px rgba(0,0,0,0.5); }
        .btn.pintando { background: #22c55e; animation: piscar 1s infinite; }
        @keyframes piscar { 0% {opacity:1;} 50% {opacity:0.6;} 100% {opacity:1;} }

        .mapa {
            grid-area: mapa;
            background: #050508;
            position: relative; overflow: hidden;
            transition: transform 0.3s ease;
        }
        .mapa.modo-2d {
            background-image: 
                linear-gradient(rgba(46, 125, 50, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 125, 50, 0.12) 1px, transparent 1px);
            background-size: 25px 25px;
            transform: perspective(0px) rotateX(0deg) !important;
        }
        .mapa.modo-3d {
            background-image: 
                linear-gradient(rgba(46, 125, 50, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 125, 50, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            transform: perspective(600px) rotateX(50deg) scale(1.2);
            transform-origin: center bottom;
        }

        #canvasCobertura {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        .linha-ab {
            position: absolute; top: 0; bottom: 0; left: 50%;
            width: 3px; background: linear-gradient(180deg, #22c55e, #4ade80, #22c55e);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
            transform: translateX(-50%);
            z-index: 20; display: none;
        }
        .ponto-a, .ponto-b {
            position: absolute; left: 50%;
            transform: translateX(-50%);
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 15px; color: #fff;
            z-index: 25; display: none;
        }
        .ponto-a { background: #22c55e; box-shadow: 0 0 10px #22c55e; bottom: 30px; }
        .ponto-b { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; top: 30px; }

        /* ========== FLECHA — APONTA PARA PONTO B E SEGUE GPS ========== */
        .trator {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 0; height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-bottom: 32px solid #ffd700;
            filter: drop-shadow(0 0 10px #ffd700);
            z-index: 30;
            transition: transform 0.15s linear;
        }

        .dados-flutuantes {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.75); padding: 8px 10px;
            border-radius: 6px; border: 1px solid #2E7D32;
            font-size: 11px; line-height: 1.6;
            z-index: 40;
        }
        .dados-flutuantes span { color: #4ade80; font-weight: bold; }

        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92); z-index: 200;
            display: none; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #1a1a2e; padding: 20px; border-radius: 10px;
            border: 2px solid #2E7D32; width: 90%; max-width: 380px;
        }
        .modal-content h3 { color: #4ade80; margin-bottom: 15px; text-align: center; }
        .campo { margin-bottom: 12px; }
        .campo label { display: block; margin-bottom: 4px; color: #ccc; font-size: 13px; }
        .campo input, .campo select {
            width: 100%; padding: 8px; border-radius: 4px; border: none;
            background: #252540; color: #fff; font-size: 15px;
        }
        .modal-botoes { display: flex; gap: 8px; margin-top: 15px; }
        .btn-modal { flex: 1; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-modal.verde { background: #2E7D32; color: white; }
        .btn-modal.cinza { background: #444; color: white; }
    </style>
</head>
<body>

<div class="tela">
    <div class="topo">
        <div class="logo">🛰️ PORTAL SAT GPS</div>
        <div class="status-gps">
            <div class="status-item"><span id="bolinhaGps" class="bolinha"></span> GPS</div>
            <div class="status-item">📡 <span id="satNum">0/12</span></div>
            <div class="status-item">🎯 <span id="precisao">---</span></div>
            <div class="status-item" id="modoGnss">GNSS</div>
            <div class="status-item">⏱️ <span id="hora">00:00:00</span></div>
        </div>
    </div>

    <div class="barra-luz" id="barraLuz">
        <div class="luz-esq" id="luzEsq"></div>
        <div class="centro-luz"></div>
        <div class="luz-dir" id="luzDir"></div>
        <div class="desvio-valor" id="desvioValor">0.00 m</div>
    </div>

    <div class="painel-esq">
        <button class="btn" id="btnPintar" onclick="alternarPintura()" title="Pintar">🖌️</button>
        <button class="btn" onclick="criarPontoA()" title="Ponto A">📍</button>
        <button class="btn" onclick="criarPontoB()" title="Ponto B">🎯</button>
        <button class="btn" onclick="alternarModoVisual()" id="btnModoVisual" title="2D/3D">📐</button>
        <button class="btn" onclick="paralelas()" title="Paralelas">〰️</button>
    </div>

    <div class="mapa modo-2d" id="mapa">
        <canvas id="canvasCobertura"></canvas>
        <div class="linha-ab" id="linhaAB"></div>
        <div class="ponto-a" id="pontoA">A</div>
        <div class="ponto-b" id="pontoB">B</div>
        <div class="trator" id="trator"></div>

        <div class="dados-flutuantes">
            <div>Lat: <span id="dLat">--.------</span></div>
            <div>Lon: <span id="dLon">--.------</span></div>
            <div>Vel: <span id="dVel">0.0</span> km/h</div>
            <div>Rumo: <span id="dRumo">000°</span></div>
            <div>Faixa: <span id="dLargura">24.0m</span></div>
            <div>Área: <span id="dArea">0.00ha</span></div>
        </div>
    </div>

    <div class="painel-dir">
        <button class="btn" onclick="abrirConfig()" title="Configurações">⚙️</button>
        <button class="btn" onclick="salvarTalhao()" title="Salvar">💾</button>
        <button class="btn" onclick="carregarTalhao()" title="Carregar">📂</button>
        <button class="btn" onclick="limparTudo()" title="Limpar">🗑️</button>
        <button class="btn" onclick="zoomIn()" title="Aproximar">➕</button>
        <button class="btn" onclick="zoomOut()" title="Afastar">➖</button>
    </div>
</div>

<div class="modal" id="modalConfig">
    <div class="modal-content">
        <h3>⚙️ CONFIGURAÇÕES</h3>
        <div class="campo">
            <label>Largura do Implemento (m)</label>
            <input type="number" id="inpLargura" value="24.0" step="0.1">
        </div>
        <div class="campo">
            <label>Nome do Talhão</label>
            <input type="text" id="inpTalhao" value="Talhão 1">
        </div>
        <div class="campo">
            <label>Correção GNSS</label>
            <select id="inpCorrecao">
                <option value="gnss">GNSS (2-5m)</option>
                <option value="sbas">SBAS (30-50cm)</option>
                <option value="rtk">RTK (1-2cm)</option>
            </select>
        </div>
        <div class="modal-botoes">
            <button class="btn-modal verde" onclick="salvarConfig()">✅ Salvar</button>
            <button class="btn-modal cinza" onclick="fecharConfig()">❌ Cancelar</button>
        </div>
    </div>
</div>

<script>
const estado = {
    lat: -26.3412, lon: -54.6879,
    velocidade: 0, rumo: 0,
    pontoA: null, pontoB: null,
    largura: 24.0, desvio: 0, area: 0,
    talhao: 'Talhão 1', correcao: 'gnss',
    modoVisual: '2d', escala: 1,
    ultimoPonto: null, distanciaPercorrida: 0,
    pintando: false
};

const canvas = document.getElementById('canvasCobertura');
const ctx = canvas.getContext('2d');
const mapa = document.getElementById('mapa');

function ajustarCanvas() {
    const rect = mapa.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
}
ajustarCanvas();
window.addEventListener('resize', ajustarCanvas);

setInterval(() => {
    const h = new Date();
    document.getElementById('hora').textContent = h.toLocaleTimeString('pt-BR', {hour12: false});
}, 1000);

function iniciarGPS() {
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
            pos => {
                estado.lat = pos.coords.latitude;
                estado.lon = pos.coords.longitude;
                estado.velocidade = pos.coords.speed ? pos.coords.speed * 3.6 : 0;
                // ========== FLECHA APONTA PARA O PONTO B ==========
                if (estado.pontoA && estado.pontoB) {
                    // Calcula direção do ponto atual → Ponto B
                    const dLat = estado.pontoB.lat - estado.lat;
                    const dLon = estado.pontoB.lon - estado.lon;
                    estado.rumo = (Math.atan2(dLon, dLat) * 180 / Math.PI + 360) % 360;
                } else {
                    estado.rumo = pos.coords.heading || estado.rumo;
                }
                atualizarDesvio();
                atualizarTela();
                if (estado.pintando) desenharCobertura();
            },
            err => console.log("GPS — simulação ativada"),
            { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
        );
    }
    setInterval(() => {
        estado.lat += 0.000003;
        estado.lon += 0.000001;
        // ========== FLECHA APONTA PARA PONTO B ==========
        if (estado.pontoA && estado.pontoB) {
            const dLat = estado.pontoB.lat - estado.lat;
            const dLon = estado.pontoB.lon - estado.lon;
            estado.rumo = (Math.atan2(dLon, dLat) * 180 / Math.PI + 360) % 360;
        } else {
            estado.rumo = (estado.rumo + 0.5) % 360;
        }
        estado.velocidade = 8 + Math.random() * 2;
        atualizarDesvio();
        atualizarTela();
        if (estado.pintando) desenharCobertura();
    }, 500);
}

function atualizarDesvio() {
    if (!estado.pontoA || !estado.pontoB) {
        estado.desvio = 0;
        return;
    }
    const lonCentral = (estado.pontoA.lon + estado.pontoB.lon) / 2;
    const metrosPorGrau = 111320 * Math.cos(estado.lat * Math.PI / 180);
    estado.desvio = (estado.lon - lonCentral) * metrosPorGrau;
}

function atualizarTela() {
    document.getElementById('dLat').textContent = estado.lat.toFixed(6);
    document.getElementById('dLon').textContent = estado.lon.toFixed(6);
    document.getElementById('dVel').textContent = estado.velocidade.toFixed(1);
    document.getElementById('dRumo').textContent = Math.round(estado.rumo) + '°';
    document.getElementById('dLargura').textContent = estado.largura.toFixed(1) + 'm';
    document.getElementById('dArea').textContent = estado.area.toFixed(2) + 'ha';

    // ========== FLECHA GIRA CONFORME RUMO DO GPS ==========
    document.getElementById('trator').style.transform = 
        `translate(-50%, -50%) rotate(${estado.rumo}deg)`;

    atualizarBarraLuz();

    const bolinha = document.getElementById('bolinhaGps');
    bolinha.className = 'bolinha ' + (estado.correcao==='rtk'?'verde':estado.correcao==='sbas'?'amarela':'');
    document.getElementById('precisao').textContent = 
        estado.correcao==='rtk'?'2cm':estado.correcao==='sbas'?'40cm':'2-5m';
    document.getElementById('modoGnss').textContent = estado.correcao.toUpperCase();

    document.getElementById('linhaAB').style.display = 
        (estado.pontoA && estado.pontoB) ? 'block' : 'none';
    document.getElementById('pontoA').style.display = estado.pontoA ? 'flex' : 'none';
    document.getElementById('pontoB').style.display = estado.pontoB ? 'flex' : 'none';
}

function atualizarBarraLuz() {
    if (!estado.pontoA || !estado.pontoB) {
        document.getElementById('luzEsq').style.transform = 'scaleX(0)';
        document.getElementById('luzDir').style.transform = 'scaleX(0)';
        document.getElementById('desvioValor').textContent = '0.00 m';
        return;
    }
    const desvio = estado.desvio;
    const maxDesvio = 0.5;
    const escala = Math.min(Math.abs(desvio) / maxDesvio, 1);

    if (desvio < -0.02) {
        document.getElementById('luzEsq').style.transform = `scaleX(${escala})`;
        document.getElementById('luzDir').style.transform = 'scaleX(0)';
    } else if (desvio > 0.02) {
        document.getElementById('luzEsq').style.transform = 'scaleX(0)';
        document.getElementById('luzDir').style.transform = `scaleX(${escala})`;
    } else {
        document.getElementById('luzEsq').style.transform = 'scaleX(0)';
        document.getElementById('luzDir').style.transform = 'scaleX(0)';
    }
    document.getElementById('desvioValor').textContent = desvio.toFixed(2) + ' m';
}

function alternarPintura() {
    estado.pintando = !estado.pintando;
    const btn = document.getElementById('btnPintar');
    if (estado.pintando) {
        btn.classList.add('pintando');
        btn.innerHTML = '⏹';
        estado.ultimoPonto = { lat: estado.lat, lon: estado.lon };
    } else {
        btn.classList.remove('pintando');
        btn.innerHTML = '🖌️';
        estado.ultimoPonto = null;
    }
}

// ========== COBERTURA ACOMPANHA A DIREÇÃO DA FLECHA ==========
function desenharCobertura() {
    const pxPorMetro = 8 / estado.escala;
    const larguraFaixa = estado.largura * pxPorMetro;

    if (!estado.ultimoPonto) {
        estado.ultimoPonto = { lat: estado.lat, lon: estado.lon };
        return;
    }

    const dx = (estado.lon - estado.ultimoPonto.lon) * 111000 * Math.cos(estado.lat * Math.PI/180) * pxPorMetro;
    const dy = (estado.lat - estado.ultimoPonto.lat) * 111000 * pxPorMetro;
    const dist = Math.sqrt(dx*dx + dy*dy) / pxPorMetro;
    estado.distanciaPercorrida += dist;
    estado.area = (estado.distanciaPercorrida * estado.largura) / 10000;

    // ========== COBERTURA GIRA JUNTO COM A FLECHA ==========
    const anguloRadar = estado.rumo * Math.PI / 180;

    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(anguloRadar); // ← Cobertura acompanha a direção
    ctx.fillStyle = 'rgba(34, 197, 94, 0.45)';
    ctx.fillRect(-larguraFaixa/2, -dist/2, larguraFaixa, dist);
    ctx.restore();

    estado.ultimoPonto = { lat: estado.lat, lon: estado.lon };
}

function criarPontoA() {
    estado.pontoA = { lat: estado.lat, lon: estado.lon };
    estado.pontoB = null;
    estado.ultimoPonto = null;
    estado.distanciaPercorrida = 0;
    estado.area = 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    atualizarTela();
}

function criarPontoB() {
    if (!estado.pontoA) return;
    estado.pontoB = { lat: estado.lat, lon: estado.lon };
    atualizarTela();
}

function alternarModoVisual() {
    estado.modoVisual = estado.modoVisual === '2d' ? '3d' : '2d';
    mapa.classList.remove('modo-2d', 'modo-3d');
    mapa.classList.add('modo-' + estado.modoVisual);
    document.getElementById('btnModoVisual').classList.toggle('ativo');
}

function paralelas() {}
function zoomIn() { estado.escala *= 1.3; }
function zoomOut() { estado.escala /= 1.3; }

function abrirConfig() {
    document.getElementById('modalConfig').style.display = 'flex';
    document.getElementById('inpLargura').value = estado.largura;
    document.getElementById('inpTalhao').value = estado.talhao;
    document.getElementById('inpCorrecao').value = estado.correcao;
}
function fecharConfig() {
    document.getElementById('modalConfig').style.display = 'none';
}
function salvarConfig() {
    estado.largura = parseFloat(document.getElementById('inpLargura').value);
    estado.talhao = document.getElementById('inpTalhao').value;
    estado.correcao = document.getElementById('inpCorrecao').value;
    localStorage.setItem('portalSatConfig', JSON.stringify(estado));
    fecharConfig();
    atualizarTela();
}

function salvarTalhao() {
    localStorage.setItem('talhao_' + estado.talhao, JSON.stringify({
        pontoA: estado.pontoA, pontoB: estado.pontoB,
        largura: estado.largura, area: estado.area,
        distancia: estado.distanciaPercorrida
    }));
}

function carregarTalhao() {
    const nome = prompt('Nome do talhão:');
    if (!nome) return;
    const dados = localStorage.getItem('talhao_' + nome);
    if (dados) {
        const t = JSON.parse(dados);
        estado.pontoA = t.pontoA; estado.pontoB = t.pontoB;
        estado.largura = t.largura; estado.area = t.area || 0;
        estado.distanciaPercorrida = t.distancia || 0;
        atualizarTela();
    }
}

function limparTudo() {
    estado.pontoA = null; estado.pontoB = null;
    estado.area = 0; estado.distanciaPercorrida = 0;
    estado.ultimoPonto = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    atualizarTela();
}

window.onload = () => {
    const cfg = localStorage.getItem('portalSatConfig');
    if (cfg) Object.assign(estado, JSON.parse(cfg));
    ajustarCanvas();
    atualizarTela();
    iniciarGPS();
};
</script>
</body>
</html>
