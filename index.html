<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Sat GPS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06110b;color:#fff;font-family:Arial}button{font:inherit;color:inherit}
#app{height:100%;position:relative;overflow:hidden;background:linear-gradient(135deg,#6c8d51,#29462e)}
.map{position:absolute;inset:0;background:repeating-linear-gradient(12deg,transparent 0 38px,#6f9155 39px 41px),repeating-linear-gradient(102deg,transparent 0 70px,#304c30 71px 74px),radial-gradient(circle,#789b57,#29462e 75%)}
.field{position:absolute;left:7%;top:14%;width:72%;height:73%;border:3px solid #20d94e;border-radius:8%;transform:rotate(-3deg);background:#2c963c22}.rows i{display:none}.ab{position:absolute;z-index:4;left:50%;top:7%;height:100%;width:10px;background:#1675ff;border-radius:8px;box-shadow:0 0 10px #1675ff,0 0 2px #fff}.cover{position:absolute;z-index:3;left:50%;top:46%;height:58%;width:9%;transform:translateX(-50%);background:#354cff88;border-left:2px solid #8cb5ff;border-right:2px solid #8cb5ff}.pt{position:absolute;z-index:6;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:bold}.a{left:49%;top:15%;background:#10bd49}.b{left:49%;bottom:10%;background:#1978ff}
.tr{position:absolute;z-index:8;left:50%;top:55%;font-size:108px;line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 5px #0008);text-shadow:0 2px 2px #0005}.tr svg{width:100%}
.top{position:absolute;z-index:20;top:0;left:0;right:0;height:92px;background:#03130dee;border-bottom:2px solid #18a746;display:flex;align-items:center;padding:8px 18px;gap:18px}.brand{width:245px;display:flex;align-items:center;gap:9px}.gear{width:58px;height:58px;border-radius:50%;background:#16863c;border:3px solid #57e176;display:grid;place-items:center;font-size:27px}.brand b{font-size:20px}.brand small{display:block;color:#a5b6aa;font-size:10px}.gnss{margin:auto;border:1px solid #294b37;border-radius:30px;padding:15px 28px;background:#071b11}.ok{color:#1fe052}
.light{position:absolute;z-index:22;left:24%;right:30%;top:98px;height:53px;border:2px solid #2a503a;border-radius:30px;background:#07150d;padding:12px 20px;display:flex;gap:3px}.led{flex:1;background:#12aa3b;border-radius:3px}.y{background:#e4c32c}.r{background:#e72f32}.c{width:5px;background:#fff}.dev{position:absolute;z-index:23;left:50%;top:151px;transform:translateX(-50%);background:#071b11;border-radius:20px;padding:5px 22px}
.left{position:absolute;z-index:25;left:12px;top:112px;display:flex;flex-direction:column;gap:8px}.lb{width:55px;height:55px;border:1px solid #28563a;border-radius:13px;background:#061711;display:grid;place-items:center;font-size:22px}.on{background:#087b2e!important;border-color:#36dc5d!important}
.menu{position:absolute;z-index:30;right:0;top:92px;bottom:0;width:27%;min-width:300px;background:#03100af7;border-left:2px solid #178e3e;padding:12px}.mh{height:45px;border:1px solid #254b36;border-radius:12px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.close{border:0;background:none;font-size:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:9px 0}.mb{height:86px;background:#061810;border:1px solid #214d35;border-radius:13px;display:grid;place-items:center;align-content:center;gap:5px}.mb i{font-style:normal;font-size:24px}.mb span{font-size:12px}.info{height:59px;margin-top:8px;border:1px solid #214a34;border-radius:12px;background:#061810;display:flex;align-items:center;gap:10px;padding:7px 10px}.info i{font-style:normal;font-size:22px}.info small{display:block;color:#91a296;font-size:10px}.info .arr{margin-left:auto;font-size:22px}.foot{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;margin-top:9px}.foot button{height:44px;border:1px solid #2b5239;border-radius:11px;background:#071811}.green{background:#0ba63a!important}
.reopen{position:absolute;z-index:40;right:14px;top:105px;width:53px;height:53px;border:1px solid #35d85d;border-radius:13px;background:#061711;font-size:23px;display:none}.bottom{position:absolute;z-index:25;left:14px;right:29%;bottom:10px;height:73px;background:#03110af2;border:1px solid #15943d;border-radius:16px;display:flex;align-items:center}.metric{flex:1;text-align:center;border-right:1px solid #173b28}.metric small{display:block;color:#9bab9e;font-size:9px}.metric b{font-size:16px}.play{width:48px;height:48px;margin:0 7px;border-radius:50%;border:1px solid #39df63;background:#0a2b16;color:#53ef78}.toast{position:absolute;z-index:60;bottom:95px;left:50%;transform:translateX(-50%);background:#071b10;border:1px solid #31dc59;border-radius:10px;padding:10px 16px;display:none}.closed .menu{display:none}.closed .reopen{display:block}.closed .bottom{right:14px}
@media(max-width:700px){.menu{width:78%;min-width:0}.brand{width:160px}.brand b{font-size:15px}.gnss{padding:12px;font-size:11px}.bottom{right:7px;left:7px}.metric:nth-last-child(-n+2){display:none}.light{left:18%;right:18%}}
</style>
<body><div id="app"><div class="map"><div class="field"></div><div class="rows"><i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="r4"></i><i class="r5"></i><i class="r6"></i><i class="ab"></i><i class="cover"></i></div><div class="pt a" title="Ponto A">A</div><div class="pt b" title="Ponto B">B</div>
<div class="tr" aria-label="Trator agrícola">🚜</div></div>
<div class="top"><div class="brand"><div class="gear">✦</div><div><b>Portal Sat GPS</b><small>GUIA DE CAMPO</small></div></div><div class="gnss">📡 Antena Via Cabo &nbsp; <span class="ok">● GNSS / RTK</span></div><div>◉ 16 &nbsp;📶</div><div>21:28</div><div>🔋100%</div></div>
<div class="light"><i class="led r"></i><i class="led y"></i><i class="led"></i><i class="led"></i><i class="led"></i><i class="c"></i><i class="led"></i><i class="led"></i><i class="led"></i><i class="led y"></i><i class="led r"></i></div><div class="dev">0,00 m</div>
<div class="left"><button class="lb on">▥</button><button class="lb">🚜</button><button class="lb">⌖</button><button class="lb">🛰</button><button class="lb">🌱</button><button class="lb">3D</button></div>
<aside class="menu" id="menu"><div class="mh">☰ &nbsp; Menu <button class="close" onclick="closeMenu()">×</button></div><div class="grid"><button class="mb on" onclick="toast('A/B')"><i>A↕B</i><span>A/B</span></button><button class="mb" onclick="toast('Máquina')"><i>🚜</i><span>Máquina</span></button><button class="mb" onclick="toast('Operação')"><i>🌱</i><span>Operação</span></button><button class="mb" onclick="toast('Mapa')"><i>🗺</i><span>Mapa</span></button><button class="mb" onclick="toast('GNSS')"><i>🛰</i><span>GNSS</span></button><button class="mb" onclick="toast('Configurações')"><i>⚙</i><span>Configurações</span></button></div><div class="info"><i>🌿</i><div><small>Cultura</small><b>Soja</b></div><span class="arr">›</span></div><div class="info"><i>🧴</i><div><small>Produto</small><b>Soja</b></div><span class="arr">›</span></div><div class="info"><i>↔</i><div><small>Largura do implemento</small><b>24,0 m</b></div><span class="arr">›</span></div><div class="info"><i>◔</i><div><small>Rendimento</small><b>60,0 sc/ha</b></div><span class="arr">›</span></div><div class="foot"><button onclick="closeMenu()">◉ Ocultar abas</button><button class="green" onclick="closeMenu()">⛶ Tela limpa</button></div></aside>
<button class="reopen" onclick="openMenu()">☰</button><div class="bottom"><button class="play" onclick="toast('Cobertura iniciada')">▶</button><div class="metric"><small>VEL</small><b>7,2 km/h</b></div><div class="metric"><small>RUMO</small><b>245°</b></div><div class="metric"><small>DESVIO</small><b>0,03 m</b></div><div class="metric"><small>ÁREA</small><b>12,46 ha</b></div><div class="metric"><small>RENDIMENTO</small><b>62,3 sc/ha</b></div><div class="metric"><small>COBERTURA</small><b>68%</b></div></div><div id="toast" class="toast"></div></div>
<script>function closeMenu(){app.classList.add('closed')}function openMenu(){app.classList.remove('closed')}function toast(t){toastEl.textContent=t;toastEl.style.display='block';clearTimeout(window.x);window.x=setTimeout(()=>toastEl.style.display='none',1200)}const app=document.getElementById('app'),toastEl=document.getElementById('toast')</script></body></html>
