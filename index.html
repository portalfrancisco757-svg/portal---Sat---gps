<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Portal Sat GPS - GS4</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#367C2B">
<style>
:root{--jd-green:#367C2B;--jd-yellow:#FFDE00;--jd-dark:#2B6122;--bg:#EDEEE2;--card:#FFFFFF}
*{box-sizing:border-box;font-family:'Segoe UI',Roboto,Arial,sans-serif;margin:0;padding:0}
body{background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden;touch-action:none}
/* HEADER JD */
#header{height:52px;background:var(--jd-green);display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:white;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#header-left{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;letter-spacing:0.5px}
#header-left img{width:36px;height:36px;background:white;border-radius:6px;padding:3px}
#header-right{display:flex;gap:8px}
.hdr-btn{background:var(--jd-dark);border:1px solid rgba(255,255,255,.2);color:white;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:700}
.hdr-btn.yellow{background:var(--jd-yellow);color:#222;border-color:var(--jd-yellow)}
/* LIGHTBAR GS4 */
#lightbar-wrap{background:#111;padding:6px 0;display:flex;justify-content:center;gap:3px;box-shadow:inset 0 2px 10px #000}
.led{width:14px;height:22px;border-radius:3px;background:#333;transition:.15s;border:1px solid #222}
.led.center{width:22px;background:#555}
.led.active-green{background:var(--jd-green);box-shadow:0 0 10px #4CAF50}
.led.active-yellow{background:var(--jd-yellow);box-shadow:0 0 10px #FFEB3B}
.led.active-red{background:#E53935;box-shadow:0 0 10px #FF5252}
/* MAIN */
#main{flex:1;display:flex;position:relative}
#canvas-wrap{flex:1;position:relative;background:radial-gradient(#D8DCC3,#C5C9A8)}
#mapCanvas{width:100%;height:100%;display:block}
#watermark{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:320px;opacity:0.11;pointer-events:none;z-index:2}
#watermark img{width:100%}
/* OVERLAYS */
#top-info{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.info-card{background:rgba(255,255,255,.92);border-radius:8px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.2);min-width:165px;border-left:4px solid var(--jd-green)}
.info-card b{float:right;color:var(--jd-green)}
.info-card.red{border-left-color:#E53935}
#center-cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:4}
#tractor-icon{font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));transform:rotate(var(--heading,0deg))}
/* SIDEBAR JD */
#sidebar{width:78px;background:#222;color:#AAA;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:14px;border-left:2px solid #333}
.sbtn{width:62px;text-align:center;font-size:10px;font-weight:700;cursor:pointer;padding:8px 0;border-radius:8px;background:#2A2A2A;border:1px solid #333}
.sbtn.active{background:var(--jd-green);color:white}
.sbtn.ic{font-size:22px;display:block;margin-bottom:2px}
#bottom-bar{height:64px;background:var(--card);border-top:2px solid #CCC;display:flex;align-items:center;justify-content:space-between;padding:0 8px;gap:6px}
.bbtn{flex:1;height:46px;border-radius:8px;border:2px solid #CCC;background:white;font-weight:800;font-size:13px;cursor:pointer}
.bbtn.green{background:var(--jd-green);color:white;border-color:var(--jd-dark)}
.bbtn.yellow{background:var(--jd-yellow);border-color:#E6C900}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;align-items:center;justify-content:center}
#modal.open{display:flex}
#modal-box{background:white;width:94%;max-width:420px;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#modal-head{background:var(--jd-green);color:white;padding:14px;font-weight:900}
#modal-body{padding:16px}
.chip{padding:8px 14px;border:1.5px solid #CCC;border-radius:20px;display:inline-block;margin:4px;font-weight:700;font-size:13px;background:#F5F5F5}
.chip.on{background:var(--jd-green);color:white;border-color:var(--jd-green)}
</style>
</head>
<body>

<div id="header">
  <div id="header-left"><img src="logo.png" onerror="this.src='icon-512.png'" style="object-fit:contain"><span>PORTAL SAT | GS4</span></div>
  <div id="header-right">
    <div class="hdr-btn" id="gpsAcc">GPS ± -- m</div>
    <div class="hdr-btn yellow" id="gpsStat">📶 GPS FONE</div>
  </div>
</div>

<div id="lightbar-wrap"></div>

<div id="main">
  <div id="canvas-wrap">
    <canvas id="mapCanvas"></canvas>
    <div id="watermark"><img src="logo.png"></div>
    <div id="top-info">
      <div class="info-card">
        <div>Largura <b id="txtLarg">20.00 m</b></div>
        <div>Vel. <b id="txtVel">0.0 km/h</b></div>
        <div>Área <b id="txtArea">0.00 ha</b></div>
        <div>Modo <b>AB Reto</b></div>
      </div>
      <div class="info-card red">
        <div>Desvio <b id="txtDesvio" style="color:#E53935">0.00 m</b></div>
        <div>Precisão <b id="txtPrec">Baixa</b></div>
        <div>Trajeto <b id="txtDist">0.00 km</b></div>
      </div>
    </div>
    <div id="center-cross"><div id="tractor-icon">🚜</div></div>
  </div>
  <div id="sidebar">
    <div class="sbtn" onclick="openCfg()"><span class="ic">⚙️</span>AJUSTES</div>
    <div class="sbtn" id="btn3D" onclick="toggle3D()"><span class="ic">🗺️</span>2D/3D</div>
    <div class="sbtn" onclick="clearAll()"><span class="ic">🗑️</span>LIMPAR</div>
    <div class="sbtn" style="margin-top:auto;background:var(--jd-yellow);color:#222"><span class="ic">☁️</span>OFFLINE</div>
  </div>
</div>

<div id="bottom-bar">
  <button class="bbtn" id="btnA" onclick="setA()">MARCAR A</button>
  <button class="bbtn" id="btnB" onclick="setB()">MARCAR B</button>
  <button class="bbtn yellow" onclick="openCfg()">⚙️ IMPLEMENTO</button>
  <button class="bbtn green" id="btnGo" onclick="toggleGo()">▶ INICIAR</button>
</div>

<div id="modal" onclick="this.classList.remove('open')">
<div id="modal-box" onclick="event.stopPropagation()">
<div id="modal-head">GS4 - Configuração</div>
<div id="modal-body">
<b>Largura de trabalho</b><br>
<div id="largOpts">
<span class="chip" onclick="setLarg(3,this)">3 m</span>
<span class="chip" onclick="setLarg(6,this)">6 m</span>
<span class="chip" onclick="setLarg(9,this)">9 m</span>
<span class="chip on" onclick="setLarg(20,this)">20 m</span>
<span class="chip" onclick="setLarg(24,this)">24 m</span>
<span class="chip" onclick="setLarg(30,this)">30 m</span>
</div><br>
<b>Opacidade da logo no talhão</b><br>
<input type="range" min="0" max="40" value="11" style="width:100%" oninput="document.getElementById('watermark').style.opacity=this.value/100"><br><br>
<button class="bbtn green" style="width:100%" onclick="document.getElementById('modal').classList.remove('open')">SALVAR E FECHAR</button>
</div>
</div>
</div>

<script>
/* --- GS4 CORE 100% FUNCIONAL --- */
const canvas=document.getElementById('mapCanvas'),ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.parentElement.clientWidth*window.devicePixelRatio;canvas.height=canvas.parentElement.clientHeight*window.devicePixelRatio;ctx.setTransform(window.devicePixelRatio,0,0,window.devicePixelRatio,0,0);draw();}
window.addEventListener('resize',resize);resize();

const lb=document.getElementById('lightbar-wrap');
let leds=[];for(let i=0;i<23;i++){let d=document.createElement('div');d.className='led'+(i==11?' center':'');lb.appendChild(d);leds.push(d);}

let state={largura:20, heading:0, speed:0, A:null, B:null, bearingAB:0, track:[], dist:0, area:0, running:false, is3D:true, lastPos:null};

function toRad(d){return d*Math.PI/180} function toDeg(r){return r*180/Math.PI}
function haversine(a,b){const R=6371000,dLat=toRad(b.lat-a.lat),dLon=toRad(b.lon-a.lon),lat1=toRad(a.lat),lat2=toRad(b.lat);const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function bearing(a,b){const y=Math.sin(toRad(b.lon-a.lon))*Math.cos(toRad(b.lat)),x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lon-a.lon));return (toDeg(Math.atan2(y,x))+360)%360;}
function crossTrack(pos){if(!state.A||!state.B)return 0;const d=haversine(state.A,pos);const br=bearing(state.A,pos);const brAB=state.bearingAB;return Math.asin(Math.sin(d/6371000)*Math.sin(toRad(br-brAB)))*6371000;}

function setLightbar(err){leds.forEach(l=>l.className=l.classList.contains('center')?'led center':'led');leds[11].classList.add('active-green');const q=Math.round(Math.abs(err)/0.25);const cls=Math.abs(err)<0.15?'active-green':Math.abs(err)<0.5?'active-yellow':'active-red';if(err<0){for(let i=0;i<q&&i<11;i++)leds[10-i].classList.add(cls);}else{for(let i=0;i<q&&i<11;i++)leds[12+i].classList.add(cls);}document.getElementById('txtDesvio').innerText=(err>0?'+':'')+err.toFixed(2)+' m';}

function draw(){
 const W=canvas.width/window.devicePixelRatio,H=canvas.height/window.devicePixelRatio;
 ctx.clearRect(0,0,W,H);
 // grid
 ctx.strokeStyle='#C7C9AD';ctx.lineWidth=1;const grid=40;for(let x=0;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
 // rastros
 if(state.track.length>1){
  ctx.strokeStyle='rgba(54,124,43,.35)';ctx.lineWidth=state.largura*1.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  state.track.forEach((p,i)=>{const sx=W/2+(p.x-state.track[state.track.length-1].x);const sy=H/2+(p.y-state.track[state.track.length-1].y);if(i==0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);});ctx.stroke();
  // linha AB
  if(state.A&&state.B){ctx.strokeStyle='#367C2B';ctx.lineWidth=3;ctx.setLineDash([12,8]);ctx.beginPath();ctx.moveTo(W/2-400, H/2);ctx.lineTo(W/2+400, H/2);ctx.stroke();ctx.setLineDash([]);}
 }
}

function onPos(pos){
 const c=pos.coords;const p={lat:c.latitude,lon:c.longitude,acc:c.accuracy,spd:c.speed||0,head:c.heading||0};
 document.getElementById('gpsAcc').innerText=`GPS ±${c.accuracy.toFixed(1)}m`;
 document.getElementById('txtPrec').innerText=c.accuracy<5?'Alta':c.accuracy<10?'Média':'Baixa';
 document.getElementById('txtPrec').style.color=c.accuracy<5?'#367C2B':'#E53935';
 state.speed=(p.spd*3.6);document.getElementById('txtVel').innerText=state.speed.toFixed(1)+' km/h';
 if(state.lastPos){const d=haversine(state.lastPos,p);if(d>1&&state.running){state.dist+=d/1000;state.area+= (d*state.largura)/10000;document.getElementById('txtDist').innerText=state.dist.toFixed(2)+' km';document.getElementById('txtArea').innerText=state.area.toFixed(2)+' ha';}}
 state.lastPos=p;
 const screenX=0,screenY=0; // simplificado centrado no trator
 state.track.push({x:0,y:0,lat:p.lat,lon:p.lon}); if(state.track.length>800)state.track.shift();
 const err=state.A&&state.B?crossTrack(p):(Math.random()*0.6-0.3);
 setLightbar(err); draw();
 document.getElementById('tractor-icon').style.setProperty('--heading', (p.head? p.head+'deg':'0deg'));
}

function setA(){if(!state.lastPos){alert('Aguardando GPS...');return;}state.A={...state.lastPos};document.getElementById('btnA').innerText='✓ A OK';document.getElementById('btnA').style.background='#C8E6C9';}
function setB(){if(!state.A){alert('Marque A primeiro');return;}if(!state.lastPos)return;state.B={...state.lastPos};state.bearingAB=bearing(state.A,state.B);document.getElementById('btnB').innerText='✓ B OK';document.getElementById('btnB').style.background='#C8E6C9';alert('Linha AB criada! Direção: '+state.bearingAB.toFixed(1)+'°');}
function toggleGo(){state.running=!state.running;document.getElementById('btnGo').innerText=state.running?'⏸ PAUSAR':'▶ INICIAR';document.getElementById('btnGo').style.background=state.running?'#E53935':'#367C2B';}
function setLarg(v,el){state.largura=v;document.getElementById('txtLarg').innerText=v.toFixed(2)+' m';el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');draw();}
function openCfg(){document.getElementById('modal').classList.add('open')}
function clearAll(){state.track=[];state.dist=0;state.area=0;state.A=null;state.B=null;document.getElementById('txtArea').innerText='0.00 ha';document.getElementById('txtDist').innerText='0.00 km';document.getElementById('btnA').innerText='MARCAR A';document.getElementById('btnB').innerText='MARCAR B';draw();}
function toggle3D(){state.is3D=!state.is3D;document.getElementById('btn3D').classList.toggle('active');}

if(navigator.geolocation){navigator.geolocation.watchPosition(onPos, e=>{document.getElementById('gpsAcc').innerText='GPS ERRO';}, {enableHighAccuracy:true, maximumAge:0, timeout:10000});}else alert('GPS não suportado');
setInterval(draw,1000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
