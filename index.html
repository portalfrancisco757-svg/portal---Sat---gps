<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Portal Sat GPS Agrícola 🛰️</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#eef5f0;
 color:#17352a;
}

header{
 background:#07552f;
 color:white;
 padding:14px;
 text-align:center;
}

header h1{
 margin:0;
 font-size:22px;
}

header p{
 margin:5px 0 0;
 font-size:13px;
}

#map{
 width:100%;
 height:55vh;
 min-height:380px;
}

.panel{
 background:white;
 padding:12px;
 box-shadow:0 -3px 12px #0003;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}

.card{
 background:#edf5f0;
 padding:10px;
 border-radius:10px;
}

.card span{
 display:block;
 font-size:12px;
 color:#557067;
}

.card strong{
 font-size:17px;
}

.buttons{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:10px;
}

button{
 border:0;
 border-radius:10px;
 padding:13px 8px;
 font-weight:bold;
 font-size:14px;
 background:#087044;
 color:white;
}

button.secondary{
 background:#42675a;
}

button.danger{
 background:#a83d35;
}

button.active{
 background:#d28b00;
}

#status{
 margin-top:10px;
 padding:10px;
 border-radius:8px;
 background:#f0f3f1;
 font-size:13px;
}
</style>
</head>

<body>

<header>
<h1>Portal Sat GPS Agrícola 🛰️</h1>
<p>GPS • Talhões • Trilhas • Linha AB • Área</p>
</header>

<div id="map"></div>

<div class="panel">

<div class="grid">

<div class="card">
<span>Latitude</span>
<strong id="lat">---</strong>
</div>

<div class="card">
<span>Longitude</span>
<strong id="lon">---</strong>
</div>

<div class="card">
<span>Precisão</span>
<strong id="accuracy">---</strong>
</div>

<div class="card">
<span>Velocidade</span>
<strong id="speed">---</strong>
</div>

<div class="card">
<span>Direção</span>
<strong id="heading">---</strong>
</div>

<div class="card">
<span>Distância</span>
<strong id="distance">0 m</strong>
</div>

<div class="card">
<span>Área</span>
<strong id="area">0 m²</strong>
</div>

<div class="card">
<span>Área em hectares</span>
<strong id="hectares">0 ha</strong>
</div>

</div>

<div class="buttons">

<button id="gpsBtn">
📡 Iniciar GPS
</button>

<button id="trackBtn">
🚜 Gravar trilha
</button>

<button id="pointBtn" class="secondary">
📍 Marcar ponto
</button>

<button id="areaBtn" class="secondary">
📐 Medir área
</button>

<button id="abBtn" class="secondary">
🧭 Linha AB
</button>

<button id="saveBtn" class="secondary">
💾 Salvar campo
</button>

<button id="exportBtn" class="secondary">
📤 Exportar GPX
</button>

<button id="clearBtn" class="danger">
🗑 Limpar
</button>

</div>

<div id="status">
Aguardando GPS...
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   PORTAL SAT GPS AGRÍCOLA
   ========================================================= */

const map = L.map("map").setView([-25.5,-54.6],15);

L.tileLayer(
 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
   maxZoom:20,
   attribution:"© OpenStreetMap"
 }
).addTo(map);


/* VARIÁVEIS */

let gpsWatch = null;
let gpsMarker = null;
let accuracyCircle = null;

let tracking = false;
let trackPoints = [];
let trackLine = null;

let lastPosition = null;
let totalDistance = 0;

let fieldPoints = [];
let fieldMarkers = [];
let fieldPolygon = null;

let areaMode = false;

let pointCounter = 0;

let pointA = null;
let pointB = null;
let lineAB = null;


/* ELEMENTOS */

const latEl = document.getElementById("lat");
const lonEl = document.getElementById("lon");
const accEl = document.getElementById("accuracy");
const speedEl = document.getElementById("speed");
const headingEl = document.getElementById("heading");
const distanceEl = document.getElementById("distance");

const areaEl = document.getElementById("area");
const hectaresEl = document.getElementById("hectares");

const statusEl = document.getElementById("status");


/* DISTÂNCIA ENTRE COORDENADAS */

function distanceMeters(a,b){

 const R = 6371000;

 const lat1 = a.lat * Math.PI/180;
 const lat2 = b.lat * Math.PI/180;

 const dLat = (b.lat-a.lat)*Math.PI/180;
 const dLon = (b.lon-a.lon)*Math.PI/180;

 const x =
 Math.sin(dLat/2)**2 +
 Math.cos(lat1) *
 Math.cos(lat2) *
 Math.sin(dLon/2)**2;

 return R * 2 * Math.atan2(
 Math.sqrt(x),
 Math.sqrt(1-x)
 );
}


/* ÁREA */

function calculateArea(points){

 if(points.length < 3)
   return 0;

 const R = 6378137;

 let lat0 = 0;

 points.forEach(p=>{
   lat0 += p.lat;
 });

 lat0 =
 (lat0 / points.length) *
 Math.PI/180;

 let xy = points.map(p=>({

   x:
   p.lon *
   Math.PI/180 *
   R *
   Math.cos(lat0),

   y:
   p.lat *
   Math.PI/180 *
   R

 }));

 let area = 0;

 for(let i=0;i<xy.length;i++){

   let j=(i+1)%xy.length;

   area +=
   xy[i].x*xy[j].y -
   xy[j].x*xy[i].y;
 }

 return Math.abs(area/2);
}


/* ATUALIZAR ÁREA */

function updateArea(){

 const area = calculateArea(fieldPoints);

 areaEl.textContent =
 area.toFixed(1)+" m²";

 hectaresEl.textContent =
 (area/10000).toFixed(3)+" ha";
}


/* GPS */

function startGPS(){

 if(!navigator.geolocation){

   statusEl.textContent =
   "Seu navegador não suporta GPS.";

   return;
 }

 if(gpsWatch !== null){

   navigator.geolocation.clearWatch(gpsWatch);
 }

 gpsWatch =
 navigator.geolocation.watchPosition(

   positionReceived,

   gpsError,

   {
     enableHighAccuracy:true,
     maximumAge:1000,
     timeout:15000
   }
 );

 document.getElementById("gpsBtn").textContent =
 "📡 GPS ativo";

 statusEl.textContent =
 "GPS ativo. Aguardando posição...";
}


/* POSIÇÃO RECEBIDA */

function positionReceived(position){

 const c = position.coords;

 const current = {

   lat:c.latitude,
   lon:c.longitude

 };


 latEl.textContent =
 c.latitude.toFixed(7);

 lonEl.textContent =
 c.longitude.toFixed(7);

 accEl.textContent =
 c.accuracy.toFixed(1)+" m";


 if(c.speed !== null){

   speedEl.textContent =
   (c.speed*3.6).toFixed(1)+" km/h";

 }else{

   speedEl.textContent =
   "---";
 }


 if(c.heading !== null){

   headingEl.textContent =
   c.heading.toFixed(0)+"°";

 }else{

   headingEl.textContent =
   "---";
 }


 /* MARCADOR GPS */

 if(!gpsMarker){

   gpsMarker =
   L.marker([
     current.lat,
     current.lon
   ])
   .addTo(map)
   .bindPopup(
     "Portal Sat GPS 🛰️"
   );

   gpsMarker.openPopup();

   map.setView(
     [current.lat,current.lon],
     18
   );

 }else{

   gpsMarker.setLatLng([
     current.lat,
     current.lon
   ]);

 }


 /* PRECISÃO */

 if(!accuracyCircle){

   accuracyCircle =
   L.circle(
     [current.lat,current.lon],
     {
       radius:c.accuracy,
       color:"#087044",
       fillOpacity:.08
     }
   ).addTo(map);

 }else{

   accuracyCircle
   .setLatLng([
     current.lat,
     current.lon
   ])
   .setRadius(c.accuracy);

 }


 /* TRILHA */

 if(tracking){

   if(lastPosition){

     totalDistance +=
     distanceMeters(
       lastPosition,
       current
     );

   }

   lastPosition = current;

   trackPoints.push(current);

   if(!trackLine){

     trackLine =
     L.polyline(
       [],
       {
         color:"#ff7a00",
         weight:5
       }
     ).addTo(map);

   }

   trackLine.setLatLngs(
     trackPoints.map(p=>[
       p.lat,
       p.lon
     ])
   );

   if(totalDistance < 1000){

     distanceEl.textContent =
     totalDistance.toFixed(1)+" m";

   }else{

     distanceEl.textContent =
     (totalDistance/1000).toFixed(3)+" km";

   }

 }


 statusEl.textContent =
 "GPS atualizado • "+
 new Date().toLocaleTimeString();

}


/* ERRO GPS */

function gpsError(error){

 statusEl.textContent =
 "Erro GPS: "+
 error.message+
 " • Verifique a permissão de localização.";

}


/* GRAVAR TRILHA */

document.getElementById("trackBtn")
.onclick=function(){

 tracking=!tracking;

 if(tracking){

   trackPoints=[];
   totalDistance=0;
   lastPosition=null;

   if(trackLine){

     map.removeLayer(trackLine);
     trackLine=null;

   }

   this.textContent =
   "⏹ Parar trilha";

   this.classList.add("active");

   statusEl.textContent =
   "Gravando trilha...";

 }else{

   this.textContent =
   "🚜 Gravar trilha";

   this.classList.remove("active");

   statusEl.textContent =
   "Trilha finalizada.";

 }

};


/* MARCAR PONTO */

document.getElementById("pointBtn")
.onclick=function(){

 if(!gpsMarker){

   statusEl.textContent =
   "Primeiro inicie o GPS.";

   return;

 }

 const position =
 gpsMarker.getLatLng();

 pointCounter++;

 const marker =
 L.marker(position)
 .addTo(map);

 marker.bindPopup(
   "<b>Ponto "+
   pointCounter+
   "</b><br>"+
   "Latitude: "+
   position.lat.toFixed(7)+
   "<br>"+
   "Longitude: "+
   position.lng.toFixed(7)
 );

 fieldMarkers.push(marker);

 statusEl.textContent =
 "Ponto "+pointCounter+
 " marcado.";

};


/* MODO ÁREA */

document.getElementById("areaBtn")
.onclick=function(){

 areaMode=!areaMode;

 if(areaMode){

   this.textContent =
   "⏹ Finalizar área";

   this.classList.add("active");

   statusEl.textContent =
   "Clique no mapa para marcar os vértices do talhão.";

 }else{

   this.textContent =
   "📐 Medir área";

   this.classList.remove("active");

   statusEl.textContent =
   "Área finalizada.";

 }

};


/* CLIQUES NO MAPA */

map.on("click",function(e){

 if(!areaMode)
   return;

 const point = {

   lat:e.latlng.lat,
   lon:e.latlng.lng

 };

 fieldPoints.push(point);

 const marker =
 L.circleMarker(
   e.latlng,
   {
     radius:6,
     color:"#087044",
     fillOpacity:1
   }
 ).addTo(map);

 fieldMarkers.push(marker);


 if(fieldPolygon){

   map.removeLayer(
     fieldPolygon
   );

 }


 fieldPolygon =
 L.polygon(
   fieldPoints.map(p=>[
     p.lat,
     p.lon
   ]),
   {
     color:"#087044",
     fillOpacity:.15
   }
 ).addTo(map);

 updateArea();

});


/* LINHA AB */

document.getElementById("abBtn")
.onclick=function(){

 if(!gpsMarker){

   statusEl.textContent =
   "Inicie o GPS primeiro.";

   return;

 }

 const p =
 gpsMarker.getLatLng();

 const point = {
   lat:p.lat,
   lon:p.lng
 };


 if(!pointA){

   pointA=point;

   L.marker(
     [point.lat,point.lon]
   )
   .addTo(map)
   .bindPopup("PONTO A")
   .openPopup();

   statusEl.textContent =
   "Ponto A marcado. Vá até o próximo ponto e pressione novamente.";

   return;
 }


 if(!pointB){

   pointB=point;

   L.marker(
     [point.lat,point.lon]
   )
   .addTo(map)
   .bindPopup("PONTO B")
   .openPopup();


   if(lineAB){

     map.removeLayer(lineAB);

   }


   lineAB =
   L.polyline(
     [
       [pointA.lat,pointA.lon],
       [pointB.lat,pointB.lon]
     ],
     {
       color:"#005eff",
       weight:5,
       dashArray:"10 8"
     }
   ).addTo(map);


   const dist =
   distanceMeters(
     pointA,
     pointB
   );


   statusEl.textContent =
   "Linha AB criada • "+
   dist.toFixed(1)+
   " metros.";

   return;
 }


 pointA=null;
 pointB=null;

 if(lineAB){

   map.removeLayer(lineAB);
   lineAB=null;

 }

 statusEl.textContent =
 "Linha AB reiniciada. Marque o ponto A.";

};


/* SALVAR CAMPO */

document.getElementById("saveBtn")
.onclick=function(){

 const data={

   nome:
   "Talhão Portal Sat",

   data:
   new Date().toISOString(),

   pontos:
   fieldPoints,

   trilha:
   trackPoints,

   linhaAB:{
     A:pointA,
     B:pointB
   },

   area_m2:
   calculateArea(fieldPoints)

 };


 localStorage.setItem(
   "portalSatCampo",
   JSON.stringify(data)
 );


 statusEl.textContent =
 "Campo salvo no aparelho.";

};


/* EXPORTAR GPX */

document.getElementById("exportBtn")
.onclick=function(){

 if(trackPoints.length < 2){

   statusEl.textContent =
   "Grave uma trilha primeiro.";

   return;

 }


 let track="";


 trackPoints.forEach(p=>{

   track +=
   '<trkpt lat="'+
   p.lat+
   '" lon="'+
   p.lon+
   '"></trkpt>';

 });


 const gpx =
 `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1"
creator="Portal Sat GPS Agrícola">
<trk>
<name>Portal Sat GPS Agrícola</name>
<trkseg>
${track}
</trkseg>
</trk>
</gpx>`;


 const blob =
 new Blob(
   [gpx],
   {
     type:"application/gpx+xml"
   }
 );


 const url =
 URL.createObjectURL(blob);


 const a =
 document.createElement("a");

 a.href=url;

 a.download=
 "portal-sat-trilha.gpx";

 a.click();

 URL.revokeObjectURL(url);


 statusEl.textContent =
 "Arquivo GPX exportado.";

};


/* LIMPAR */

document.getElementById("clearBtn")
.onclick=function(){

 if(gpsMarker)
   map.removeLayer(gpsMarker);

 if(accuracyCircle)
   map.removeLayer(accuracyCircle);

 if(trackLine)
   map.removeLayer(trackLine);

 if(fieldPolygon)
   map.removeLayer(fieldPolygon);

 fieldMarkers.forEach(
   marker=>{
     map.removeLayer(marker);
   }
 );


 gpsMarker=null;
 accuracyCircle=null;
 trackLine=null;
 fieldPolygon=null;

 fieldMarkers=[];
 fieldPoints=[];
 trackPoints=[];

 pointA=null;
 pointB=null;

 totalDistance=0;
 lastPosition=null;

 if(lineAB){

   map.removeLayer(lineAB);
   lineAB=null;

 }

 distanceEl.textContent="0 m";
 areaEl.textContent="0 m²";
 hectaresEl.textContent="0 ha";

 statusEl.textContent =
 "Mapa limpo.";

};


/* INICIAR GPS */

document.getElementById("gpsBtn")
.onclick=startGPS;


/* TENTAR RECUPERAR CAMPO SALVO */

window.addEventListener(
 "load",
 function(){

   const saved =
   localStorage.getItem(
     "portalSatCampo"
   );

   if(saved){

     statusEl.textContent =
     "Existe um campo salvo neste aparelho.";

   }

 }
);

</script>

</body>
</html>
