<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#061016">

<title>Portal Sat GPS Agrícola PRO</title>

<style>
:root{
 --bg:#061016;
 --panel:#091820;
 --border:#294650;
 --green:#35f13d;
 --green2:#8aff78;
 --cyan:#00eaff;
 --red:#ff3030;
 --yellow:#ffd52e;
}

*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:var(--bg);
 color:#eef7f8;
 font-family:Arial,Helvetica,sans-serif;
}

button,input,select{
 font:inherit;
}

button{
 cursor:pointer;
}

#app{
 width:100vw;
 height:100vh;
 display:flex;
 flex-direction:column;
}

/* TOPO */

.top{
 height:66px;
 display:flex;
 align-items:center;
 gap:7px;
 padding:7px 10px;
 background:#061016;
 border-bottom:1px solid #24414b;
 z-index:10;
}

.logo{
 font-size:21px;
 font-weight:900;
 min-width:235px;
}

.logo span{
 color:var(--green);
}

.sub{
 display:block;
 font-size:8px;
 letter-spacing:4px;
 margin-left:39px;
 color:#b9c8cd;
}

.stat{
 height:49px;
 padding:4px 12px;
 border-left:1px solid #213a44;
 min-width:105px;
}

.stat b{
 font-size:17px;
}

.stat small{
 display:block;
 color:#9db0b6;
 font-size:9px;
}

.grow{
 flex:1;
}

.btn{
 background:#10232c;
 border:1px solid #31515d;
 color:white;
 border-radius:7px;
 padding:8px 11px;
}

.btn.green{
 border-color:#35ec3d;
 background:#0c281e;
 color:#83ff7b;
}

.btn.red{
 border-color:#9a3b3b;
 background:#301619;
}

/* ÁREA PRINCIPAL */

.main{
 position:relative;
 flex:1;
 min-height:0;
 overflow:hidden;
 background:#253e28;
}

#field{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
}

/* MENU LATERAL */

.side{
 position:absolute;
 left:0;
 top:0;
 bottom:0;
 width:72px;
 background:#071219e8;
 border-right:1px solid #25414b;
 z-index:5;
 display:flex;
 flex-direction:column;
}

.side button{
 flex:1;
 background:none;
 border:0;
 border-bottom:1px solid #1e3740;
 color:#dce8ea;
 font-size:9px;
}

.side strong{
 font-size:20px;
 display:block;
 margin-bottom:3px;
}

.side button.active{
 color:var(--green);
 background:#0b2520;
}

/* PAINÉIS */

.card{
 position:absolute;
 background:#07131ae8;
 border:1px solid #34535e;
 border-radius:10px;
 box-shadow:0 8px 25px #0008;
 z-index:4;
}

.field{
 left:86px;
 top:12px;
 width:235px;
 padding:10px;
}

.guide{
 right:14px;
 top:12px;
 width:270px;
 padding:10px;
}

.cardtitle{
 font-weight:800;
 margin-bottom:6px;
}

.muted{
 color:#9eb1b7;
 font-size:11px;
}

.row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 margin:5px 0;
}

/* BARRA DE LUZ */

.lightbar{
 position:absolute;
 top:13px;
 left:50%;
 transform:translateX(-50%);
 width:min(440px,42vw);
 height:47px;
 background:#071219ef;
 border:1px solid #385660;
 border-radius:9px;
 padding:7px 10px;
 z-index:7;
}

.lights{
 height:20px;
 display:flex;
 gap:4px;
 justify-content:center;
}

.lamp{
 width:24px;
 height:13px;
 border-radius:3px;
 background:#1b2a30;
 border:1px solid #395059;
}

.lamp.onL{
 background:#29e638;
 box-shadow:0 0 8px #29e638;
}

.lamp.onY{
 background:#ffd21f;
 box-shadow:0 0 8px #ffd21f;
}

.lamp.onR{
 background:#ff3434;
 box-shadow:0 0 8px #ff3434;
}

.lbtext{
 text-align:center;
 font-size:9px;
 color:#b8c8cd;
}

.lbtext b{
 color:#fff;
}

/* FERRAMENTAS */

.tools{
 position:absolute;
 right:14px;
 top:145px;
 display:flex;
 flex-direction:column;
 gap:7px;
 z-index:6;
}

.tools button{
 width:44px;
 height:44px;
 background:#091a22ef;
 color:#fff;
 border:1px solid #36515a;
 border-radius:8px;
 font-weight:bold;
}

/* CONTROLES INFERIORES */

.bottom{
 position:absolute;
 left:86px;
 right:14px;
 bottom:10px;
 display:flex;
 gap:8px;
 z-index:6;
}

.ctrl{
 background:#07131aea;
 border:1px solid #304e58;
 border-radius:9px;
 padding:8px 10px;
 min-width:145px;
}

.ctrl label{
 display:block;
 color:#aebec3;
 font-size:9px;
 margin-bottom:4px;
}

.ctrl input,
.ctrl select{
 width:100%;
 padding:7px;
 background:#0c2028;
 color:#fff;
 border:1px solid #31515d;
 border-radius:6px;
}

.cover{
 display:flex;
 align-items:center;
 gap:8px;
 color:var(--green2);
}

.cover input{
 width:38px;
 height:20px;
 accent-color:var(--green);
}

/* MODAL */

.modal{
 position:absolute;
 inset:0;
 background:#000b;
 z-index:30;
 display:none;
 align-items:center;
 justify-content:center;
}

.box{
 width:min(650px,90vw);
 max-height:85vh;
 overflow:auto;
 background:#09171e;
 border:1px solid #35545f;
 border-radius:12px;
 padding:18px;
}

.box h2{
 margin:0 0 12px;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.grid input,
.grid select{
 width:100%;
 padding:9px;
 background:#0c2028;
 color:#fff;
 border:1px solid #31515d;
 border-radius:6px;
}

.list{
 margin-top:12px;
 border-top:1px solid #263f48;
}

.item{
 padding:9px 0;
 border-bottom:1px solid #263f48;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.toast{
 position:absolute;
 top:73px;
 left:50%;
 transform:translateX(-50%);
 z-index:20;
 background:#06151cef;
 border:1px solid var(--green);
 border-radius:18px;
 padding:8px 15px;
 display:none;
}

.badge{
 padding:2px 6px;
 border-radius:10px;
 background:#163027;
 color:#71ff69;
 font-size:9px;
}

@media(max-width:1000px){

 .top{
  height:55px;
 }

 .logo{
  font-size:16px;
  min-width:170px;
 }

 .stat{
  min-width:75px;
  padding:4px 6px;
 }

 .stat b{
  font-size:12px;
 }

 .side{
  width:58px;
 }

 .field{
  left:68px;
  width:200px;
 }

 .bottom{
  left:68px;
  overflow-x:auto;
 }

 .lightbar{
  top:7px;
 }

 .guide{
  transform:scale(.85);
  transform-origin:top right;
 }
}
</style>
</head>

<body>

<div id="app">

<header class="top">

 <div class="logo">
   Portal <span>Sat GPS</span>
   <i class="sub">AGRÍCOLA PRO</i>
 </div>

 <div class="stat">
   <b id="gps">SEM GPS</b>
   <small>POSIÇÃO</small>
 </div>

 <div class="stat">
   <b id="sat">--</b>
   <small>SATÉLITES</small>
 </div>

 <div class="stat">
   <b id="spd">0,0</b>
   <small>KM/H</small>
 </div>

 <div class="stat">
   <b id="ha">0,00</b>
   <small>HECTARES COBERTOS</small>
 </div>

 <div class="stat">
   <b id="km">0,00</b>
   <small>KM PERCORRIDOS</small>
 </div>

 <div class="grow"></div>

 <button class="btn" onclick="settings()">⚙</button>

</header>


<main class="main">

<canvas id="field"></canvas>


<!-- MENU -->

<nav class="side">

 <button class="active">
  <strong>⌂</strong>
  Início
 </button>

 <button onclick="fields()">
  <strong>▣</strong>
  Talhões
 </button>

 <button onclick="markA()">
  <strong>A</strong>
  Marcar A
 </button>

 <button onclick="markB()">
  <strong>B</strong>
  Marcar B
 </button>

 <button onclick="newBoundary()">
  <strong>◇</strong>
  Limite
 </button>

 <button onclick="settings()">
  <strong>⚙</strong>
  Config.
 </button>

</nav>


<!-- BARRA DE LUZ -->

<div class="lightbar">

 <div class="lights" id="lights"></div>

 <div class="lbtext">
   BARRA DE LUZ •
   <b id="error">0,00 m</b> •
   <span id="modeTxt">RETA A–B</span>
 </div>

</div>


<!-- TALHÃO -->

<section class="card field">

 <div class="cardtitle">
   TALHÃO
   <span class="badge" id="fieldName">
     NÃO SALVO
   </span>
 </div>

 <div class="row">
   <span class="muted">Área</span>
   <b id="fieldArea">0,00 ha</b>
 </div>

 <div class="row">
   <span class="muted">Cobertura</span>
   <b class="green" id="pct">0%</b>
 </div>

 <button
  class="btn green"
  style="width:100%"
  onclick="fields()">
  ▣ Criar / Salvar Talhão
 </button>

</section>


<!-- GUIAMENTO -->

<section class="card guide">

 <div class="cardtitle">
   <span style="color:#00eaff">A→B</span>
   GUIAMENTO
 </div>

 <div class="row">
   <span class="muted">Status</span>
   <b id="ab">Aguardando A</b>
 </div>

 <div class="row">
   <span class="muted">Desvio</span>
   <b id="err">0,00 m</b>
 </div>

 <div class="row">
   <span class="muted">Direção</span>
   <b id="head">0°</b>
 </div>

 <div class="row">
   <span class="muted">Passada</span>
   <b id="pass">0</b>
 </div>

 <div style="display:flex;gap:6px;margin-top:7px">

  <button
   class="btn green"
   onclick="markA()">
   Marcar A
  </button>

  <button
   class="btn green"
   onclick="markB()">
   Marcar B
  </button>

  <button
   class="btn red"
   onclick="resetAB()">
   Reset
  </button>

 </div>

</section>


<!-- FERRAMENTAS -->

<div class="tools">

 <button onclick="threeD()">
  3D
 </button>

 <button onclick="zoom(1.15)">
  +
 </button>

 <button onclick="zoom(.87)">
  −
 </button>

 <button onclick="center()">
  ⌾
 </button>

 <button onclick="toggleFollow()">
  ↗
 </button>

</div>


<!-- CONTROLES -->

<div class="bottom">

 <div class="ctrl">

  <label>
   LARGURA DO IMPLEMENTO (m)
  </label>

  <input
   id="width"
   type="number"
   value="12"
   min=".5"
   max="60"
   step=".1"
   onchange="saveCfg()">

 </div>


 <div class="ctrl">

  <label>
   GUIAMENTO
  </label>

  <select
   id="guideType"
   onchange="saveCfg()">

   <option>Reta A–B</option>
   <option>Curva</option>
   <option>Pivô</option>

  </select>

 </div>


 <div class="ctrl">

  <label>
   COBERTURA
  </label>

  <div class="cover">

   <input
    id="cov"
    type="checkbox"
    checked
    onchange="saveCfg()">

   ATIVA

  </div>

 </div>


 <div class="ctrl">

  <label>
   ACOMPANHAR TRATOR
  </label>

  <div class="cover">

   <input
    id="follow"
    type="checkbox"
    checked>

   ATIVO

  </div>

 </div>


 <div class="ctrl">

  <label>
   ANTENA EXTERNA
  </label>

  <button
   class="btn"
   onclick="serial()">

   USB / OTG / NMEA

  </button>

 </div>

</div>


<div class="toast" id="toast"></div>


<!-- MODAL -->

<div class="modal" id="modal">

 <div class="box" id="box"></div>

</div>

</main>

</div>


<script>

/* =====================================================
   PORTAL SAT GPS AGRÍCOLA PRO
   MOTOR PRINCIPAL
===================================================== */

const $ = x => document.getElementById(x);

const canvas = $("field");

const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = 1;

let view3d = true;
let zoomLevel = 1;
let follow = true;


/* POSIÇÃO DO TRATOR */

let pos = {
 x:0,
 y:0,
 h:0,
 speed:0
};


/* ORIGEM GPS */

let origin = null;


/* HISTÓRICO */

let track = [];


/* COBERTURA */

let swaths = [];


/* LINHA A-B */

let A = null;
let B = null;


/* LIMITE DO TALHÃO */

let boundary = [];


/* TALHÕES */

let fieldsDB =
 JSON.parse(
  localStorage.getItem("psgps_fields") || "{}"
 );

let current =
 localStorage.getItem("psgps_current") || "";


/* CONFIGURAÇÃO */

let cfg =
 JSON.parse(
  localStorage.getItem("psgps_cfg") || "{}"
 );


$("width").value =
 cfg.width || 12;

$("cov").checked =
 cfg.cov !== false;

$("guideType").value =
 cfg.guide || "Reta A–B";


/* =====================================================
   TELA
===================================================== */

function resize(){

 dpr =
  window.devicePixelRatio || 1;

 W = canvas.clientWidth;
 H = canvas.clientHeight;

 canvas.width =
  W * dpr;

 canvas.height =
  H * dpr;

 ctx.setTransform(
  dpr,0,0,dpr,0,0
 );

 draw();
}

window.addEventListener(
 "resize",
 resize
);


/* =====================================================
   MENSAGEM
===================================================== */

function toast(text){

 $("toast").textContent =
  text;

 $("toast").style.display =
  "block";

 clearTimeout(toast.timer);

 toast.timer =
  setTimeout(
   () =>
    $("toast").style.display =
     "none",
   2200
  );
}


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

function saveCfg(){

 cfg = {

  width:
   Number($("width").value),

  cov:
   $("cov").checked,

  guide:
   $("guideType").value

 };

 localStorage.setItem(
  "psgps_cfg",
  JSON.stringify(cfg)
 );

 draw();
}


/* =====================================================
   ZOOM
===================================================== */

function zoom(value){

 zoomLevel =
  Math.max(
   .35,
   Math.min(
    5,
    zoomLevel * value
   )
  );

 draw();
}


/* =====================================================
   CENTRALIZAR
===================================================== */

function center(){

 pos.x = 0;
 pos.y = 0;

 draw();
}


/* =====================================================
   2D / 3D
===================================================== */

function threeD(){

 view3d =
  !view3d;

 draw();
}


/* =====================================================
   ACOMPANHAR
===================================================== */

function toggleFollow(){

 follow =
  !follow;

 $("follow").checked =
  follow;

 toast(
  follow
   ? "Acompanhamento ativo"
   : "Acompanhamento pausado"
 );
}


/* =====================================================
   PROJEÇÃO DO TERRENO
===================================================== */

function world(x,y){

 let rx =
  x - pos.x;

 let ry =
  y - pos.y;


 if(!view3d){

  return {

   x:
    W/2 +
    rx * zoomLevel,

   y:
    H/2 -
    ry * zoomLevel

  };

 }


 /*
   PROJEÇÃO 3D:

   A linha A-B,
   cobertura e trator
   usam exatamente o
   mesmo plano.
 */

 let depth = ry;

 let perspective =
  1 /
  (
   1 +
   Math.max(
    -150,
    depth
   ) * .0018
  );

 return {

  x:
   W/2 +
   rx *
   zoomLevel *
   perspective,

  y:
   H*.52 -
   depth *
   zoomLevel *
   .34

 };

}


/* =====================================================
   DESENHAR
===================================================== */

function draw(){

 if(!W)
  return;


 ctx.clearRect(
  0,
  0,
  W,
  H
 );


 /* FUNDO */

 let gradient =
  ctx.createLinearGradient(
   0,
   0,
   0,
   H
  );

 gradient.addColorStop(
  0,
  "#183d35"
 );

 gradient.addColorStop(
  .4,
  "#6b713d"
 );

 gradient.addColorStop(
  1,
  "#513c28"
 );

 ctx.fillStyle =
  gradient;

 ctx.fillRect(
  0,
  0,
  W,
  H
 );


 /* LINHAS DO TERRENO */

 ctx.globalAlpha = .2;

 ctx.strokeStyle =
  "#e3ca8d";

 ctx.lineWidth = 1;

 for(
  let i=-45;
  i<=45;
  i+=3
 ){

  let a =
   world(
    i*10,
    -600
   );

  let b =
   world(
    i*10,
    600
   );

  ctx.beginPath();

  ctx.moveTo(
   a.x,
   a.y
  );

  ctx.lineTo(
   b.x,
   b.y
  );

  ctx.stroke();

 }

 ctx.globalAlpha = 1;


 /* =================================================
    COBERTURA VERDE
 ================================================= */

 if(
  $("cov").checked
 ){

  swaths.forEach(
   s => {

    let half =
     s.w / 2;

    let nx =
     Math.cos(s.h);

    let ny =
     Math.sin(s.h);

    let px =
     -ny * half;

    let py =
     nx * half;

    let length =
     Math.max(
      1,
      s.w * .9
     );

    let p1 =
     world(
      s.x + px,
      s.y + py
     );

    let p2 =
     world(
      s.x - px,
      s.y - py
     );

    let p3 =
     world(
      s.x - px +
      nx * length,
      s.y - py +
      ny * length
     );

    let p4 =
     world(
      s.x + px +
      nx * length,
      s.y + py +
      ny * length
     );


    ctx.fillStyle =
     "rgba(45,240,55,.36)";

    ctx.beginPath();

    ctx.moveTo(
     p1.x,
     p1.y
    );

    ctx.lineTo(
     p2.x,
     p2.y
    );

    ctx.lineTo(
     p3.x,
     p3.y
    );

    ctx.lineTo(
     p4.x,
     p4.y
    );

    ctx.closePath();

    ctx.fill();

   }
  );

 }


 /* =================================================
    LIMITE DO TALHÃO
 ================================================= */

 if(
  boundary.length > 1
 ){

  ctx.strokeStyle =
   "#ffd52e";

  ctx.lineWidth = 3;

  ctx.beginPath();

  boundary.forEach(
   (p,i) => {

    let q =
     world(
      p.x,
      p.y
     );

    if(i)
     ctx.lineTo(
      q.x,
      q.y
     );
    else
     ctx.moveTo(
      q.x,
      q.y
     );

   }
  );

  ctx.stroke();

 }


 /* =================================================
    LINHA A-B 3D
 ================================================= */

 if(A && B){

  let dx =
   B.x - A.x;

  let dy =
   B.y - A.y;

  let length =
   Math.hypot(
    dx,
    dy
   ) || 1;

  let nx =
   -dy / length;

  let ny =
   dx / length;


  let p =
   world(
    A.x - nx*700,
    A.y - ny*700
   );

  let q =
   world(
    A.x + nx*700,
    A.y + ny*700
   );


  ctx.strokeStyle =
   "#00eaff";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(
   p.x,
   p.y
  );

  ctx.lineTo(
   q.x,
   q.y
  );

  ctx.stroke();


  /* PONTO A */

  let a =
   world(
    A.x,
    A.y
   );

  ctx.fillStyle =
   "#f22";

  ctx.beginPath();

  ctx.arc(
   a.x,
   a.y,
   13,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle =
   "#fff";

  ctx.font =
   "bold 12px Arial";

  ctx.textAlign =
   "center";

  ctx.fillText(
   "A",
   a.x,
   a.y+4
  );


  /* PONTO B */

  let b =
   world(
    B.x,
    B.y
   );

  ctx.fillStyle =
   "#176dff";

  ctx.beginPath();

  ctx.arc(
   b.x,
   b.y,
   13,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle =
   "#fff";

  ctx.fillText(
   "B",
   b.x,
   b.y+4
  );

 }


 /* =================================================
    RASTRO
 ================================================= */

 if(
  track.length > 1
 ){

  ctx.strokeStyle =
   "#8cff76";

  ctx.lineWidth = 2;

  ctx.beginPath();

  track.forEach(
   (p,i) => {

    let q =
     world(
      p.x,
      p.y
     );

    if(i)
     ctx.lineTo(
      q.x,
      q.y
     );
    else
     ctx.moveTo(
      q.x,
      q.y
     );

   }
  );

  ctx.stroke();

 }


 /* =================================================
    TRATOR
 ================================================= */

 let tractor =
  world(
   pos.x,
   pos.y
  );

 ctx.save();

 ctx.translate(
  tractor.x,
  tractor.y
 );

 ctx.rotate(
  -pos.h
 );

 ctx.fillStyle =
  "#111";

 ctx.fillRect(
  -18,
  -20,
  7,
  15
 );

 ctx.fillRect(
  11,
  -20,
  7,
  15
 );

 ctx.fillRect(
  -18,
  6,
  7,
  15
 );

 ctx.fillRect(
  11,
  6,
  7,
  15
 );

 ctx.fillStyle =
  "#31e83b";

 ctx.fillRect(
  -12,
  -17,
  24,
  31
 );

 ctx.fillStyle =
  "#17252b";

 ctx.fillRect(
  -9,
  -12,
  18,
  10
 );

 ctx.restore();


 drawLightbar();

}


/* =====================================================
   ERRO DA LINHA
===================================================== */

function calcError(){

 if(
  !A ||
  !B
 )
  return 0;

 let dx =
  B.x-A.x;

 let dy =
  B.y-A.y;

 let L =
  Math.hypot(
   dx,
   dy
  ) || 1;

 return (
  (pos.x-A.x)*(-dy) +
  (pos.y-A.y)*dx
 ) / L;

}


/* =====================================================
   BARRA DE LUZ
===================================================== */

function drawLightbar(){

 let count = 15;

 let html = "";

 let error =
  calcError();


 let active =
  Math.max(
   -7,
   Math.min(
    7,
    Math.round(error)
   )
  );


 for(
  let i=-7;
  i<=7;
  i++
 ){

  let cls = "";


  if(
   i === active
  ){

   if(
    Math.abs(error) < .25
   )
    cls =
     "onL";

   else if(
    Math.abs(error) < 1
   )
    cls =
     "onY";

   else
    cls =
     "onR";

  }


  html +=
   '<span class="lamp '+
   cls+
   '"></span>';

 }


 $("lights").innerHTML =
  html;

 $("error").textContent =
  error.toFixed(2) +
  " m";

 $("err").textContent =
  error.toFixed(2) +
  " m";

}

/* =====================================================
   RECEBER GPS
===================================================== */

function gps(
 lat,
 lon,
 speed=0,
 heading=null
){

 if(!origin){

  origin = {
   lat,
   lon
  };

 }


 let x =
  (
   lon-origin.lon
  ) *
  111320 *
  Math.cos(
   lat*Math.PI/180
  );


 let y =
  (
   lat-origin.lat
  ) *
  111320;


 let old =
  track[
   track.length-1
  ];


 if(
  old &&
  heading == null
 ){

  heading =
   Math.atan2(
    y-old.y,
    x-old.x
   );

 }


 pos.x = x;
 pos.y = y;
 pos.speed = speed;


 if(
  heading != null
 ){

  pos.h =
   heading *
   Math.PI /
   180;

 }


 track.push({
  x,
  y
 });


 if(
  track.length > 4000
 )
  track.shift();


 /* COBERTURA */

 if(
  $("cov").checked
 ){

  let width =
   Number(
    $("width").value
   ) || 12;


  swaths.push({

   x,
   y,
   h:pos.h,
   w:width

  });


  if(
   swaths.length > 7000
  )
   swaths.shift();

 }


 update();

 draw();

}

/* =====================================================
   ANTENA EXTERNA USB / OTG
===================================================== */

async function serial(){

 if(
  !("serial" in navigator)
 ){

  toast(
   "Este navegador não oferece Web Serial"
  );

  return;

 }


 try{

  let port =
   await navigator.serial.requestPort();


  await port.open({

   baudRate:4800

  });


  toast(
   "Antena conectada — NMEA"
  );


  readSerial(
   port
  );


 }

 catch(e){

  toast(
   "Conexão não realizada"
  );

 }

}


/* =====================================================
   LEITURA NMEA
===================================================== */

async function readSerial(port){

 const decoder =
  new TextDecoderStream();


 port.readable.pipeTo(
  decoder.writable
 );


 const reader =
  decoder.readable.getReader();


 let buffer = "";


 while(true){

  let result =
   await reader.read();


  if(
   result.done
  )
   break;


  buffer +=
   result.value;


  let lines =
   buffer.split(
    /\r?\n/
   );


  buffer =
   lines.pop();


  lines.forEach(
   parseNMEA
  );

 }

}


/* =====================================================
   PARSER NMEA GGA
===================================================== */

function parseNMEA(sentence){

 if(
  !sentence.startsWith("$")
 )
  return;


 let p =
  sentence.split(",");


 if(
  p[0].includes("GGA") &&
  p[6] > 0
 ){

  let lat =
   Number(p[2]);

  let lon =
   Number(p[4]);


  lat =
   (
    Math.floor(lat/100) +
    (lat%100)/60
   ) *
   (
    p[3] === "S"
    ? -1
    : 1
   );


  lon =
   (
    Math.floor(lon/100) +
    (lon%100)/60
   ) *
   (
    p[5] === "W"
    ? -1
    : 1
   );


  $("gps").textContent =
   "GPS ATIVO";


  $("sat").textContent =
   p[7] || "--";


  gps(
   lat,
   lon,
   0
  );

 }

}


/* =====================================================
   SEGURANÇA DE TEXTO
===================================================== */

function esc(text){

 return text.replace(
  /[&<>"']/g,
  function(m){

   return {

    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"

   }[m];

  }
 );

}
