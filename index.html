<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Portal Sat GPS Agrícola</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:white;
}

/* TELA PRINCIPAL */
#app{
    position:fixed;
    inset:0;
    background:#151515;
    overflow:hidden;
}

/* MAPA */
#mapa{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
      linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
      #1b261d;
    background-size:40px 40px;
}

/* Logo */
.logo{
    position:absolute;
    top:12px;
    left:14px;
    z-index:20;
    font-weight:bold;
    font-size:18px;
    text-shadow:0 2px 5px #000;
}

.logo span{
    color:#35e56d;
}

/* BARRA SUPERIOR */
.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:58px;
    background:rgba(10,10,10,.88);
    z-index:15;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border-bottom:1px solid #444;
}

.status{
    padding:7px 12px;
    border-radius:7px;
    background:#202020;
    font-size:13px;
}

.fix{
    color:#39ee70;
}

/* BARRA DE LUZ */
.lightbar{
    position:absolute;
    top:68px;
    left:50%;
    transform:translateX(-50%);
    z-index:12;
    display:flex;
    gap:4px;
    padding:7px;
    background:rgba(0,0,0,.75);
    border-radius:8px;
}

.lightbar i{
    display:block;
    width:13px;
    height:13px;
    border-radius:2px;
    background:#333;
}

.lightbar i.on{
    background:#39e56b;
    box-shadow:0 0 8px #39e56b;
}

/* COBERTURA */
.coverage{
    position:absolute;
    background:rgba(40,210,80,.30);
    border:1px solid rgba(80,255,110,.5);
    pointer-events:none;
}

/* LINHA AB */
.abline{
    position:absolute;
    height:3px;
    background:#ffeb3b;
    box-shadow:0 0 8px #ffeb3b;
    transform-origin:left center;
    pointer-events:none;
}

/* TRATOR */
#tractor{
    position:absolute;
    width:54px;
    height:82px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) rotate(0deg);
    z-index:10;
}

.tractor-body{
    position:absolute;
    width:34px;
    height:60px;
    left:10px;
    top:12px;
    background:#e6c900;
    border-radius:8px;
    border:2px solid #111;
}

.tractor-cab{
    position:absolute;
    width:28px;
    height:27px;
    left:13px;
    top:0;
    background:#202a31;
    border:2px solid #111;
    border-radius:5px;
}

.wheel{
    position:absolute;
    width:10px;
    height:28px;
    background:#090909;
    border-radius:5px;
    top:30px;
}

.wheel.left{
    left:0;
}

.wheel.right{
    right:0;
}

/* PAINÉIS */
.panel{
    position:absolute;
    z-index:30;
    background:rgba(15,15,15,.94);
    border:1px solid #555;
    border-radius:10px;
    box-shadow:0 5px 25px rgba(0,0,0,.6);
    overflow:hidden;
}

.panel.hidden{
    display:none;
}

.panel-header{
    height:42px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    background:#222;
    border-bottom:1px solid #444;
    font-weight:bold;
}

.close{
    width:32px;
    height:32px;
    border:0;
    border-radius:6px;
    background:#a91f1f;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.panel-content{
    padding:12px;
}

/* PAINEL ESQUERDO */
#menu{
    left:12px;
    top:115px;
    width:245px;
    max-height:calc(100vh - 130px);
}

.btn{
    width:100%;
    border:1px solid #555;
    background:#292929;
    color:white;
    padding:11px;
    margin-bottom:7px;
    border-radius:7px;
    font-size:14px;
    cursor:pointer;
}

.btn:active{
    transform:scale(.98);
}

.btn.green{
    background:#176b31;
}

.btn.yellow{
    background:#806f00;
}

.btn.red{
    background:#762020;
}

input,select{
    width:100%;
    padding:9px;
    margin:4px 0 8px;
    border-radius:6px;
    border:1px solid #555;
    background:#181818;
    color:white;
}

/* PAINEL DIREITO */
#info{
    right:12px;
    top:115px;
    width:250px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #333;
    font-size:13px;
}

/* BOTÃO PARA REABRIR */
#tabs{
    position:absolute;
    right:10px;
    bottom:65px;
    z-index:50;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.tab{
    border:1px solid #555;
    background:rgba(15,15,15,.9);
    color:white;
    padding:9px 12px;
    border-radius:7px;
    font-size:12px;
    display:none;
    cursor:pointer;
}

.tab.visible{
    display:block;
}

/* BARRA INFERIOR */
.bottom{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:52px;
    z-index:20;
    background:rgba(10,10,10,.92);
    border-top:1px solid #444;
    display:flex;
    align-items:center;
    justify-content:space-around;
}

.bottom button{
    background:#292929;
    color:white;
    border:1px solid #555;
    border-radius:6px;
    padding:7px 12px;
}

.speed{
    color:#45ef73;
    font-weight:bold;
}

/* RESPONSIVO DEITADO */
@media(max-height:600px){

    .topbar{
        height:48px;
    }

    .lightbar{
        top:54px;
    }

    #menu,#info{
        top:65px;
        max-height:calc(100vh - 120px);
    }

    .panel-content{
        padding:8px;
    }

    .btn{
        padding:7px;
        margin-bottom:4px;
    }

    #tabs{
        bottom:58px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="mapa">

        <div class="logo">
            🛰️ <span>PORTAL SAT GPS</span>
        </div>

        <!-- BARRA SUPERIOR -->
        <div class="topbar">
            <div class="status fix">● GPS FIX</div>
            <div class="status">RTK: <b id="rtk">FIX</b></div>
            <div class="status">HDOP: <b>0.8</b></div>
            <div class="status">Sat: <b id="sats">18</b></div>
        </div>

        <!-- BARRA DE LUZ -->
        <div class="lightbar" id="lightbar">
            <i></i><i></i><i></i><i></i><i class="on"></i>
            <i class="on"></i>
            <i></i><i></i><i></i><i></i>
        </div>

        <!-- LINHA A/B -->
        <div class="abline" id="abline"></div>

        <!-- COBERTURA -->
        <div class="coverage"
             id="coverage"
             style="width:120px;height:10px;left:calc(50% - 60px);top:calc(50% + 40px);">
        </div>

        <!-- TRATOR -->
        <div id="tractor">
            <div class="tractor-cab"></div>
            <div class="tractor-body"></div>
            <div class="wheel left"></div>
            <div class="wheel right"></div>
        </div>

        <!-- MENU -->
        <div class="panel" id="menu">

            <div class="panel-header">
                <span>CONTROLE</span>
                <button class="close" onclick="hidePanel('menu','tabMenu')">×</button>
            </div>

            <div class="panel-content">

                <button class="btn green" onclick="marcarA()">
                    📍 MARCAR PONTO A
                </button>

                <button class="btn yellow" onclick="marcarB()">
                    📍 MARCAR PONTO B
                </button>

                <button class="btn" onclick="gerarLinha()">
                    ➖ GERAR LINHA A/B
                </button>

                <button class="btn green" onclick="toggleCoverage()">
                    🌱 COBERTURA DE PASSADA
                </button>

                <button class="btn" onclick="centralizar()">
                    🎯 CENTRALIZAR TRATOR
                </button>

                <button class="btn" onclick="abrirConfiguracao()">
                    ⚙️ CONFIGURAÇÕES
                </button>

            </div>
        </div>

        <!-- INFORMAÇÕES -->
        <div class="panel" id="info">

            <div class="panel-header">
                <span>INFORMAÇÕES</span>
                <button class="close" onclick="hidePanel('info','tabInfo')">×</button>
            </div>

            <div class="panel-content">

                <div class="info-row">
                    <span>Velocidade</span>
                    <b class="speed" id="speed">8.2 km/h</b>
                </div>

                <div class="info-row">
                    <span>Direção</span>
                    <b id="heading">0°</b>
                </div>

                <div class="info-row">
                    <span>Largura</span>
                    <b id="widthInfo">6.00 m</b>
                </div>

                <div class="info-row">
                    <span>Linha</span>
                    <b id="lineInfo">—</b>
                </div>

                <div class="info-row">
                    <span>Área</span>
                    <b id="area">0.00 ha</b>
                </div>

            </div>
        </div>

        <!-- CONFIGURAÇÃO -->
        <div class="panel hidden" id="config"
             style="left:50%;top:50%;transform:translate(-50%,-50%);width:300px;">

            <div class="panel-header">
                <span>CONFIGURAÇÕES</span>
                <button class="close" onclick="hidePanel('config','tabConfig')">×</button>
            </div>

            <div class="panel-content">

                <label>Largura do implemento (m)</label>
                <input id="implementWidth"
                       type="number"
                       value="6"
                       min="0.1"
                       step="0.1">

                <label>Velocidade (km/h)</label>
                <input id="speedInput"
                       type="number"
                       value="8.2"
                       min="0"
                       step="0.1">

                <button class="btn green" onclick="salvarConfig()">
                    ✔ SALVAR
                </button>

            </div>
        </div>

        <!-- ABAS ESCONDIDAS -->
        <div id="tabs">

            <button class="tab"
                    id="tabMenu"
                    onclick="showPanel('menu','tabMenu')">
                ☰ Controle
            </button>

            <button class="tab"
                    id="tabInfo"
                    onclick="showPanel('info','tabInfo')">
                ℹ Informações
            </button>

            <button class="tab"
                    id="tabConfig"
                    onclick="showPanel('config','tabConfig')">
                ⚙ Configurações
            </button>

        </div>

        <!-- BARRA INFERIOR -->
        <div class="bottom">

            <button onclick="showPanel('menu','tabMenu')">
                ☰ Menu
            </button>

            <button onclick="showPanel('info','tabInfo')">
                ℹ Info
            </button>

            <button onclick="showPanel('config','tabConfig')">
                ⚙ Config
            </button>

            <span class="speed" id="bottomSpeed">
                8.2 km/h
            </span>

        </div>

    </div>
</div>

<script>

/* =========================
   ESTADO
========================= */

let pontoA = null;
let pontoB = null;
let linhaGerada = false;
let coberturaLigada = true;

let implementWidth = 6;
let velocidade = 8.2;

let heading = 0;
let distanciaPercorrida = 0;


/* =========================
   ABRIR / ESCONDER ABAS
========================= */

function hidePanel(panelId, tabId){

    const panel = document.getElementById(panelId);
    const tab = document.getElementById(tabId);

    if(panel){
        panel.classList.add("hidden");
    }

    if(tab){
        tab.classList.add("visible");
    }
}


function showPanel(panelId, tabId){

    const panel = document.getElementById(panelId);
    const tab = document.getElementById(tabId);

    if(panel){
        panel.classList.remove("hidden");
    }

    if(tab){
        tab.classList.remove("visible");
    }
}


/* =========================
   CONFIGURAÇÃO
========================= */

function abrirConfiguracao(){

    showPanel("config","tabConfig");

}


function salvarConfig(){

    const width =
        parseFloat(document.getElementById("implementWidth").value);

    const speed =
        parseFloat(document.getElementById("speedInput").value);

    if(width > 0){
        implementWidth = width;
    }

    if(speed >= 0){
        velocidade = speed;
    }

    document.getElementById("widthInfo").textContent =
        implementWidth.toFixed(2) + " m";

    document.getElementById("speed").textContent =
        velocidade.toFixed(1) + " km/h";

    document.getElementById("bottomSpeed").textContent =
        velocidade.toFixed(1) + " km/h";

    hidePanel("config","tabConfig");
}


/* =========================
   PONTOS A / B
========================= */

function marcarA(){

    pontoA = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2
    };

    document.getElementById("lineInfo").textContent =
        "A marcado";

}


function marcarB(){

    pontoB = {
        x: window.innerWidth / 2 +
           Math.cos(heading * Math.PI / 180) * 200,

        y: window.innerHeight / 2 -
           Math.sin(heading * Math.PI / 180) * 200
    };

    document.getElementById("lineInfo").textContent =
        "B marcado";

    gerarLinha();

}


function gerarLinha(){

    if(!pontoA || !pontoB){

        document.getElementById("lineInfo").textContent =
            "Marque A e B";

        return;
    }

    const line = document.getElementById("abline");

    const dx = pontoB.x - pontoA.x;
    const dy = pontoB.y - pontoA.y;

    const comprimento =
        Math.sqrt(dx*dx + dy*dy);

    const angulo =
        Math.atan2(dy,dx) * 180 / Math.PI;

    line.style.left = pontoA.x + "px";
    line.style.top = pontoA.y + "px";
    line.style.width = comprimento + "px";
    line.style.transform =
        "rotate(" + angulo + "deg)";

    linhaGerada = true;

    document.getElementById("lineInfo").textContent =
        "A/B ativa";
}


/* =========================
   COBERTURA
========================= */

function toggleCoverage(){

    coberturaLigada = !coberturaLigada;

    const coverage =
        document.getElementById("coverage");

    coverage.style.display =
        coberturaLigada ? "block" : "none";
}


/* =========================
   CENTRALIZAR
========================= */

function centralizar(){

    const tractor =
        document.getElementById("tractor");

    tractor.style.left = "50%";
    tractor.style.top = "50%";

}


/* =========================
   MOVIMENTO / BÚSSOLA
========================= */

document.addEventListener("keydown",function(e){

    if(e.key === "ArrowLeft"){
        heading -= 5;
    }

    if(e.key === "ArrowRight"){
        heading += 5;
    }

    if(heading < 0) heading += 360;
    if(heading >= 360) heading -= 360;

    atualizarDirecao();

});


function atualizarDirecao(){

    document.getElementById("heading").textContent =
        Math.round(heading) + "°";

    document.getElementById("tractor").style.transform =
        "translate(-50%,-50%) rotate(" +
        heading +
        "deg)";

}


/* =========================
   SIMULAÇÃO DE COBERTURA
========================= */

setInterval(function(){

    if(!coberturaLigada) return;

    distanciaPercorrida +=
        velocidade / 3600;

    const area =
        distanciaPercorrida * implementWidth / 10000;

    document.getElementById("area").textContent =
        area.toFixed(3) + " ha";

},1000);


/* =========================
   INICIALIZAÇÃO
========================= */

document.getElementById("widthInfo").textContent =
    implementWidth.toFixed(2) + " m";

document.getElementById("speed").textContent =
    velocidade.toFixed(1) + " km/h";

document.getElementById("bottomSpeed").textContent =
    velocidade.toFixed(1) + " km/h";

atualizarDirecao();

</script>

</body>
</html>
