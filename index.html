<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Sat GPS</title>
<style>
*{margin:0;box-sizing:border-box;font-family:Arial}
body{background:#000;display:flex;flex-direction:column;height:100vh}
#top{background:#367C2B;color:#fff;padding:10px;font-weight:900;text-align:center;border-bottom:4px solid #FFDE00}
#light{background:#111;height:32px;display:flex;justify-content:center;gap:3px;padding:5px}
.led{width:12px;background:#222;border-radius:3px}.led.on{background:#2ECC40;box-shadow:0 0 6px #2ECC40}
#map{flex:1;background:#D9D2B0;position:relative;overflow:hidden}
#grid{position:absolute;inset:-100%;background:linear-gradient(#bbb 1px,transparent 1px),linear-gradient(90deg,#bbb 1px,transparent 1px);background-size:40px 40px;transition:.4s}
#grid.d3{transform:perspective(600px) rotateX(60deg)}
#grid.d2{transform:none}
#trator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;transition:.2s;text-align:center}
#cards{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:6}
.card{background:#fff;color:#111;padding:10px;border-radius:10px;font-size:12px;min-width:120px;border-left:4px solid #367C2B;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.card b{font-size:16px;display:block}
.hide{display:none!important}
#btns{background:#222;padding:8px;display:flex;gap:6px;flex-wrap:wrap}
button{flex:1;min-width:70px;height:44px;border-radius:8px;border:none;font-weight:900}
.g{background:#367C2B;color:#fff}.y{background:#FFDE00}
#cfg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:99;align-items:center;justify-content:center;padding:15px}
#cfg.show{display:flex}
#box{background:#fff;color:#111;width:100%;max-width:360px;border-radius:14px;padding:15px}
input[type=range]{width:100%;accent-color:#367C2B}
</style>
</head>
<body>
<div id="top">PORTAL SAT GPS - GS4 FUNCIONAL</div>
<div id="light"></div>
<div id="map">
<div id="grid" class="d3"></div>
<div id="cards">
<div class="card" id="c1">LARGURA<b id="vL">20.0 m</b>ÁREA<b id="vA">0.00 ha</b>VEL<b id="vV">0.0 km/h</b></div>
<div class="card" style="border-color:#c00" id="c2">DESVIO<b id="vD" style="color:#c00">0.00 m</b><span id="vAB">SEM AB</span></div>
</div>
<div id="trator">
<svg width="110" height="50" viewBox="0 0 110 50" id="svgTr">
<rect x="10" y="8" width="90" height="10" rx="3" fill="#1E5AA7" id="impl"/>
<rect x="35" y="24" width="32" height="16" rx="3" fill="#367C2B" stroke="#000" stroke-width="1"/>
<circle cx="38" cy="42" r="6" fill="#111"/><circle cx="62" cy="42" r="6" fill="#111"/>
<path d="M50 14 L46 22 L54 22 Z" fill="#FFDE00"/>
</svg>
<div style="background:#000;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px" id="lLabel">20.0m</div>
</div>
</div>
<div id="btns">
<button onclick="marcaA()" id="bA">MARCAR A</button>
<button onclick="marcaB()" id="bB">MARCAR B</button>
<button class="y" onclick="abrir()">LARGURA</button>
<button class="g" onclick="go()" id="bGo">▶ SIMULAR</button>
</div>
<div style="padding:6px;background:#111;display:flex;gap:6px">
<button onclick="esconde()" style="flex:1">👁️ TELA LIMPA</button>
<button onclick="muda3D()" style="flex:1" id="b3d">3D / 2D</button>
<button onclick="limpar()" style="flex:1">🗑️ LIMPAR</button>
</div>

<div id="cfg" onclick="fechar()">
<div id="box" onclick="event.stopPropagation()">
<b>AJUSTE FINO LARGURA - até 100m</b><br><br>
<div style="display:flex;gap:8px;align-items:center">
<button onclick="add(-0.1)" style="width:40px">-</button>
<input type="range" min="0.5" max="100" step="0.1" value="20" id="rg" oninput="setL(this.value)">
<button onclick="add(0.1)" style="width:40px">+</button>
</div>
<div style="display:flex;justify-content:space-between;margin-top:6px"><span>0.5m</span><b id="rgV" style="color:#367C2B">20.0 m</b><span>100m</span></div><br>
<button onclick="setL(6)">6m</button> <button onclick="setL(12)">12m</button> <button onclick="setL(20)">20m</button> <button onclick="setL(30)">30m</button> <button onclick="setL(50)">50m</button> <button onclick="setL(100)">100m</button>
<br><br><button class="g" style="width:100%;height:44px" onclick="fechar()">FECHAR</button>
</div>
</div>

<script>
let leds=[];for(let i=0;i<21;i++){let d=document.createElement('div');d.className='led';document.getElementById('light').appendChild(d);leds.push(d);}
let larg=20,area=0,desv=0,run=false,timer=null,hide=false,is3d=true,hasA=false;
function light(v){leds.forEach(l=>l.className='led');leds[10].className='led on';let q=Math.round(Math.abs(v)/0.2);for(let i=0;i<q&&i<10;i++){if(v<0)leds[9-i].className='led on';else leds[11+i].className='led on';}document.getElementById('vD').innerText=v.toFixed(2)+' m';}
function setL(v){larg=parseFloat(v);document.getElementById('vL').innerText=larg.toFixed(1)+' m';document.getElementById('lLabel').innerText=larg.toFixed(1)+'m';document.getElementById('rgV').innerText=larg.toFixed(1)+' m';document.getElementById('rg').value=larg;document.getElementById('impl').setAttribute('width',20+larg*2.5);}
function add(d){setL(Math.min(100,Math.max(0.5,larg+d)));}
function abrir(){document.getElementById('cfg').classList.add('show');}
function fechar(){document.getElementById('cfg').classList.remove('show');}
function marcaA(){hasA=true;document.getElementById('bA').innerText='✓ A OK';document.getElementById('vAB').innerText='A OK - AGUARDE B';}
function marcaB(){if(!hasA){alert('Clique em MARCAR A primeiro');return;}document.getElementById('bB').innerText='✓ B OK';document.getElementById('vAB').innerText='LINHA AB ATIVA';}
function go(){run=!run;document.getElementById('bGo').innerText=run?'⏸ PAUSAR':'▶ SIMULAR';if(run){let a=0;timer=setInterval(()=>{a+=0.03;desv=Math.sin(a)*1.1;area+=0.001*larg/10;document.getElementById('vA').innerText=area.toFixed(2)+' ha';document.getElementById('vV').innerText=(5+Math.random()*2).toFixed(1)+' km/h';light(desv);document.getElementById('trator').style.transform='translate(calc(-50% + '+(desv*20)+'px), -50%) rotate('+(desv*3)+'deg)';},100);}else{clearInterval(timer);timer=null;}}
function esconde(){hide=!hide;document.getElementById('cards').classList.toggle('hide',hide);}
function muda3D(){is3d=!is3d;document.getElementById('grid').className=is3d?'d3':'d2';document.getElementById('b3d').innerText=is3d?'MODO 3D':'MODO 2D';}
function limpar(){area=0;document.getElementById('vA').innerText='0.00 ha';}
setL(20);light(0);
</script>
</body>
</html>
