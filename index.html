<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Sat GPS PRO</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#FFFFFF; --card:#F2F4F7; --texto:#111; --verde:#1A7F37; --borda:#E5E7EB;
}
body.noite{
  --bg:#0F1214; --card:#1C2126; --texto:#FFF; --borda:#2A2E33;
}
*{box-sizing:border-box; font-family:Inter,system-ui,sans-serif}
body{margin:0; background:var(--bg); color:var(--texto); transition:0.3s}

/* TOPO */
.topo{
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 16px; background:var(--card); border-bottom:1px solid var(--borda);
}
.logo{font-weight:900; color:var(--verde); font-size:20px}
.gps{font-size:12px; background:#1A7F37; color:#fff; padding:6px 10px; border-radius:20px}

/* LIGHTBAR PRO */
#lightbar{
  display:flex; gap:5px; justify-content:center;
  background:#000; padding:10px; margin:0;
}
.led{width:14px; height:14px; border-radius:50%; background:#333; transition:0.1s}
.led.on-green{background:#00FF55; box-shadow:0 0 12px #00FF55}
.led.on-red{background:#FF2222; box-shadow:0 0 12px #FF2222}

/* MAPA */
#mapa{
  height:48vh; background: linear-gradient(#9ACD9A, #5A8F3A);
  display:flex; align-items:center; justify-content:center; position:relative;
}
#trator{font-size:48px; transform:rotate(0deg)}
.linha-guia{position:absolute; width:4px; height:100%; background:#00FF55; opacity:0.8}

#desvioBox{
  position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
  background:var(--card); border:2px solid var(--verde); border-radius:14px;
  padding:8px 18px; text-align:center;
}
#desvio{font-size:34px; font-weight:900; color:var(--verde)}

/* CARDS */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px}
.card{background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:12px}
.card b{font-size:26px; display:block}
.card span{font-size:12px; opacity:0.7}

/* BOTOES */
.botoes{display:grid; grid-template-columns:1fr 1fr 1.5fr; gap:10px; padding:0 12px 12px}
.btn{background:var(--verde); color:#fff; border:none; border-radius:12px; padding:14px; font-weight:700; font-size:15px}
.btn.sec{background:transparent; color:var(--verde); border:2px solid var(--verde)}
.nav{display:flex; justify-content:space-around; padding:12px; background:var(--card); border-top:1px solid var(--borda)}
</style>
</head>
<body>

<div class="topo">
  <div class="logo">⚙️🛰️ Portal Sat GPS</div>
  <div style="display:flex; gap:8px; align-items:center">
    <div class="gps" id="gpsStatus">GPS • 12 sats • ±0.8m</div>
    <button onclick="toggleTema()" style="border:none; background:var(--card); font-size:20px">☀️/🌙</button>
  </div>
</div>

<div id="lightbar"></div>

<div id="mapa">
  <div class="linha-guia"></div>
  <div id="trator">🚜</div>
  <div id="desvioBox">
    <small>DESVIO</small>
    <div id="desvio">< 12cm ></div>
  </div>
</div>

<div class="grid">
  <div class="card"><span>Velocidade</span><b id="vel">8.5 km/h</b></div>
  <div class="card"><span>Área trabalhada</span><b id="area">3.25 ha</b></div>
  <div class="card"><span>Distância</span><b id="dist">1.2 km</b></div>
  <div class="card"><span>Largura</span><b>6m</b></div>
</div>

<div class="botoes">
  <button class="btn sec" id="btnA" onclick="marcarA()">Marcar A</button>
  <button class="btn sec" id="btnB" onclick="marcarB()">Marcar B</button>
  <button class="btn" onclick="iniciar()">▶ Iniciar</button>
</div>

<div class="nav">
  <div>🏠 Início</div><div style="color:var(--verde)">🧭 Guiar</div><div>🗺️ Talhões</div><div>⚙️ Config</div>
</div>

<script>
// TEMA DIA/NOITE
function toggleTema(){
  document.body.classList.toggle('noite');
  localStorage.setItem('tema', document.body.classList.contains('noite')?'noite':'dia');
}
if(localStorage.getItem('tema')==='noite') document.body.classList.add('noite');

// LIGHTBAR - 21 LEDs
const lb = document.getElementById('lightbar');
for(let i=0;i<21;i++){ let d=document.createElement('div'); d.className='led'; d.id='led'+i; lb.appendChild(d); }
function atualizarBarra(desvioCm){
  for(let i=0;i<21;i++) document.getElementById('led'+i).className='led';
  document.getElementById('led10').classList.add('on-green');
  document.getElementById('led9').classList.add('on-green');
  document.getElementById('led11').classList.add('on-green');
  document.getElementById('desvio').innerHTML = (desvioCm<0?'&lt;':desvioCm>0?'&gt;':'')+` ${Math.abs(desvioCm)}cm `+(desvioCm>0?'&gt;':desvioCm<0?'&lt;':'');
  let q = Math.round(Math.abs(desvioCm)/8);
  if(desvioCm<0){ for(let i=0;i<q;i++){ let el=document.getElementById('led'+(9-i)); if(el) el.classList.add('on-red'); } }
  if(desvioCm>0){ for(let i=0;i<q;i++){ let el=document.getElementById('led'+(11+i)); if(el) el.classList.add('on-red'); } }
}
setInterval(()=>{ atualizarBarra(Math.round((Math.random()*40-20))); }, 800);

// GPS REAL
if(navigator.geolocation){
  navigator.geolocation.watchPosition(pos=>{
    document.getElementById('gpsStatus').innerText = `GPS • ±${pos.coords.accuracy.toFixed(1)}m`;
    document.getElementById('vel').innerText = ((pos.coords.speed||0)*3.6).toFixed(1)+' km/h';
  }, null, {enableHighAccuracy:true});
}
function marcarA(){ document.getElementById('btnA').innerText='✓ A'; document.getElementById('btnA').style.background='#1A7F37'; document.getElementById('btnA').style.color='#fff'; }
function marcarB(){ document.getElementById('btnB').innerText='✓ B'; document.getElementById('btnB').style.background='#1A7F37'; document.getElementById('btnB').style.color='#fff'; }
function iniciar(){ alert('Trabalho iniciado! Linha A-B ativa'); }

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
