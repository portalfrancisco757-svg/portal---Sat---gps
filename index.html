<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Sat GPS</title>
<style>
body{margin:0;background:#000;font-family:Arial;color:#fff;height:100vh;display:flex;flex-direction:column}
#top{background:#1B5E20;color:#fff;padding:10px;text-align:center;font-weight:900;font-size:18px;border-bottom:3px solid yellow}
#luz{background:#111;height:28px;display:flex;justify-content:center;gap:3px;padding:5px}
.led{width:14px;background:#222}
.led.on{background:#0f0}
#campo{flex:1;background:#2E7D32;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#campo:after{content:"PORTAL SAT GPS 🛰️ PORTAL SAT GPS 🛰️ PORTAL SAT GPS 🛰️";position:absolute;top:50%;left:-30%;font-size:26px;font-weight:900;color:rgba(255,255,255,0.15);transform:rotate(-15deg);white-space:nowrap}
#trator{font-size:50px;z-index:2}
#info{background:#fff;color:#000;display:flex;justify-content:space-around;padding:10px;font-weight:900;font-size:13px;text-align:center}
#info b{display:block;color:#1B5E20;font-size:16px}
#btns{background:#212121;padding:6px;display:flex;gap:5px;flex-wrap:wrap}
#btns button{flex:1;min-width:70px;height:48px;border:none;border-radius:8px;font-weight:900;font-size:12px}
.g{background:#2E7D32;color:#fff}.y{background:yellow;color:#000}.r{background:#900;color:#fff}.c{background:#444;color:#fff}
#cfg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;color:#000;z-index:100;padding:15px}
</style>
</head>
<body>

<div id="top">PORTAL SAT GPS 🛰️</div>
<div id="luz"></div>
<div id="campo"><div id="trator">🚜</div></div>

<div id="info">
<div>LARGURA<b id="vL">20.0 m</b></div>
<div>DESVIO<b id="vD" style="color:red">0.00 m</b></div>
<div>AREA<b id="vA">0.00 ha</b></div>
<div>GPS<b id="vG">--</b></div>
</div>

<div id="btns">
<button class="c" onclick="marcaA()" id="bA">MARCAR A</button>
<button class="c" onclick="marcaB()" id="bB">MARCAR B</button>
<button class="y" onclick="document.getElementById('cfg').style.display='block'">LARGURA</button>
<button class="g" onclick="iniciar()" id="bI">▶ INICIAR</button>
</div>

<div id="btns" style="background:#111">
<button class="c" onclick="esconder()" id="bH">👁️ LIMPA</button>
<button class="r" onclick="limpar()">🗑️ LIMPAR</button>
</div>

<div id="cfg">
<h2>PORTAL SAT GPS 🛰️ - LARGURA</h2><br>
<input type="range" id="rg" min="0.5" max="100" step="0.1" value="20" oninput="setL(this.value)" style="width:100%">
<h1 id="rgV" style="text-align:center;color:green">20.0 m</h1><br>
<button onclick="setL(6)">6m</button> <button onclick="setL(12)">12.2m</button> <button onclick="setL(20)">20m</button> <button onclick="setL(30)">30m</button> <button onclick="setL(100)">100m</button>
<br><br>
<button class="g" style="width:100%;height:50px" onclick="document.getElementById('cfg').style.display='none'">FECHAR - VOLTAR AO CAMPO</button>
<br><br>
<div style="background:#E8F5E9;padding:10px;font-size:12px">Como usar com antena: 1- Ative GPS Alta Precisão no Android 2- Permita localização no Chrome 3- Clique INICIAR 4- Ande 15m, clique A, ande 15m, clique B. Pronto, guia de verdade.</div>
</div>

<script>
var leds=[];
for(var i=0;i<15;i++){var d=document.createElement('div');d.className='led';document.getElementById('luz').appendChild(d);leds.push(d);}
var larg=20,area=0,desv=0,run=false,timer=null,watchId=null,hasA=false,hasB=false,lastPos=null,pointA=null,pointB=null;

function toRad(d){return d*Math.PI/180;}
function dist(a,b){
var R=6371000;
var dLat=toRad(b.lat-a.lat);
var dLon=toRad(b.lon-a.lon);
var lat1=toRad(a.lat);
var lat2=toRad(b.lat);
var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)*Math.sin(dLon/2);
return R*2*Math.asin(Math.sqrt(h));
}
function bearing(a,b){
var y=Math.sin(toRad(b.lon-a.lon))*Math.cos(toRad(b.lat));
var x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lon-a.lon));
return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function crossTrack(A,B,P){
var d13=dist(A,P);
var brg13=toRad(bearing(A,P)-bearing(A,B));
return Math.asin(Math.sin(d13/6371000)*Math.sin(brg13))*6371000;
}

function luz(v){
for(var i=0;i<leds.length;i++)leds[i].className='led';
leds[7].className='led on';
var q=Math.round(Math.abs(v)/0.25);
for(var i=0;i<q&&i<7;i++){
if(v<0&&leds[6-i])leds[6-i].className='led on';
if(v>0&&leds[8+i])leds[8+i].className='led on';
}
document.getElementById('vD').innerText=v.toFixed(2)+' m';
}

function setL(v){
larg=parseFloat(v);
document.getElementById('vL').innerText=larg.toFixed(1)+' m';
document.getElementById('rgV').innerText=larg.toFixed(1)+' m';
document.getElementById('rg').value=larg;
}

function marcaA(){
if(!lastPos){alert('Ligue o GPS primeiro - clique INICIAR');return;}
pointA={lat:lastPos.lat,lon:lastPos.lon};
hasA=true;
document.getElementById('bA').innerHTML='✓ A OK';
}

function marcaB(){
if(!hasA){alert('Marque A primeiro');return;}
if(!lastPos){alert('Sem GPS');return;}
pointB={lat:lastPos.lat,lon:lastPos.lon};
hasB=true;
document.getElementById('bB').innerHTML='✓ B OK';
}

function iniciar(){
if(run){
run=false;
if(timer)clearInterval(timer);
if(watchId)navigator.geolocation.clearWatch(watchId);
document.getElementById('bI').innerHTML='▶ INICIAR';
document.getElementById('vG').innerHTML='--';
return;
}
run=true;
document.getElementById('bI').innerHTML='⏸ PARAR';
document.getElementById('vG').innerHTML='BUSCANDO...';

if(navigator.geolocation){
watchId=navigator.geolocation.watchPosition(function(p){
var pos={lat:p.coords.latitude,lon:p.coords.longitude};
document.getElementById('vG').innerHTML= p.coords.accuracy.toFixed(0)+'m';
if(!lastPos){lastPos=pos;return;}
var d=dist(lastPos,pos);
if(d<0.6)return;
area+=d*larg/10000;
document.getElementById('vA').innerHTML=area.toFixed(2)+' ha';
if(hasA&&hasB){
desv=crossTrack(pointA,pointB,pos);
}else{
desv=(Math.random()-0.5)*0.6;
}
luz(desv);
document.getElementById('trator').style.marginLeft=(desv*18)+'px';
lastPos=pos;
},function(e){
document.getElementById('vG').innerHTML='SIMULANDO';
simular();
},{enableHighAccuracy:true,maximumAge:0,timeout:10000});
}else{
simular();
}
}

function simular(){
if(timer)clearInterval(timer);
var t=0;
timer=setInterval(function(){
t+=0.05;
desv=Math.sin(t)*0.9;
area+=0.001*larg/20;
document.getElementById('vA').innerHTML=area.toFixed(2)+' ha';
luz(desv);
document.getElementById('trator').style.marginLeft=(desv*18)+'px';
},120);
}

function limpar(){
area=0;
document.getElementById('vA').innerHTML='0.00 ha';
luz(0);
document.getElementById('trator').style.marginLeft='0px';
}

function esconder(){
var info=document.getElementById('info');
if(info.style.display==='none'){
info.style.display='flex';
document.getElementById('top').style.display='block';
document.getElementById('luz').style.display='flex';
document.getElementById('bH').innerHTML='👁️ LIMPA';
}else{
info.style.display='none';
document.getElementById('top').style.display='none';
document.getElementById('luz').style.display='none';
document.getElementById('bH').innerHTML='👁️ MOSTRAR';
}
}

setL(20);
luz(0);
</script>
</body>
</html>
