<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PORTAL SAT GPS 🛰️ — PRO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        html, body {
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; position: fixed;
            background: #000; color: #fff;
            user-select: none;
        }

        .tela {
            width: 100%; height: 100%;
            display: grid;
            grid-template-rows: 48px 1fr;
            grid-template-columns: 55px 1fr 55px;
            grid-template-areas:
                "topo topo topo"
                "esq mapa dir";
            gap: 0; background: #000;
        }

        .topo {
            grid-area: topo; background: #0a1628;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 10px; border-bottom: 2px solid #2E7D32;
        }
        .logo { font-size: 16px; font-weight: bold; color: #4ade80; display: flex; align-items: center; gap: 6px; }
        .status-gps { display: flex; gap: 10px; font-size: 10.5px; align-items: center; }
        .status-item { display: flex; align-items: center; gap: 3px; }
        .bolinha { width: 10px; height: 10px; border-radius: 50%; background: #333; transition: all 0.3s; }
        .bolinha.verde { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .bolinha.amarela { background: #eab308; box-shadow: 0 0 6px #eab308; }
        .bolinha.vermelha { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
        .status-div { border-left: 1px solid #2E7D32; padding-left: 8px; }

        .barra-luz {
            position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
            width: 320px; height: 22px;
            background: #0f0f0f; border: 2px solid #333; border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            z-index: 150; box-shadow: inset 0 0 4px #000;
        }
        .luz-esq, .luz-dir {
            height: 16px; width: 145px;
            background: linear-gradient(90deg, #ef4444 0%, #f97316 25%, #eab308 50%, #22c55e 100%);
            border-radius: 2px; transform: scaleX(0); transition: transform 0.08s ease-out;
            transform-origin: center;
        }
        .luz-esq { transform-origin: right; }
        .luz-dir { transform-origin: left; }
        .centro-luz {
            width: 4px; height: 20px; background: #fff; border-radius: 2px;
            z-index: 5; box-shadow: 0 0 6px #fff;
        }
        .desvio-valor {
            position: absolute; bottom: -24px; font-size: 15px; font-weight: bold;
            color: #ffd700; text-shadow: 0 0 4px #000; white-space: nowrap;
        }

        .painel-esq, .painel-dir {
            background: #0f172a;
            display: flex; flex-direction: column; align-items: center;
            padding: 6px 4px; gap: 6px;
            border-right: 1px solid #2E7D32;
        }
        .painel-dir { border-right: none; border-left: 1px solid #2E7D32; }
        .btn {
            width: 44px; height: 44px; padding: 0; font-size: 20px;
            border-radius: 8px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            background: #1e293b; color: #fff;
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn:active:not(:disabled) { transform: scale(0.9); background: #334155; }
        .btn.ativo { background: #2E7D32; box-shadow: inset 0 0 8px rgba(0,0,0,0.6); }
        .btn.pintando { background: #16a34a; animation: piscar 1s infinite; }
        @keyframes piscar { 0% {opacity:1;} 50% {opacity:0.5;} 100% {opacity:1;} }

        .mapa {
            grid-area: mapa; background: #050810;
            position: relative; overflow: hidden;
            cursor: crosshair;
            transition: transform 0.5s ease;
        }

        /* FUNDO PARADO — NÃO MEXE MAIS */
        .mapa-grade-2d {
            background-image: 
                linear-gradient(rgba(46, 125, 50, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 125, 50, 0.12) 1px, transparent 1px);
            background-size: 25px 25px;
            background-position: center center;
            background-attachment: fixed;
        }
        .mapa-grade-3d {
            background-image: 
                linear-gradient(rgba(46, 125, 50, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 125, 50, 0.15) 1px, transparent 1px);
            background-size: 25px 25px;
            background-position: center center;
            background-attachment: fixed;
            transform: perspective(800px) rotateX(30deg);
            transform-origin: center center;
        }

        #canvasCobertura {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        .linha-guia-principal {
            position: absolute; top: 0; bottom: 0; width: 3px;
            background: linear-gradient(180deg, #22c55e, #4ade80, #22c55e);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
            z-index: 20; display: none;
        }
        .linha-paralela {
            position: absolute; top: 0; bottom: 0; width: 1px;
            background: rgba(74, 222, 128, 0.35);
            z-index: 15; display: none;
        }
        .ponto-a, .ponto-b {
            position: absolute; left: 50%; transform: translateX(-50%);
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; color: #fff;
            z-index: 25; display: none;
            border: 2px solid #fff;
        }
        .ponto-a { background: #22c55e; box-shadow: 0 0 12px #22c55e; bottom: 20px; }
        .ponto-b { background: #3b82f6; box-shadow: 0 0 12px #3b82f6; top: 20px; }

        /* FLECHA AMARELA — SE MOVE COM GPS */
        .trator {
            position: absolute;
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid #ffd700;
            filter: drop-shadow(0 0 10px #ffd700);
            z-index: 30;
            transition: transform 0.15s linear;
            transform-origin: center center;
        }

        .dados {
            position: absolute; bottom: 8px; left: 8px;
            background: rgba(0,0,0,0.8); padding: 8px 10px;
            border-radius: 6px; border: 1px solid #2E7D32;
            font-size: 11px; line-height: 1.7; z-index: 40;
            min-width: 160px;
        }
        .dados span { color: #4ade80; font-weight: bold; }
        .dados .titulo { color: #94a3b8; font-size: 9px; text-transform: uppercase; margin-bottom: 2px; border-bottom: 1px solid #2E7D32; padding-bottom: 3px; }
        .aviso-distancia {
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
            background: rgba(234, 179, 8, 0.9); color: #000;
            padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px;
            z-index: 160; display: none;
        }

        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95); z-index: 200;
            display: none; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #0f172a; padding: 20px; border-radius: 12px;
            border: 2px solid #2E7D32; width: 92%; max-width: 400px;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-content h3 { color: #4ade80; margin-bottom: 15px; text-align: center; font-size: 18px; }
        .campo { margin-bottom: 14px; }
        .campo label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 13px; }
        .campo input, .campo select {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155;
            background: #1e293b; color: #fff; font-size: 15px;
        }
        .modal-botoes { display: flex; gap: 10px; margin-top: 18px; }
        .btn-modal { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-modal.verde { background: #2E7D32; color: white; }
        .btn-modal.cinza { background: #334155; color: white; }
    </style>
</head>
<body>

<div class="tela">
    <div class="topo">
        <div class="logo">🛰️ PORTAL SAT GPS</div>
        <div class="status-gps">
            <div class="status-item"><span id="bolinhaGps" class="bolinha"></span> GNSS</div>
            <div class="status-item">📡 <span id="satNum">--/--</span></div>
            <div class="status-item">🎯 <span id="precisao">---</span></div>
            <div class="status-item status-div" id="modoGnss">GNSS</div>
            <div class="status-item">⏱️ <span id="hora">00:00:00</span></div>
        </div>
    </div>

    <div class="barra-luz" id="barraLuz">
        <div class="luz-esq" id="luzEsq"></div>
        <div class="centro-luz"></div>
        <div class="luz-dir" id="luzDir"></div>
        <div class="desvio-valor" id="desvioValor">0.00 m</div>
    </div>

    <div class="aviso-distancia" id="avisoDistancia">📍 Anda 5m para ativar Ponto B</div>

    <div class="painel-esq">
        <button class="btn" id="btnPintar" onclick="alternarPintura()" title="Iniciar/Parar Cobertura">🖌️</button>
        <button class="btn" id="btnA" onclick="criarPontoA()" title="Ponto A - Linha Guia">📍</button>
        <button class="btn" id="btnB" onclick="criarPontoB()" title="Ponto B - Linha Guia" disabled>🎯</button>
        <button class="btn" onclick="alternarModoVisual()" id="btnModoVisual" title="2D/3D">📐</button>
        <button class="btn" onclick="paralelas()" title="Linhas Paralelas">〰️</button>
    </div>

    <div class="mapa mapa-grade-2d" id="mapa">
        <canvas id="canvasCobertura"></canvas>
        <div class="linha-guia-principal" id="linhaGuia"></div>
        <div class="ponto-a" id="pontoA">A</div>
        <div class="ponto-b" id="pontoB">B</div>
        <div class="trator" id="trator"></div>

        <div class="dados">
            <div class="titulo">DADOS DE NAVEGAÇÃO</div>
            <div>Latitude: <span id="dLat">--.------°</span></div>
            <div>Longitude: <span id="dLon">--.------°</span></div>
            <div>Velocidade: <span id="dVel">0.0</span> km/h</div>
            <div>Rumo: <span id="dRumo">---°</span></div>
            <div>Faixa: <span id="dLargura">24.0m</span></div>
            <div>Área: <span id="dArea">0.00 ha</span></div>
            <div>Distância: <span id="dDistancia">0.00 m</span></div>
        </div>
    </div>

    <div class="painel-dir">
        <button class="btn" onclick="abrirConfig()" title="Configurações">⚙️</button>
        <button class="btn" onclick="salvarTalhao()" title="Salvar Talhão">💾</button>
        <button class="btn" onclick="carregarTalhao()" title="Carregar Talhão">📂</button>
        <button class="btn" onclick="limparTudo()" title="Limpar Tudo">🗑️</button>
        <button class="btn" onclick="zoomIn()" title="Aproximar">➕</button>
        <button class="btn" onclick="zoomOut()" title="Afastar">➖</button>
    </div>
</div>

<div class="modal" id="modalConfig">
    <div class="modal-content">
        <h3>⚙️ CONFIGURAÇÕES — PORTAL SAT GPS</h3>
        <div class="campo">
            <label>Largura do Implemento (metros)</label>
            <input type="number" id="inpLargura" value="24.0" step="0.1" min="0.1" onchange="atualizarEspacamentoParalelas()">
        </div>
        <div class="campo">
            <label>Nome do Talhão / Área</label>
            <input type="text" id="inpTalhao" value="Talhão 1">
        </div>
        <div class="campo">
            <label>Tipo de Correção GNSS</label>
            <select id="inpCorrecao">
                <option value="gnss">GNSS Autônomo (2–5 m)</option>
                <option value="sbas">SBAS / WAAS / EGNOS (30–100 cm)</option>
                <option value="rtk">RTK / RTK+ (1–2 cm) — Antena Externa</option>
            </select>
        </div>
        <div class="campo">
            <label>Desvio máximo da barra de luz (metros)</label>
            <input type="number" id="inpMaxDesvio" value="0.5" step="0.1" min="0.1">
        </div>
        <div class="modal-botoes">
            <button class="btn-modal verde" onclick="salvarConfig()">✅ Salvar</button>
            <button class="btn-modal cinza" onclick="fecharConfig()">❌ Cancelar</button>
        </div>
    </div>
</div>

<script>
const ESTADO = {
    lat: -26.341234, lon: -54.687901,
    latAnterior: null, lonAnterior: null,
    velocidade: 0, rumo: 0,
    precisao: 0, satelites: 0,
    
    pontoA: null, pontoB: null,
    desvioLinha: 0,
    distanciaDesdeA: 0,
    
    larguraImplemento: 24.0,
    distanciaPercorrida: 0, areaTotal: 0,
    
    nomeTalhao: 'Talhão 1',
    modoCorrecao: 'gnss',
    maxDesvioBarra: 0.5,
    escala: 1.0,
    
    pintando: false,
    ultimoPonto: null,
    
    modoVisual: '2d',
    linhasParalelas: [],
    
    // Apenas a flecha e a cobertura se movem
    flechaX: 0,
    flechaY: 0,
    latOrigem: null,
    lonOrigem: null,
    metrosPorGrauLat: 111320,
    metrosPorGrauLon: 111320 * Math.cos(-26.34 * Math.PI / 180)
};

const canvas = document.getElementById('canvasCobertura');
const ctx = canvas.getContext('2d');
const mapa = document.getElementById('mapa');
const trator = document.getElementById('trator');
const btnB = document.getElementById('btnB');
const avisoDistancia = document.getElementById('avisoDistancia');
const linhaGuia = document.getElementById('linhaGuia');

function ajustarCanvas() {
    const rect = mapa.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
}
ajustarCanvas();
window.addEventListener('resize', ajustarCanvas);

setInterval(() => {
    const h = new Date();
    document.getElementById('hora').textContent = h.toLocaleTimeString('pt-BR', {hour12: false});
}, 1000);

function calcularDistancia(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

// ========== FLECHA SE MOVE, FUNDO FICA PARADO ==========
function atualizarPosicaoFlecha() {
    if (ESTADO.latOrigem === null) {
        ESTADO.latOrigem = ESTADO.lat;
        ESTADO.lonOrigem = ESTADO.lon;
    }

    ESTADO.metrosPorGrauLon = 111320 * Math.cos(ESTADO.lat * Math.PI / 180);

    const dLat = ESTADO.lat - ESTADO.latOrigem;
    const dLon = ESTADO.lon - ESTADO.lonOrigem;

    const pxPorMetro = 3 * ESTADO.escala;

    ESTADO.flechaX = dLon * ESTADO.metrosPorGrauLon * pxPorMetro;
    ESTADO.flechaY = -dLat * ESTADO.metrosPorGrauLat * pxPorMetro;

    // Flecha amarela se move pela tela
    trator.style.left = `calc(50% + ${ESTADO.flechaX}px)`;
    trator.style.top = `calc(50% + ${ESTADO.flechaY}px)`;
    trator.style.transform = `translate(-50%, -50%) rotate(${ESTADO.rumo}deg)`;
}

function iniciarGPS() {
    if (!navigator.geolocation) {
        alert("⚠️ GPS não disponível. Verifique permissões de localização.");
        return;
    }

    const opcoesGPS = {
        enableHighAccuracy: true,
        maximumAge: 500,
        timeout: 3000
    };

    navigator.geolocation.watchPosition(
        (posicao) => {
            ESTADO.latAnterior = ESTADO.lat;
            ESTADO.lonAnterior = ESTADO.lon;

            ESTADO.lat = posicao.coords.latitude;
            ESTADO.lon = posicao.coords.longitude;
            ESTADO.precisao = posicao.coords.accuracy || 0;
            ESTADO.satelites = posicao.coords.satellites || 8;
            ESTADO.velocidade = posicao.coords.speed ? posicao.coords.speed * 3.6 : 0;

            if (posicao.coords.heading !== null && posicao.coords.speed > 0.3) {
                ESTADO.rumo = posicao.coords.heading;
            } else if (ESTADO.latAnterior && ESTADO.lonAnterior) {
                const dLat = ESTADO.lat - ESTADO.latAnterior;
                const dLon = ESTADO.lon - ESTADO.lonAnterior;
                if (Math.abs(dLat) > 0.000001 || Math.abs(dLon) > 0.000001) {
                    let rumoCalc = Math.atan2(dLon, dLat) * 180 / Math.PI;
                    if (rumoCalc < 0) rumoCalc += 360;
                    ESTADO.rumo = rumoCalc;
                }
            }

            if (ESTADO.pontoA && !ESTADO.pontoB) {
                const dist = calcularDistancia(
                    ESTADO.pontoA.lat, ESTADO.pontoA.lon,
                    ESTADO.lat, ESTADO.lon
                );
                ESTADO.distanciaDesdeA = dist;
                document.getElementById('dDistancia').textContent = dist.toFixed(1) + ' m';

                if (dist >= 5) {
                    btnB.disabled = false;
                    avisoDistancia.style.display = 'block';
                    avisoDistancia.textContent = '✅ Ponto B liberado! Toque para confirmar';
                } else {
                    btnB.disabled = true;
                    avisoDistancia.style.display = 'block';
                    avisoDistancia.textContent = `📍 Anda mais ${(5 - dist).toFixed(1)}m para liberar B`;
                }
            }

            calcularDesvioLinha();
            atualizarPosicaoFlecha();
            atualizarTela();
            if (ESTADO.pintando) desenharCobertura();
        },
        (erro) => {
            console.warn("⚠️ GPS — modo simulação:", erro.message);
            simularMovimento();
        },
        opcoesGPS
    );
}

let timerSimulacao = null;
function simularMovimento() {
    if (timerSimulacao) return;
    timerSimulacao = setInterval(() => {
        const rad = ESTADO.rumo * Math.PI / 180;
        const passo = 0.000003;

        ESTADO.latAnterior = ESTADO.lat;
        ESTADO.lonAnterior = ESTADO.lon;

        ESTADO.lat += Math.cos(rad) * passo;
        ESTADO.lon += Math.sin(rad) * passo;
        ESTADO.rumo += Math.sin(Date.now() / 8000) * 0.2;
        if (ESTADO.rumo < 0) ESTADO.rumo += 360;
        if (ESTADO.rumo >= 360) ESTADO.rumo -= 360;
        ESTADO.velocidade = 8 + Math.sin(Date.now() / 5000) * 3;
        ESTADO.precisao = 3.5;

        if (ESTADO.pontoA && !ESTADO.pontoB) {
            const dist = calcularDistancia(
                ESTADO.pontoA.lat, ESTADO.pontoA.lon,
                ESTADO.lat, ESTADO.lon
            );
            ESTADO.distanciaDesdeA = dist;
            document.getElementById('dDistancia').textContent = dist.toFixed(1) + ' m';

            if (dist >= 5) {
                btnB.disabled = false;
                avisoDistancia.style.display = 'block';
                avisoDistancia.textContent = '✅ Ponto B liberado! Toque para confirmar';
            } else {
                btnB.disabled = true;
                avisoDistancia.style.display = 'block';
                avisoDistancia.textContent = `📍 Anda mais ${(5 - dist).toFixed(1)}m para liberar B`;
            }
        }

        calcularDesvioLinha();
        atualizarPosicaoFlecha();
        atualizarTela();
        if (ESTADO.pintando) desenharCobertura();
    }, 300);
}

function calcularDesvioLinha() {
    if (!ESTADO.pontoA || !ESTADO.pontoB) {
        ESTADO.desvioLinha = 0;
        return;
    }

    const dLonAB = ESTADO.pontoB.lon - ESTADO.pontoA.lon;
    const dLatAB = ESTADO.pontoB.lat - ESTADO.pontoA.lat;
    const comprimentoAB = Math.sqrt(dLonAB * dLonAB + dLatAB * dLatAB);

    if (comprimentoAB < 0.000001) {
        ESTADO.desvioLinha = 0;
        return;
    }

    const t = Math.max(0, Math.min(1,
        ((ESTADO.lon - ESTADO.pontoA.lon) * dLonAB +
         (ESTADO.lat - ESTADO.pontoA.lat) * dLatAB) /
        (comprimentoAB * comprimentoAB)
    ));

    const projLon = ESTADO.pontoA.lon + t * dLonAB;
    const projLat = ESTADO.pontoA.lat + t * dLatAB;

    const metrosPorGrauLat = 111320;
    const metrosPorGrauLon = 111320 * Math.cos(ESTADO.lat * Math.PI / 180);

    const desvioMeters = Math.sqrt(
        Math.pow((ESTADO.lon - projLon) * metrosPorGrauLon, 2) +
        Math.pow((ESTADO.lat - projLat) * metrosPorGrauLat, 2)
    );

    const produtoVetorial = (ESTADO.lon - ESTADO.pontoA.lon) * dLatAB -
                            (ESTADO.lat - ESTADO.pontoA.lat) * dLonAB;
    ESTADO.desvioLinha = desvioMeters * (produtoVetorial >= 0 ? 1 : -1);
}

function atualizarTela() {
    document.getElementById('dLat').textContent = ESTADO.lat.toFixed(6) + '°';
    document.getElementById('dLon').textContent = ESTADO.lon.toFixed(6) + '°';
    document.getElementById('dVel').textContent = ESTADO.velocidade.toFixed(1);
    document.getElementById('dRumo').textContent = Math.round(ESTADO.rumo) + '°';
    document.getElementById('dLargura').textContent = ESTADO.larguraImplemento.toFixed(1) + ' m';
    document.getElementById('dArea').textContent = ESTADO.areaTotal.toFixed(2) + ' ha';

    atualizarBarraLuz();
    atualizarStatusGNSS();

    document.getElementById('pontoA').style.display = ESTADO.pontoA ? 'flex' : 'none';
    document.getElementById('pontoB').style.display = ESTADO.pontoB ? 'flex' : 'none';

    if (ESTADO.pontoA && ESTADO.pontoB) {
        linhaGuia.style.display = 'block';
        avisoDistancia.style.display = 'none';
        desenharLinhasParalelas();
    } else {
        linhaGuia.style.display = 'none';
        removerTodasLinhasParalelas();
    }
}

function atualizarBarraLuz() {
    if (!ESTADO.pontoA || !ESTADO.pontoB) {
        document.getElementById('luzEsq').style.transform = 'scaleX(0)';
        document.getElementById('luzDir').style.transform = 'scaleX(0)';
        document.getElementById('desvioValor').textContent = '--- m';
        return;
    }

    const desvio = ESTADO.desvioLinha;
    const maxDesvio = ESTADO.maxDesvioBarra;
    const escala = Math.min(Math.abs(desvio) / maxDesvio, 1);

    if (desvio < -0.02) {
        document.getElementById('luzEsq').style.transform = `scaleX(${escala})`;
        document.getElementById('luzDir').style.transform = 'scaleX(0)';
    } else if (desvio > 0.02) {
        document.getElementById('luzEsq').style.transform = 'scaleX(0)';
        document.getElementById('luzDir').style.transform = `scaleX(${escala})`;
    } else {
        document.getElementById('luzEsq').style.transform = 'scaleX(0)';
        document.getElementById('luzDir').style.transform = 'scaleX(0)';
    }
    document.getElementById('desvioValor').textContent = desvio.toFixed(2) + ' m';
}

function atualizarStatusGNSS() {
    const bolinha = document.getElementById('bolinhaGps');
    const precisaoEl = document.getElementById('precisao');
    const modoEl = document.getElementById('modoGnss');
    const satEl = document.getElementById('satNum');

    satEl.textContent = ESTADO.satelites + '/12';

    if (ESTADO.modoCorrecao === 'rtk' || ESTADO.precisao < 0.05) {
        bolinha.className = 'bolinha verde';
        precisaoEl.textContent = '~2 cm';
        modoEl.textContent = 'RTK';
    } else if (ESTADO.modoCorrecao === 'sbas' || ESTADO.precisao < 1.0) {
        bolinha.className = 'bolinha amarela';
        precisaoEl.textContent = '~50 cm';
        modoEl.textContent = 'SBAS';
    } else if (ESTADO.precisao < 5.0) {
        bolinha.className = 'bolinha amarela';
        precisaoEl.textContent = ESTADO.precisao.toFixed(0) + ' m';
        modoEl.textContent = 'GNSS';
    } else {
        bolinha.className = 'bolinha vermelha';
        precisaoEl.textContent = '>5 m';
        modoEl.textContent = 'BUSCANDO';
    }
}

// ========== LINHAS PARALELAS FIXAS NO FUNDO ==========
function desenharLinhasParalelas() {
    removerTodasLinhasParalelas();

    const larguraTela = mapa.clientWidth;
    const espacamentoPx = ESTADO.larguraImplemento * 4 * ESTADO.escala;

    const linhasCadaLado = Math.ceil((larguraTela / 2) / espacamentoPx);

    for (let i = 1; i <= linhasCadaLado; i++) {
        const linha = document.createElement('div');
        linha.className = 'linha-paralela';
        linha.style.left = `calc(50% - ${espacamentoPx * i}px)`;
        linha.style.display = 'block';
        mapa.appendChild(linha);
        ESTADO.linhasParalelas.push(linha);
    }

    for (let i = 1; i <= linhasCadaLado; i++) {
        const linha = document.createElement('div');
        linha.className = 'linha-paralela';
        linha.style.left = `calc(50% + ${espacamentoPx * i}px)`;
        linha.style.display = 'block';
        mapa.appendChild(linha);
        ESTADO.linhasParalelas.push(linha);
    }
}

function removerTodasLinhasParalelas() {
    ESTADO.linhasParalelas.forEach(linha => linha.remove());
    ESTADO.linhasParalelas = [];
}

function atualizarEspacamentoParalelas() {
    ESTADO.larguraImplemento = parseFloat(document.getElementById('inpLargura').value);
    document.getElementById('dLargura').textContent = ESTADO.larguraImplemento.toFixed(1) + ' m';
    if (ESTADO.pontoA && ESTADO.pontoB) {
        desenharLinhasParalelas();
    }
}

// ========== COBERTURA MOVENDO JUNTO COM A FLECHA ==========
function desenharCobertura() {
    const pxPorMetro = 4 * ESTADO.escala;
    const larguraFaixa = ESTADO.larguraImplemento * pxPorMetro;

    if (!ESTADO.ultimoPonto) {
        ESTADO.ultimoPonto = {
            x: ESTADO.flechaX,
            y: ESTADO.flechaY,
            rumo: ESTADO.rumo
        };
        return;
    }

    const dx = ESTADO.flechaX - ESTADO.ultimoPonto.x;
    const dy = ESTADO.flechaY - ESTADO.ultimoPonto.y;
    const distPx = Math.sqrt(dx * dx + dy * dy);
    const distMetros = distPx / pxPorMetro;

    ESTADO.distanciaPercorrida += distMetros;
    ESTADO.areaTotal = (ESTADO.distanciaPercorrida * ESTADO.larguraImplemento) / 10000;

    const angulo = Math.atan2(dx, dy);

    ctx.save();
    ctx.translate(canvas.width / 2 + ESTADO.ultimoPonto.x, canvas.height / 2 + ESTADO.ultimoPonto.y);
    ctx.rotate(angulo);
    ctx.fillStyle = 'rgba(22, 163, 74, 0.45)';
    ctx.fillRect(-larguraFaixa / 2, -distPx / 2, larguraFaixa, distPx);
    ctx.restore();

    ESTADO.ultimoPonto = {
        x: ESTADO.flechaX,
        y: ESTADO.flechaY,
        rumo: ESTADO.rumo
    };
}

function alternarPintura() {
    ESTADO.pintando = !ESTADO.pintando;
    const btn = document.getElementById('btnPintar');

    if (ESTADO.pintando) {
        btn.classList.add('pintando');
        btn.innerHTML = '⏹';
        ESTADO.ultimoPonto = {
            x: ESTADO.flechaX,
            y: ESTADO.flechaY,
            rumo: ESTADO.rumo
        };
    } else {
        btn.classList.remove('pintando');
        btn.innerHTML = '🖌️';
        ESTADO.ultimoPonto = null;
    }
}

function criarPontoA() {
    ESTADO.pontoA = { lat: ESTADO.lat, lon: ESTADO.lon };
    ESTADO.pontoB = null;
    ESTADO.distanciaDesdeA = 0;
    ESTADO.distanciaPercorrida = 0;
    ESTADO.areaTotal = 0;
    ESTADO.ultimoPonto = null;

    // Origem da flecha no ponto A
    ESTADO.latOrigem = ESTADO.lat;
    ESTADO.lonOrigem = ESTADO.lon;
    ESTADO.flechaX = 0;
    ESTADO.flechaY = 0;
    trator.style.left = '50%';
    trator.style.top = '50%';

    btnB.disabled = true;
    avisoDistancia.style.display = 'block';
    avisoDistancia.textContent = '📍 Anda 5 metros para liberar o Ponto B';

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    removerTodasLinhasParalelas();
    atualizarTela();
}

function criarPontoB() {
    if (!ESTADO.pontoA) {
        alert('⚠️ Crie o PONTO A primeiro!');
        return;
    }
    if (ESTADO.distanciaDesdeA < 5) {
        alert('⚠️ Precisa percorrer pelo menos 5 metros desde o Ponto A!');
        return;
    }

    ESTADO.pontoB = { lat: ESTADO.lat, lon: ESTADO.lon };
    avisoDistancia.style.display = 'none';

    desenharLinhasParalelas();

    alert('✅ Linha AB criada! Linhas paralelas: ' + ESTADO.larguraImplemento + 'm de espaçamento');
    atualizarTela();
}

// ========== BOTÃO 2D/3D — FUNDO CONTINUA PARADO ==========
function alternarModoVisual() {
    ESTADO.modoVisual = ESTADO.modoVisual === '2d' ? '3d' : '2d';

    mapa.classList.remove('mapa-grade-2d', 'mapa-grade-3d');
    mapa.classList.add('mapa-grade-' + ESTADO.modoVisual);

    document.getElementById('btnModoVisual').classList.toggle('ativo');

    console.log('Modo visual:', ESTADO.modoVisual);
}

function paralelas() {
    if (!ESTADO.pontoA || !ESTADO.pontoB) {
        alert('⚠️ Crie a Linha Guia AB primeiro!');
        return;
    }
    desenharLinhasParalelas();
    alert('〰️ Linhas paralelas atualizadas — ' + ESTADO.larguraImplemento + 'm');
}

function zoomIn() {
    ESTADO.escala *= 1.25;
    atualizarPosicaoFlecha();
    desenharLinhasParalelas();
}

function zoomOut() {
    ESTADO.escala /= 1.25;
    atualizarPosicaoFlecha();
    desenharLinhasParalelas();
}

function abrirConfig() {
    document.getElementById('modalConfig').style.display = 'flex';
    document.getElementById('inpLargura').value = ESTADO.larguraImplemento;
    document.getElementById('inpTalhao').value = ESTADO.nomeTalhao;
    document.getElementById('inpCorrecao').value = ESTADO.modoCorrecao;
    document.getElementById('inpMaxDesvio').value = ESTADO.maxDesvioBarra;
}

function fecharConfig() {
    document.getElementById('modalConfig').style.display = 'none';
}

function salvarConfig() {
    ESTADO.larguraImplemento = parseFloat(document.getElementById('inpLargura').value);
    ESTADO.nomeTalhao = document.getElementById('inpTalhao').value;
    ESTADO.modoCorrecao = document.getElementById('inpCorrecao').value;
    ESTADO.maxDesvioBarra = parseFloat(document.getElementById('inpMaxDesvio').value);

    localStorage.setItem('portalSatConfig', JSON.stringify({
        larguraImplemento: ESTADO.larguraImplemento,
        nomeTalhao: ESTADO.nomeTalhao,
        modoCorrecao: ESTADO.modoCorrecao,
        maxDesvioBarra: ESTADO.maxDesvioBarra
    }));

    fecharConfig();
    atualizarTela();
}

function salvarTalhao() {
    if (!ESTADO.pontoA) {
        alert('⚠️ Crie pelo menos o Ponto A primeiro!');
        return;
    }
    localStorage.setItem('talhao_' + ESTADO.nomeTalhao, JSON.stringify({
        pontoA: ESTADO.pontoA,
        pontoB: ESTADO.pontoB,
        largura: ESTADO.larguraImplemento,
        area: ESTADO.areaTotal,
        distancia: ESTADO.distanciaPercorrida
    }));
    alert('✅ Talhão "' + ESTADO.nomeTalhao + '" SALVO!');
}

function carregarTalhao() {
    const nome = prompt('Digite o nome do talhão:');
    if (!nome) return;

    const dados = localStorage.getItem('talhao_' + nome);
    if (dados) {
        const t = JSON.parse(dados);
        ESTADO.pontoA = t.pontoA;
        ESTADO.pontoB = t.pontoB;
        ESTADO.larguraImplemento = t.largura;
        ESTADO.areaTotal = t.area || 0;
        ESTADO.distanciaPercorrida = t.distancia || 0;
        ESTADO.nomeTalhao = nome;

        if (ESTADO.pontoA) {
            ESTADO.latOrigem = ESTADO.pontoA.lat;
            ESTADO.lonOrigem = ESTADO.pontoA.lon;
            ESTADO.lat = ESTADO.pontoA.lat;
            ESTADO.lon = ESTADO.pontoA.lon;
            ESTADO.flechaX = 0;
            ESTADO.flechaY = 0;
            trator.style.left = '50%';
            trator.style.top = '50%';
        }

        if (ESTADO.pontoA && ESTADO.pontoB) {
            desenharLinhasParalelas();
        }

        atualizarTela();
        alert('✅ Talhão "' + nome + '" CARREGADO!');
    } else {
        alert('❌ Talhão não encontrado!');
    }
}

function limparTudo() {
    if (!confirm('🗑️ Limpar tudo? Pontos, cobertura e linhas serão apagados!')) return;
    ESTADO.pontoA = null;
    ESTADO.pontoB = null;
    ESTADO.areaTotal = 0;
    ESTADO.distanciaPercorrida = 0;
    ESTADO.distanciaDesdeA = 0;
    ESTADO.ultimoPonto = null;
    ESTADO.pintando = false;

    ESTADO.latOrigem = null;
    ESTADO.lonOrigem = null;
    ESTADO.flechaX = 0;
    ESTADO.flechaY = 0;
    trator.style.left = '50%';
    trator.style.top = '50%';

    btnB.disabled = true;
    avisoDistancia.style.display = 'none';

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    removerTodasLinhasParalelas();

    document.getElementById('btnPintar').classList.remove('pintando');
    document.getElementById('btnPintar').innerHTML = '🖌️';

    atualizarTela();
}

window.onload = () => {
    const cfgSalva = localStorage.getItem('portalSatConfig');
    if (cfgSalva) {
        const cfg = JSON.parse(cfgSalva);
        Object.assign(ESTADO, cfg);
    }

    ajustarCanvas();
    atualizarTela();
    iniciarGPS();
};
</script>
