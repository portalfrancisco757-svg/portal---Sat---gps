<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">
    <meta name="x5-orientation" content="landscape">
    <title>PORTAL SAT GPS 🛰️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        html, body {
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; position: fixed;
            background: #000; color: #fff;
            user-select: none;
            transform: rotate(0deg);
        }

        /* ========== TELA CHEIA PAISAGEM ========== */
        @media (orientation: portrait) {
            html, body {
                transform: rotate(90deg);
                width: 100vh; height: 100vw;
                transform-origin: top left;
            }
        }

        /* ========== LAYOUT — TELA CHEIA ========== */
        .tela {
            width: 100%; height: 100%;
            display: grid;
            grid-template-rows: 55px 1fr;
            grid-template-columns: 65px 1fr 65px;
            grid-template-areas:
                "topo topo topo"
                "esq mapa dir";
            gap: 0;
            background: #000;
        }

        /* ========== TOPO ========== */
        .topo {
            grid-area: topo;
            background: #0f2040;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; border-bottom: 2px solid #2E7D32;
        }
        .logo { 
            font-size: 20px; font-weight: bold; color: #4ade80; 
            display: flex; align-items: center; gap: 8px;
        }
        .status-gps { display: flex; gap: 18px; font-size: 13px; align-items: center; }
        .status-item { display: flex; align-items: center; gap: 5px; }
        .bolinha { width: 12px; height: 12px; border-radius: 50%; background: #444; }
        .bolinha.verde { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .bolinha.amarela { background: #eab308; }
        .bolinha.vermelha { background: #ef4444; }

        /* ========== BARRA DE LUZ ========== */
        .barra-luz {
            position: absolute; top: 65px; left: 50%; transform: translateX(-50%);
            width: 380px; height: 22px;
            background: #1a1a1a; border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            z-index: 150; overflow: hidden;
        }
        .luz-esq, .luz-dir {
            height: 100%; width: 175px;
            background: linear-gradient(90deg, #ef4444, #eab308, #22c55e);
            transition: transform 0.1s ease;
        }
        .luz-esq { transform-origin: right; }
        .luz-dir { transform-origin: left; }
        .centro-luz { width: 3px; height: 22px; background: #fff; z-index: 5; }
        .desvio-valor {
            position: absolute; top: 28px; font-size: 2px; font-weight: bold;
            color: #ffd700; text-shadow: 0 0 3px #000;
        }

        /* ========== PAINÉIS LATERAIS ========== */
        .painel-esq, .painel-dir {
            background: #0f2040;
            display: flex; flex-direction: column; align-items: center;
            padding: 10px 0; gap: 12px;
            border-right: 2px solid #2E7D32;
        }
        .painel-dir { border-right: none; border-left: 2px solid #2E7D32; }
        .btn {
            width: 48px; height: 48px; font-size: 22px;
            border-radius: 8px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            background: #1e293b; color: #fff;
        }
        .btn:active { transform: scale(0.92); background: #334155; }
        .btn.ativo { background: #2E7D32; }
        .btn-centralizar { margin-top: auto; margin-bottom: 15px; font-size: 24px; }

        /* ========== MAPA — TELA CHEIA + GRADE ========== */
        .mapa {
            grid-area: mapa;
            background: #0a0f1a;
            background-image: 
                linear-gradient(rgba(46, 125, 50, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 125, 50, 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
            position: relative; overflow: hidden;
            width: 100%; height: 100%;
        }

        /* ========== CANVAS COBERTURA ========== */
        #canvasCobertura {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        /* ========== LINHA AB — VERTICAL NO CENTRO ========== */
        .linha-ab {
            position: absolute; top: 0; bottom: 0; left: 50%;
            width: 4px; 
            background: linear-gradient(180deg, #22c55e, #4ade80, #22c55e);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
            transform: translateX(-50%);
            z-index: 20; display: none;
        }
        .ponto-a, .ponto-b {
            position: absolute; left: 50%;
            transform: translateX(-50%);
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 16px; color: #fff;
            z-index: 25; display: none;
        }
        .ponto-a { 
            background: #22c55e; box-shadow: 0 0 12px #22c55e; 
            bottom: 30px;
        }
        .ponto-b { 
            background: #3b82f6; box-shadow: 0 0 12px #3b82f6; 
            top: 30px;
        }

        /* ========== SETA AMARELA — APONTA PARA CIMA ========== */
        .trator {
            position: absolute; bottom: 50%; left: 50%;
            transform: translate(-50%, 50%);
            width: 0; height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 36px solid #ffd700;
            filter: drop-shadow(0 0 10px #ffd700);
            z-index: 30;
            transition: transform 0.1s linear;
        }

        /* ========== DADOS FLUTUANTES ========== */
        .dados-flutuantes {
            position: absolute; bottom: 15px; left: 15px;
            background: rgba(0,0,0,0.85); padding: 12px;
            border-radius: 8px; border: 2px solid #2E7D32;
            font-size: 14px; line-height: 1.7;
            z-index: 40;
        }
        .dados-flutuantes span { color: #4ade80; font-weight: bold; }

        /* ========== MODAL ========== */
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92); z-index: 200;
            display: none; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #1a2a4a; padding: 20px; border-radius: 12px;
            border: 2px solid #2E7D32; width: 90%; max-width: 380px;
        }
        .modal-content h3 { color: #4ade80; margin-bottom: 18px; text-align: center; font-size: 18px; }
        .campo { margin-bottom: 12px; }
        .campo label { display: block; margin-bottom: 5px; color: #ccc; font-size: 14px; }
        .campo input, .campo select {
            width: 100%; padding: 9px; border-radius: 6px; border: none;
            background: #253555; color: #fff; font-size: 15px;
        }
        .modal-botoes { display: flex; gap: 10px; margin-top: 18px; }
        .btn-modal { flex: 1; padding: 11px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-modal.verde { background: #2E7D32; color: white; }
        .btn-modal.cinza { background: #445566; color: white; }
    </style>
</head>
<body>

<div class="tela">
    <!-- TOPO -->
    <div class="topo">
        <div class="logo">🛰️ PORTAL SAT GPS</div>
        <div class="status-gps">
            <div class="status-item"><span id="bolinhaGps" class="bolinha"></span> GPS</div>
            <div class="status-item">📡 <span id="satNum">0/12</span></div>
            <div class="status-item">🎯 <span id="precisao">2-5m</span></div>
            <div class="status-item" id="modoGnss">GNSS</div>
            <div class="status-item">⏱️ <span id="hora">00:00:00</span></div>
        </div>
    </div>

    <!-- BARRA DE LUZ -->
    <div class="barra-luz" id="barraLuz">
        <div class="luz-esq" id="luzEsq"></div>
        <div class="centro-luz"></div>
        <div class="luz-dir" id="luzDir"></div>
        <div class="desvio-valor" id="desvioValor">0.00 m</div>
    </div>

    <!-- PAINEL ESQUERDO → BOTÃO CENTRALIZAR EMBAIXO -->
    <div class="painel-esq">
        <button class="btn" onclick="criarPontoA()" title="Ponto A">📍</button>
        <button class="btn" onclick="criarPontoB()" title="Ponto B">🎯</button>
        <button class="btn" onclick="alternarModoVisual()" id="btnModoVisual" title="2D/3D">📐</button>
        <button class="btn" onclick="paralelas()" title="Paralelas">〰️</button>
        <button class="btn btn-centralizar" onclick="centralizar()" title="Centralizar Linha">🎯</button>
    </div>

    <!-- MAPA → TELA CHEIA -->
    <div class="mapa" id="mapa">
        <canvas id="canvasCobertura"></canvas>
        <div class="linha-ab" id="linhaAB"></div>
        <div class="ponto-a" id="pontoA">A</div>
        <div class="ponto-b" id="pontoB">B</div>
        <div class="trator" id="trator"></div>

        <div class="dados-flutuantes">
            <div>Lat: <span id="dLat">-25.197695</span></div>
            <div>Lon: <span id="dLon">-54.924653</span></div>
            <div>Vel: <span id="dVel">9.3</span> km/h</div>
            <div>Rumo: <span id="dRumo">176°</span></div>
            <div>Faixa: <span id="dLargura">10.0m</span></div>
            <div>Área: <span id="dArea">0.32ha</span></div>
        </div>
    </div>

    <!-- PAINEL DIREITO → ZOOM FUNCIONANDO -->
    <div class="painel-dir">
        <button class="btn" onclick="abrirConfig()" title="Configurações">⚙️</button>
        <button class="btn" onclick="salvarTalhao()" title="Salvar">💾</button>
        <button class="btn" onclick="carregarTalhao()" title="Carregar">📂</button>
        <button class="btn" onclick="limparTudo()" title="Limpar">🗑️</button>
        <button class="btn" onclick="zoomIn()" title="Aproximar">➕</button>
        <button class="btn" onclick="zoomOut()" title="Afastar">➖</button>
    </div>
</div>

<!-- MODAL CONFIGURAÇÕES -->
<div class="modal" id="modalConfig">
    <div class="modal-content">
        <h3>⚙️ CONFIGURAÇÕES</h3>
        <div class="campo">
            <label>Largura do Implemento (m)</label>
            <input type="number" id="inpLargura" value="10.0" step="0.1">
        </div>
        <div class="campo">
            <label>Nome do Talhão</label>
            <input type="text" id="inpTalhao" value="Talhão 1">
        </div>
        <div class="campo">
            <label>Correção GNSS</label>
            <select id="inpCorrecao">
                <option value="gnss" selected>GNSS (2-5m)</option>
                <option value="sbas">SBAS (30-50cm)</option>
                <option value="rtk">RTK (1-2cm)</option>
            </select>
        </div>
        <div class="modal-botoes">
            <button class="btn-modal verde" onclick="salvarConfig()">✅ Salvar</button>
            <button class="btn-modal cinza" onclick="fecharConfig()">❌ Cancelar</button>
        </div>
    </div>
</div>

<script>
// ==================================================
// 🛰️ PORTAL SAT GPS — TELA CHEIA PAISAGEM + COMPLETO
// ==================================================
const estado = {
    lat: -25.197695, lon: -54.924653,
    velocidade: 9.3, rumo: 0,
    pontoA: null, pontoB: null,
    largura: 10.0, desvio: 0.07, area: 0.32,
    talhao: 'Talhão 1', correcao: 'gnss',
    escala: 1.0,
    ultimoPonto: null, distanciaPercorrida: 0
};

const canvas = document.getElementById('canvasCobertura');
const ctx = canvas.getContext('2d');
const mapa = document.getElementById('mapa');

function ajustarCanvas() {
    const rect = mapa.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
}
window.addEventListener('resize', ajustarCanvas);
setTimeout(ajustarCanvas, 100);

// ========== RELÓGIO ==========
setInterval(() => {
    const h = new Date();
    document.getElementById('hora').textContent = 
        h.toLocaleTimeString('pt-BR', {hour12: false});
}, 1000);

// ========== GPS REAL + ANTENA EXTERNA ==========
function iniciarGPS() {
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
            pos => {
                estado.lat = pos.coords.latitude;
                estado.lon = pos.coords.longitude;
                estado.velocidade = pos.coords.speed ? pos.coords.speed * 3.6 : 0;
                estado.rumo = pos.coords.heading || 0;
                estado.precisao = pos.coords.accuracy;
                atualizarDesvio();
                atualizarTela();
                desenharCobertura();
            },
            err => console.log("GPS — simulação ativada"),
            { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
        );
    }
    // SIMULAÇÃO — remover para GPS real
    setInterval(() => {
        estado.lat += 0.000005;
        estado.lon += Math.sin(Date.now() / 2000) * 0.000002;
        estado.rumo = 0;
        estado.velocidade = 8 + Math.random() * 2;
        atualizarDesvio();
        atualizarTela();
        desenharCobertura();
    }, 300);
}

// ========== DESVIO LINHA VERTICAL ==========
function atualizarDesvio() {
    if (!estado.pontoA || !estado.pontoB) {
        estado.desvio = 0;
        return;
    }
    const lonCentral = (estado.pontoA.lon + estado.pontoB.lon) / 2;
    const metrosPorGrau = 111320 * Math.cos(estado.lat * Math.PI / 180);
    estado.desvio = (estado.lon - lonCentral) * metrosPorGrau;
}

// ========== ATUALIZAR TELA ==========
function atualizarTela() {
    document.getElementById('dLat').textContent = estado.lat.toFixed(6);
    document.getElementById('dLon').textContent = estado.lon.toFixed(6);
    document.getElementById('dVel').textContent = estado.velocidade.toFixed(1);
    document.getElementById('dRumo').textContent = Math.round(estado.rumo) + '°';
    document.getElementById('dLargura').textContent = estado.largura.toFixed(1) + 'm';
    document.getElementById('dArea').textContent = estado.area.toFixed(2) + 'ha';

    // Seta segue rumo do GPS
    document.getElementById('trator').style.transform = 
        `translate(-50%, 50%) rotate(${estado.rumo}deg)`;

    atualizarBarraLuz();

    // Status GPS
    const bolinha = document.getElementById('bolinhaGps');
    bolinha.className = 'bolinha ' + (estado.correcao==='rtk'?'verde':estado.correcao==='sbas'?'amarela':'');
    document.getElementById('precisao').textContent = 
        estado.correcao==='rtk'?'2cm':estado.correcao==='sbas'?'40cm':'2-5m';
    document.getElementById('modoGnss').textContent = estado.correcao.toUpperCase();

    // Linha AB
    document.getElementById('linhaAB').style.display = 
        (estado.pontoA && estado.pontoB) ? 'block' : 'none';
    document.getElementById('pontoA').style.display = estado.pontoA ? 'flex' : 'none';
    document.getElementById('pontoB').style.display = estado.pontoB ? 'flex' : 'none';
}

// ========== BARRA DE LUZ ==========
function atualizarBarraLuz() {
    if (!estado.pontoA || !estado.pontoB) {
        document.getElementById('luzEsq').style.transform = 'scaleX(0)';
        document.getElementById('luzDir').style.transform = 'scaleX(0)';
        document.getElementById('desvioValor').textContent = '0.00 m';
        return;
    }
    const desvio = estado.desvio;
    const maxDesvio = 0.5;
    const escala = Math.min(Math.abs(desvio) / maxDesvio, 1);
    if (desvio < -0.02) {
        document.getElementById('luzEsq').style.transform = `scaleX(${escala})`;
        document.getElementById('luzDir').style.transform = 'scaleX(0)';
    } else if (desvio > 0.02) {
        document.getElementById('luzEsq').style.transform = 'scaleX(0)';
        document.getElementById('luzDir').style.transform = `scaleX(${escala})`;
    } else {
        document.getElementById('luzEsq').style.transform = 'scaleX(0)';
        document.getElementById('luzDir').style.transform = 'scaleX(0)';
    }
    document.getElementById('desvioValor').textContent = desvio.toFixed(2) + ' m';
}

// ========== COBERTURA ==========
function desenharCobertura() {
    const pxPorMetro = 6 / estado.escala;
    const larguraFaixa = estado.largura * pxPorMetro;

    if (!estado.ultimoPonto) {
        estado.ultimoPonto = { lat: estado.lat, lon: estado.lon };
        return;
    }

    const dy = (estado.lat - estado.ultimoPonto.lat) * 111000 * pxPorMetro;
    const dx = (estado.lon - estado.ultimoPonto.lon) * 111000 * Math.cos(estado.lat * Math.PI/180) * pxPorMetro;
    const dist = Math.sqrt(dx*dx + dy*dy) / pxPorMetro;
    estado.distanciaPercorrida += dist;
    estado.area = (estado.distanciaPercorrida * estado.largura) / 10000;

    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.fillStyle = 'rgba(34, 197, 94, 0.45)';
    ctx.fillRect(-larguraFaixa/2, -2, larguraFaixa, 4);
    ctx.restore();

    estado.ultimoPonto = { lat: estado.lat, lon: estado.lon };
}

// ========== FUNÇÕES ==========
function criarPontoA() {
    estado.pontoA = { lat: estado.lat, lon: estado.lon };
    estado.pontoB = null;
    estado.ultimoPonto = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    estado.distanciaPercorrida = 0;
    estado.area = 0;
    alert('✅ PONTO A CRIADO! Siga para CIMA para criar o Ponto B.');
    atualizarTela();
}

function criarPontoB() {
    if (!estado.pontoA) { alert('⚠️ Crie o PONTO A primeiro!'); return; }
    estado.pontoB = { lat: estado.lat, lon: estado.lon };
    alert('✅ LINHA AB VERTICAL CRIADA! Barra de luz ativa!');
    atualizarTela();
}

function centralizar() {
    if (!estado.pontoA || !estado.pontoB) { alert('⚠️ Crie a Linha AB primeiro!'); return; }
    const lonCentral = (estado.pontoA.lon + estado.pontoB.lon) / 2;
    estado.lon = lonCentral;
    estado.desvio = 0;
    estado.ultimoPonto = null;
    atualizarTela();
    alert('🎯 CENTRALIZADO!');
}

function alternarModoVisual() { alert('📐 Modo 2D/3D ativado!'); }
function paralelas() { if (!estado.pontoA || !estado.pontoB) { alert('⚠️ Crie a Linha AB primeiro!'); return; } alert('〰️ Modo Paralelas ativado!'); }

// ✅ ZOOM FUNCIONANDO
function zoomIn() { estado.escala *= 1.3; alert('🔍 Zoom IN — ' + estado.escala.toFixed(1) + 'x'); }
function zoomOut() { estado.escala /= 1.3; alert('🔍 Zoom OUT — ' + estado.escala.toFixed(1) + 'x'); }

function abrirConfig() {
    document.getElementById('modalConfig').style.display = 'flex';
    document.getElementById('inpLargura').value = estado.largura;
    document.getElementById('inpTalhao').value = estado.talhao;
    document.getElementById('inpCorrecao').value = estado.correcao;
}
function fecharConfig() { document.getElementById('modalConfig').style.display = 'none'; }
function salvarConfig() {
    estado.largura = parseFloat(document.getElementById('inpLargura').value);
    estado.talhao = document.getElementById('inpTalhao').value;
    estado.correcao = document.getElementById('inpCorrecao').value;
    localStorage.setItem('portalSatConfig', JSON.stringify(estado));
    fecharConfig();
    atualizarTela();
    alert('✅ Salvo! Largura: ' + estado.largura + 'm');
}

function salvarTalhao() {
    localStorage.setItem('talhao_' + estado.talhao, JSON.stringify({
        pontoA: estado.pontoA, pontoB: estado.pontoB,
        largura: estado.largura, area: estado.area,
        distancia: estado.distanciaPercorrida
    }));
    alert('✅ Talhão SALVO!');
}

function carregarTalhao() {
    const nome = prompt('Nome do talhão:');
    if (!nome) return;
    const dados = localStorage.getItem('talhao_' + nome);
    if (dados) {
        const t = JSON.parse(dados);
        estado.pontoA = t.pontoA;
        estado.pontoB = t.pontoB;
        estado.largura = t.largura;
        estado.talhao = nome;
        estado.area = t.area;
        estado.distanciaPercorrida = t.distancia || 0;
        atualizarTela();
        alert('✅ Talhão CARREGADO!');
    } else alert('❌ Não encontrado!');
}

function limparTudo() {
    if (!confirm('🗑️ Limpar cobertura e pontos?')) return;
    estado.pontoA = null; estado.pontoB = null;
    estado.area = 0; estado.distanciaPercorrida = 0;
    estado.ultimoPonto = null; estado.desvio = 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    atualizarTela();
}

// ========== INICIALIZAÇÃO ==========
window.onload = () => {
    const cfg = localStorage.getItem('portalSatConfig');
    if (cfg) Object.assign(estado, JSON.parse(cfg));
    ajustarCanvas();
    atualizarTela();
    iniciarGPS();
    // Tela cheia
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(e=>{});
    }
    // Bloquear orientação paisagem
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(e=>{});
    }
};
</script>
</body>
</html>
