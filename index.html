<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Sat GPS</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center}
#top{background:#367C2B;padding:14px;font-size:20px;font-weight:900;border-bottom:5px solid #FFDE00}
#light{height:28px;background:#000;display:flex;justify-content:center;gap:3px;padding:5px}
.led{width:12px;background:#333;border-radius:3px}
.led.on{background:#2ECC40;box-shadow:0 0 6px #0f0}
#map{height:52vh;background:#D8D2B8;position:relative;overflow:hidden;margin:6px;border-radius:10px;border:3px solid #367C2B}
#grid{position:absolute;inset:-50%;background-image:linear-gradient(#bbb 1px,transparent 1px),linear-gradient(90deg,#bbb 1px,transparent 1px);background-size:40px 40px}
#trator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:56px;z-index:5;transition:0.1s}
#info{background:#fff;color:#111;margin:6px;padding:10px;border-radius:10px;font-weight:900;display:flex;justify-content:space-around}
#info b{color:#367C2B}
button{padding:12px;margin:4px;border:none;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer}
button.g{background:#367C2B;color:#fff;width:46%}
button.y{background:#FFDE00;color:#111;width:46%}
input{width:90%;margin:8px}
</style>
</head>
<body>
<div id="top">PORTAL SAT GPS 🛰️</div>
<div id="light"></div>
<div id="map">
<div id="grid"></div>
<div id="trator">🚜</div>
</div>
<div id="info">
<div>LARGURA<br><b id="vL">20.0 m</b></div>
<div>DESVIO<br><b id="vD">0.00 m</b></div>
<div>ÁREA<br><b id="vA">0.00 ha</b></div>
</div>
<div style="padding:8px">
<input type="range" id="rg" min="0.5" max="100" step="0.1" value="20" oninput="setL(this.value)">
<div>Largura: <b id="rgV">20.0 m</b> (0.5 até 100m)</div>
<button class="g" onclick="go()" id="bGo">▶ SIMULAR - CLICA AQUI</button>
<button class="y" onclick="limpar()">🗑️ LIMPAR</button>
<br>
<button class="g" onclick="salvar()" style="background:#1565C0;width:90%">💾 SALVAR TALHÃO</button>
<div id="lista" style="margin-top:10px;text-align:left;background:#222;padding:8px;border-radius:8px"></div>
</div>

<script>
let leds=[];for(let i=0;i<21;i++){let d=document.createElement('div');d.className='led';document.getElementById('light').appendChild(d);leds.push(d);}
let larg=20,area=0,desv=0,run=false,timer=null,talhoes=[];
try{talhoes=JSON.parse(localStorage.getItem('portal_sat_v3')||'[]');}catch(e){talhoes=[];}

function light(v){
leds.forEach(l=>l.className='led');
leds[10].classList.add('on');
let q=Math.round(Math.abs(v)/0.2);
for(let i=0;i<q&&i<10;i++){
if(v<0)leds[9-i].classList.add('on');
else leds[11+i].classList.add('on');
}
document.getElementById('vD').innerText=v.toFixed(2)+' m';
}
function setL(v){
larg=parseFloat(v);
document.getElementById('vL').innerText=larg.toFixed(1)+' m';
document.getElementById('rgV').innerText=larg.toFixed(1)+' m';
}
function go(){
run=!run;
document.getElementById('bGo').innerText=run?'⏸ PAUSAR':'▶ SIMULAR - CLICA AQUI';
if(run){
let t=0;
timer=setInterval(()=>{
t+=0.05;
desv=Math.sin(t)*1.2;
area+=0.002*larg/20;
document.getElementById('vA').innerText=area.toFixed(2)+' ha';
light(desv);
document.getElementById('trator').style.transform='translate(calc(-50% + '+(desv*25)+'px), -50%)';
},120);
}else{
clearInterval(timer);
timer=null;
}
}
function limpar(){area=0;document.getElementById('vA').innerText='0.00 ha';light(0);document.getElementById('trator').style.transform='translate(-50%,-50%)';}
function salvar(){
let nome=prompt('Nome do talhão:','Talhão '+(talhoes.length+1));
if(!nome)return;
talhoes.push({nome:nome,area:area.toFixed(2),data:new Date().toLocaleString()});
localStorage.setItem('portal_sat_v3',JSON.stringify(talhoes));
lista();
alert('Talhão '+nome+' salvo!');
}
function lista(){
let h='';talhoes.forEach((t,i)=>{h+=`<div style="border-bottom:1px solid #444;padding:6px;display:flex;justify-content:space-between"><span>📍 ${t.nome} - ${t.area} ha</span><span onclick="apagar(${i})" style="color:#f55;cursor:pointer">X</span></div>`;});
document.getElementById('lista').innerHTML=h||'Nenhum talhão salvo ainda - clique em SIMULAR e depois SALVAR';
}
function apagar(i){talhoes.splice(i,1);localStorage.setItem('portal_sat_v3',JSON.stringify(talhoes));lista();}
setL(20);light(0);lista();
</script>
</body>
</html>
