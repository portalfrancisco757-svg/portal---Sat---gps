<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#008800">
    <title>PORTAL SAT GPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
        }

        /* 🟩 TELA QUADRICULADA VERDE — TELA COMPLETA */
        .tela-navegacao {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #051005;
            overflow: hidden;
        }

        /* Grade verde tela cheia */
        .grade {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0,255,80,0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,80,0.12) 1px, transparent 1px);
            background-size: 35px 35px;
        }

        /* ✨ BARRA DE LUZ — LINHA GUIADA ENTRE A E B */
        .barra-luz-linha {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00ff00, #88ff00, #00ff00, transparent);
            box-shadow: 
                0 0 15px #00ff00,
                0 0 30px rgba(0,255,0,0.5),
                inset 0 0 8px #fff;
            transform-origin: left center;
            z-index: 8;
            transition: all 0.3s ease;
            opacity: 0;
        }
        .barra-luz-linha.ativa { opacity: 1; }

        /* Triângulo amarelo — veículo */
        .triangulo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-left: 28px solid transparent;
            border-right: 28px solid transparent;
            border-bottom: 45px solid #ffcc00;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 15px #ffcc00);
            z-index: 15;
            transition: transform 0.1s linear;
        }

        /* Distância canto superior direito */
        .distancia-display {
            position: absolute;
            top: 20px;
            right: 100px;
            font-size: 48px;
            font-weight: bold;
            color: #00ff00;
            font-family: monospace;
            text-shadow: 0 0 15px rgba(0,255,0,0.6);
            z-index: 25;
        }

        /* 📍 ÁREA BOTÕES + DADOS — DADOS AO LADO, NÃO ATRÁS */
        .bloco-esquerdo {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: flex-start;
            gap: 15px;
            z-index: 30;
        }

        /* 📊 ÍCONES ACIMA DO BOTÃO A */
        .icones-superiores {
            position: absolute;
            left: 20px;
            top: calc(50% - 140px);
            transform: translateY(-50%);
            display: flex;
            gap: 12px;
            z-index: 35;
        }
        .btn-icone {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            border: none;
            background: #222;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-icone:hover { background: #333; }
        .btn-icone.dados-btn { background: #005500; border: 2px solid #00ff00; }
        .btn-icone.config-btn { background: #333; border: 2px solid #666; }

        /* Botões Ponto A e B */
        .bloco-pontos {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn-ponto {
            width: 140px;
            height: 120px;
            border-radius: 12px;
            border: 4px solid #fff;
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.25s;
        }
        .btn-a {
            background: linear-gradient(180deg, #00c800, #007000);
            border-color: #00ff00;
        }
        .btn-a.ativo {
            box-shadow: 0 0 20px #00ff00, inset 0 0 15px rgba(255,255,255,0.3);
        }
        .btn-b {
            background: #1a1a1a;
            border-color: #444;
            color: #666;
        }
        .btn-b:disabled {
            background: #111;
            border-color: #333;
            color: #444;
        }
        .btn-b.ativo {
            background: linear-gradient(180deg, #0066ff, #0044cc);
            border-color: #00aaff;
            color: #fff;
            box-shadow: 0 0 20px #0088ff, inset 0 0 15px rgba(255,255,255,0.3);
        }

        /* 📋 PAINEL DE DADOS — AO LADO DOS BOTÕES, NÃO ATRÁS */
        .painel-dados {
            background: rgba(0,0,0,0.85);
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .painel-dados.escondido { opacity: 0; visibility: hidden; transform: translateX(-10px); }
        .linha-dado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        .dado-label { color: #888; }
        .dado-valor { 
            color: #00ff00; 
            font-family: monospace; 
            font-size: 16px;
            text-align: right;
        }
        .dado-valor.azul { color: #00aaff; }
        .dado-valor.amarelo { color: #ffcc00; }

        /* Controles lado direito */
        .bloco-controles {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 30;
        }
        .btn-controle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #555;
            font-size: 24px;
            cursor: pointer;
            background: #222;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-controle:hover { background: #333; }
        .btn-cobertura {
            background: #005500;
            border-color: #00ff00;
            box-shadow: 0 0 15px rgba(0,255,0,0.3);
        }
        .btn-2d {
            background: #0055aa;
            border-color: #00aaff;
            font-size: 18px;
            font-weight: bold;
        }
        .btn-2d.ativo {
            box-shadow: 0 0 20px rgba(0,100,255,0.5);
        }

        /* Barra superior verde */
        .barra-superior {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: linear-gradient(90deg, #006600, #008800, #006600);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 50;
            border-bottom: 2px solid #00ff00;
        }
        .barra-esq {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        .barra-titulo { color: #fff; }
        .barra-centro {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .barra-gps {
            background: #ffaa00;
            color: #000;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .barra-gps.ativo { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .barra-hora {
            color: #fff;
            font-family: monospace;
            font-size: 18px;
        }
    </style>
</head>
<body>

<!-- 🟩 BARRA SUPERIOR VERDE -->
<div class="barra-superior">
    <div class="barra-esq">
        <span>📡</span>
        <span class="barra-titulo">PORTAL SAT GPS</span>
    </div>
    <div class="barra-centro">
        <div class="barra-gps" id="barraGPS">GPS</div>
        <div class="barra-hora" id="barraHora">16:15</div>
    </div>
    <div style="color:#fff; font-size:14px;">Antena Externa ✓</div>
</div>

<!-- 📊 ÍCONES ACIMA DO BOTÃO A -->
<div class="icones-superiores">
    <button class="btn-icone dados-btn" id="btnDados" title="Dados">📊</button>
    <button class="btn-icone config-btn" id="btnConfig" title="Configurações">⚙️</button>
</div>

<!-- TELA PRINCIPAL — TELA CHEIA -->
<div class="tela-navegacao" id="telaNavegacao">
    <div class="grade"></div>

    <!-- ✨ BARRA DE LUZ — LINHA GUIADA ENTRE A E B -->
    <div class="barra-luz-linha" id="barraLuzLinha"></div>

    <!-- Distância -->
    <div class="distancia-display" id="distanciaDisplay">+0.00 m</div>

    <!-- 📍 BOTÕES + DADOS AO LADO -->
    <div class="bloco-esquerdo">
        <div class="bloco-pontos">
            <button class="btn-ponto btn-a" id="btnPontoA">PONTO A</button>
            <button class="btn-ponto btn-b" id="btnPontoB" disabled>PONTO B</button>
        </div>

        <!-- 📋 PAINEL DE DADOS — AO LADO, NÃO ATRÁS -->
        <div class="painel-dados escondido" id="painelDados">
            <div class="linha-dado">
                <span class="dado-label">Distância A:</span>
                <span class="dado-valor azul" id="dadoDistA">--- m</span>
            </div>
            <div class="linha-dado">
                <span class="dado-label">Latitude:</span>
                <span class="dado-valor" id="dadoLat">---</span>
            </div>
            <div class="linha-dado">
                <span class="dado-label">Longitude:</span>
                <span class="dado-valor" id="dadoLon">---</span>
            </div>
            <div class="linha-dado">
                <span class="dado-label">Rumo:</span>
                <span class="dado-valor amarelo" id="dadoRumo">--- °</span>
            </div>
            <div class="linha-dado">
                <span class="dado-label">Velocidade:</span>
                <span class="dado-valor azul" id="dadoVel">--- km/h</span>
            </div>
            <div class="linha-dado">
                <span class="dado-label">Distância B:</span>
                <span class="dado-valor" id="dadoDistB">+0.00 m</span>
            </div>
            <div class="linha-dado">
                <span class="dado-label">Precisão:</span>
                <span class="dado-valor" id="dadoPrec">--- m</span>
            </div>
        </div>
    </div>

    <!-- Triângulo Veículo -->
    <div class="triangulo" id="triangulo"></div>

    <!-- Controles Direitos -->
    <div class="bloco-controles">
        <button class="btn-controle btn-cobertura" title="Cobertura">🟩</button>
        <button class="btn-controle" id="btnZoomMais" title="+">+</button>
        <button class="btn-controle" id="btnZoomMenos" title="−">−</button>
        <button class="btn-controle btn-2d ativo" id="btnModo" title="2D">2D</button>
    </div>
</div>

<script>
// ==================================================
// PORTAL SAT GPS — FINAL
// ✅ DADOS AO LADO DOS BOTÕES | ✅ ÍCONES ACIMA DE A
// ✅ TELA QUADRICULADA VERDE TELA CHEIA
// ✅ BARRA DE LUZ GUIADA ENTRE A E B
// ✅ GPS NATIVO + ANTENA EXTERNA | ✅ OFFLINE
// ==================================================

const ESTADO = {
    lat: null, lon: null, rumo: 0, velocidade: 0,
    pontoA: null, pontoB: null, distancia: 0,
    precisao: null, ativo: false,
    dadosVisiveis: false, zoom: 1
};

// 🕐 RELÓGIO
function atualizarHora() {
    const agora = new Date();
    document.getElementById('barraHora').textContent = 
        agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', hour12:false});
}
setInterval(atualizarHora, 1000); atualizarHora();

// 📊 MOSTRAR/ESCONDER DADOS — AO LADO, NÃO ATRÁS
const btnDados = document.getElementById('btnDados');
const painelDados = document.getElementById('painelDados');
btnDados.addEventListener('click', () => {
    ESTADO.dadosVisiveis = !ESTADO.dadosVisiveis;
    painelDados.classList.toggle('escondido', !ESTADO.dadosVisiveis);
    btnDados.style.boxShadow = ESTADO.dadosVisiveis ? '0 0 15px #00ff00' : 'none';
});

// ⚙️ CONFIGURAÇÕES (placeholder)
document.getElementById('btnConfig').addEventListener('click', () => {
    alert('⚙️ Configurações — Antena Externa, Unidades, Precisão GPS');
});

// 📡 GPS — ANTENA EXTERNA COMPATÍVEL, FUNCIONA OFFLINE
function iniciarGPS() {
    if (!navigator.geolocation) {
        alert('❌ GPS não disponível — verifique antena externa');
        return;
    }

    const barraGPS = document.getElementById('barraGPS');
    barraGPS.textContent = 'BUSCANDO...';

    const opcoes = {
        enableHighAccuracy: true,      // ✅ Força máxima precisão (antena externa)
        maximumAge: 0,                 // Sem cache — sempre atual
        timeout: 10000
    };

    navigator.geolocation.watchPosition(
        pos => {
            ESTADO.lat = pos.coords.latitude;
            ESTADO.lon = pos.coords.longitude;
            ESTADO.precisao = pos.coords.accuracy;
            
            if (pos.coords.heading !== null) ESTADO.rumo = Math.round(pos.coords.heading);
            if (pos.coords.speed !== null) ESTADO.velocidade = Math.round(pos.coords.speed * 3.6 * 10) / 10;

            // Status GPS
            barraGPS.textContent = ESTADO.precisao <= 3 ? 'RTK-FIX' : ESTADO.precisao <= 10 ? 'GPS-FIX' : 'GPS';
            barraGPS.classList.add('ativo');

            // Girar triângulo conforme rumo
            document.getElementById('triangulo').style.transform = 
                `translate(-50%, -50%) rotate(${ESTADO.rumo}deg)`;

            // Atualizar painel de dados
            atualizarPainelDados();

            // Atualizar barra de luz entre A e B se ambos marcados
            if (ESTADO.pontoA && ESTADO.pontoB) {
                atualizarBarraLuz();
            }
        },
        erro => {
            barraGPS.textContent = 'SEM SINAL';
            barraGPS.classList.remove('ativo');
            console.warn('GPS:', erro.message);
        },
        opcoes
    );
}

// 📋 ATUALIZAR DADOS NO PAINEL (AO LADO DOS BOTÕES)
function atualizarPainelDados() {
    if (!ESTADO.lat) return;
    
    document.getElementById('dadoLat').textContent = ESTADO.lat.toFixed(6);
    document.getElementById('dadoLon').textContent = ESTADO.lon.toFixed(6);
    document.getElementById('dadoRumo').textContent = ESTADO.rumo + ' °';
    document.getElementById('dadoVel').textContent = ESTADO.velocidade.toFixed(1) + ' km/h';
    document.getElementById('dadoPrec').textContent = ESTADO.precisao.toFixed(1) + ' m';

    if (ESTADO.pontoA) {
        const distA = calcularDistancia(
            ESTADO.pontoA.lat, ESTADO.pontoA.lon,
            ESTADO.lat, ESTADO.lon
        );
        document.getElementById('dadoDistA').textContent = distA.toFixed(2) + ' m';
    }
}

// 📍 PONTO A
document.getElementById('btnPontoA').addEventListener('click', () => {
    if (!ESTADO.lat) {
        alert('📡 Aguarde sinal GPS...');
        return;
    }
    ESTADO.pontoA = { lat: ESTADO.lat, lon: ESTADO.lon };
    ESTADO.pontoB = null;
    ESTADO.distancia = 0;
    document.getElementById('btnPontoA').classList.add('ativo');
    document.getElementById('btnPontoB').classList.remove('ativo');
    document.getElementById('btnPontoB').disabled = false;
    document.getElementById('distanciaDisplay').textContent = '+0.00 m';
    document.getElementById('dadoDistB').textContent = '+0.00 m';
    document.getElementById('barraLuzLinha').classList.remove('ativa');
    ESTADO.ativo = true;
});

// 📍 PONTO B — ATIVA BARRA DE LUZ
document.getElementById('btnPontoB').addEventListener('click', () => {
    if (!ESTADO.pontoA || !ESTADO.lat) return;
    ESTADO.pontoB = { lat: ESTADO.lat, lon: ESTADO.lon };
    document.getElementById('btnPontoB').classList.add('ativo');
    
    // Calcular distância total
    ESTADO.distancia = calcularDistancia(
        ESTADO.pontoA.lat, ESTADO.pontoA.lon,
        ESTADO.pontoB.lat, ESTADO.pontoB.lon
    );
    document.getElementById('distanciaDisplay').textContent = '+' + ESTADO.distancia.toFixed(2) + ' m';
    document.getElementById('dadoDistB').textContent = '+' + ESTADO.distancia.toFixed(2) + ' m';

    // ✨ Ativar barra de luz guiada
    atualizarBarraLuz();
    document.getElementById('barraLuzLinha').classList.add('ativa');
});

// ✨ ATUALIZAR BARRA DE LUZ — LINHA ENTRE A E B
function atualizarBarraLuz() {
    if (!ESTADO.pontoA || !ESTADO.pontoB) return;

    // Calcular distância e ângulo entre A e B
    const dist = ESTADO.distancia;
    const angulo = calcularAngulo(
        ESTADO.pontoA.lat, ESTADO.pontoA.lon,
        ESTADO.pontoB.lat, ESTADO.pontoB.lon
    );

    // Mapear distância para comprimento visual (máx 80% da tela)
    const comprimentoVisivel = Math.min((dist / 500) * 80, 80); // escala: 500m = 80%
    
    const barraLuz = document.getElementById('barraLuzLinha');
    barraLuz.style.width = comprimentoVisivel + '%';
    barraLuz.style.transform = `translateY(-50%) rotate(${angulo}deg)`;
}

// 📐 CÁLCULO DE DISTÂNCIA (Haversine)
function calcularDistancia(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + 
              Math.cos(lat1 * Math.PI / 180) * 
              Math.cos(lat2 * Math.PI / 180) * 
              Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// 📐 CÁLCULO DE ÂNGULO ENTRE DOIS PONTOS
function calcularAngulo(lat1, lon1, lat2, lon2) {
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const lat1Rad = lat1 * Math.PI / 180;
    const lat2Rad = lat2 * Math.PI / 180;
    const y = Math.sin(dLon) * Math.cos(lat2Rad);
    const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - 
              Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
    let ang = Math.atan2(y, x) * 180 / Math.PI;
    return (ang + 360) % 360;
}

// 🔍 ZOOM
document.getElementById('btnZoomMais').addEventListener('click', () => {
    ESTADO.zoom = Math.min(ESTADO.zoom * 1.15, 3);
    document.getElementById('telaNavegacao').style.transform = `scale(${ESTADO.zoom})`;
});
document.getElementById('btnZoomMenos').addEventListener('click', () => {
    ESTADO.zoom = Math.max(ESTADO.zoom / 1.15, 0.5);
    document.getElementById('telaNavegacao').style.transform = `scale(${ESTADO.zoom})`;
});

// ▶️ INICIAR GPS AO CARREGAR
window.addEventListener('load', iniciarGPS);

// SALVAR DADOS LOCALMENTE (OFFLINE)
window.addEventListener('beforeunload', () => {
    if (ESTADO.pontoA) {
        localStorage.setItem('ultimoPontoA', JSON.stringify(ESTADO.pontoA));
    }
});
</script>
</body>
</html>
