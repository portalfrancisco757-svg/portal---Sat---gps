<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor GPS Agrícola</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .gps-container {
            width: 700px;
            background-color: #262626;
            border: 4px solid #4CAF50;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .gps-header {
            background-color: #333333;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #444;
        }
        .status-badge {
            background-color: #4CAF50;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        .gps-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 20px;
            gap: 15px;
        }
        .card {
            background-color: #333333;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #4CAF50;
        }
        .card h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #b0b0b0;
        }
        .card .value {
            font-size: 22px;
            font-weight: bold;
        }
        .map-screen {
            grid-column: span 2;
            background-color: #122813;
            height: 150px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px dashed #4CAF50;
            position: relative;
        }
        .guidance-line {
            width: 2px;
            height: 100%;
            background-color: #ffeb3b;
            position: absolute;
        }
        .tractor-icon {
            font-size: 24px;
            position: absolute;
        }
    </style>
</head>
<body>

<div class="gps-container">
    <!-- Encabezado del monitor -->
    <div class="gps-header">
        <h2>GuíaSat Pro-X</h2>
        <span class="status-badge">RTK ACTIVO (Precisión 2cm)</span>
    </div>

    <!-- Pantalla de datos -->
    <div class="gps-body">
        <!-- Simulación de mapa de guiado -->
        <div class="map-screen">
            <div class="guidance-line"></div>
            <div class="tractor-icon">🚜</div>
            <span style="position: absolute; bottom: 10px; font-size: 12px; color: #8bc34a;">Línea A-B Fijada</span>
        </div>

        <!-- Datos en tiempo real -->
        <div class="card">
            <h3>Velocidad Actual</h3>
            <div class="value">8.5 km/h</div>
        </div>
        <div class="card">
            <h3>Área Trabajada</h3>
            <div class="value">42.8 Ha</div>
        </div>
        <div class="card">
            <h3>Cobertura / Solape</h3>
            <div class="value" style="color: #4CAF50;">0.0% (Sin solape)</div>
        </div>
        <div class="card">
            <h3>Satélites Conectados</h3>
            <div class="value">28 GNSS</div>
        </div>
    </div>
</div>

</body>
</html>
