<script>

/* =====================================================
   ESTADO DO SISTEMA
===================================================== */

const GPS = {

    lat:null,

    lon:null,

    altitude:null,

    accuracy:null,

    speed:0,

    heading:null,

    satellites:null,

    hdop:null,

    fix:"---",

    source:"Android",

    swath:24,

    overlap:0,

    offset:0,

    antennaHeight:0,

    tracking:false,

    points:[],

    coverage:[],

    marks:[],

    field:[],

    A:null,

    B:null,

    area:0,

    zoom:1,

    view3D:false

};



/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById(
    "mapCanvas"
);

const ctx =
canvas.getContext("2d");


function resizeCanvas(){

    const dpr =
    window.devicePixelRatio || 1;

    canvas.width =
    canvas.clientWidth*dpr;

    canvas.height =
    canvas.clientHeight*dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    draw();

}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();



/* =====================================================
   TOAST
===================================================== */

function toast(text){

    const element =
    document.getElementById(
        "toast"
    );

    element.textContent=text;

    element.style.display="block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
    setTimeout(
        ()=>{
            element.style.display="none";
        },
        2600
    );

}



/* =====================================================
   FORMATAR
===================================================== */

function formatNumber(value){

    if(
        value===null ||
        value===undefined ||
        Number.isNaN(value)
    ){

        return "--";

    }

    return Number(value)
    .toFixed(6);

}



/* =====================================================
   DISTÂNCIA
===================================================== */

function distance(a,b){

    const R=6371000;

    const p=Math.PI/180;

    const dLat =
    (b.lat-a.lat)*p;

    const dLon =
    (b.lon-a.lon)*p;

    const x =

    Math.sin(dLat/2)**2 +

    Math.cos(a.lat*p) *

    Math.cos(b.lat*p) *

    Math.sin(dLon/2)**2;

    return (

        2*R*

        Math.asin(
            Math.sqrt(x)
        )

    );

}



/* =====================================================
   RUMO
===================================================== */

function bearing(a,b){

    const p=Math.PI/180;

    const y =

    Math.sin(
        (b.lon-a.lon)*p
    )*

    Math.cos(
        b.lat*p
    );


    const x =

    Math.cos(
        a.lat*p
    )*

    Math.sin(
        b.lat*p
    )

    -

    Math.sin(
        a.lat*p
    )*

    Math.cos(
        b.lat*p
    )*

    Math.cos(
        (b.lon-a.lon)*p
    );


    return (

        Math.atan2(y,x)/p+
        360

    )%360;

}



/* =====================================================
   COORDENADAS LOCAIS
===================================================== */

function localXY(point,ref){

    const R=6378137;

    const p=Math.PI/180;

    return {

        x:

        (point.lon-ref.lon)*

        p*

        R*

        Math.cos(
            ref.lat*p
        ),

        y:

        (point.lat-ref.lat)*

        p*

        R

    };

}



/* =====================================================
   ÁREA EM HECTARES
===================================================== */

function calculateArea(points){

    if(points.length<3)
        return 0;

    const ref=points[0];

    let total=0;


    for(
        let i=1;
        i<points.length-1;
        i++
    ){

        const a=
        localXY(
            points[i],
            ref
        );

        const b=
        localXY(
            points[i+1],
            ref
        );


        total +=

        a.x*b.y -
        b.x*a.y;

    }


    return Math.abs(total/2)/10000;

}



/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById(
        "lat"
    ).textContent=
    formatNumber(GPS.lat);


    document.getElementById(
        "lon"
    ).textContent=
    formatNumber(GPS.lon);


    document.getElementById(
        "speed"
    ).textContent=

    (GPS.speed||0)
    .toFixed(1)
    +" km/h";


    document.getElementById(
        "heading"
    ).textContent=

    GPS.heading===null
    ?"---°"
    :
    GPS.heading.toFixed(0)+"°";


    document.getElementById(
        "swath"
    ).textContent=

    GPS.swath.toFixed(1)
    +" m";


    document.getElementById(
        "area"
    ).textContent=

    GPS.area.toFixed(2)
    +" ha";


    document.getElementById(
        "accuracy"
    ).textContent=

    GPS.accuracy===null
    ?"-- m"
    :
    GPS.accuracy.toFixed(2)+" m";


    document.getElementById(
        "satellites"
    ).textContent=

    GPS.satellites===null
    ?"--"
    :
    GPS.satellites;


    document.getElementById(
        "fixValue"
    ).textContent=
    GPS.fix;


    document.getElementById(
        "hdop"
    ).textContent=

    GPS.hdop===null
    ?"--"
    :
    GPS.hdop;

}



/* =====================================================
   POSIÇÃO ANDROID
===================================================== */

let watchID=null;


function receiveAndroidPosition(position){

    const c=
    position.coords;


    const previous =

    GPS.lat!==null
    ?
    {
        lat:GPS.lat,
        lon:GPS.lon
    }
    :
    null;


    GPS.lat=
    c.latitude;

    GPS.lon=
    c.longitude;

    GPS.accuracy=
    c.accuracy;

    GPS.altitude=
    c.altitude;


    if(
        c.speed!==null &&
        c.speed>=0
    ){

        GPS.speed=
        c.speed*3.6;

    }


    if(
        c.heading!==null &&
        c.heading>=0
    ){

        GPS.heading=
        c.heading;

    }


    if(
        previous &&
        (
            GPS.heading===null ||
            GPS.speed<0.2
        )
    ){

        const d=
        distance(
            previous,
            {
                lat:GPS.lat,
                lon:GPS.lon
            }
        );


        if(d>0.3){

            GPS.heading=
            bearing(
                previous,
                {
                    lat:GPS.lat,
                    lon:GPS.lon
                }
            );

        }

    }


    if(GPS.tracking){

        const point={

            lat:GPS.lat,

            lon:GPS.lon,

            time:
            new Date().toISOString(),

            speed:
            GPS.speed,

            heading:
            GPS.heading,

            accuracy:
            GPS.accuracy

        };


        if(

            GPS.points.length===0 ||

            distance(
                GPS.points[
                    GPS.points.length-1
                ],
                point
            )>=0.5

        ){

            GPS.points.push(point);

            GPS.coverage.push(point);

        }

    }


    updateGNSSStatus();

    updateHUD();

    draw();

}



/* =====================================================
   GPS ANDROID
===================================================== */

function startAndroidGPS(){

    if(
        !navigator.geolocation
    ){

        toast(
            "Geolocalização não disponível"
        );

        return;

    }


    if(watchID!==null){

        navigator.geolocation.clearWatch(
            watchID
        );

    }


    watchID=
    navigator.geolocation.watchPosition(

        receiveAndroidPosition,

        function(error){

            document.getElementById(
                "gnssStatus"
            ).textContent=
            "● SEM SINAL";

            toast(
                "GNSS Android: "+
                error.message
            );

        },

        {

            enableHighAccuracy:true,

            maximumAge:500,

            timeout:10000

        }

    );


    GPS.source=
    "Android GNSS";


    document.getElementById(
        "sourceStatus"
    ).textContent=
    "📱 GNSS Android";

}



/* =====================================================
   STATUS GNSS
===================================================== */

function updateGNSSStatus(){

    let status="GNSS";


    if(
        GPS.fix==="RTK FIX"
    ){

        status="RTK FIX";

    }
    else if(
        GPS.fix==="RTK FLOAT"
    ){

        status="RTK FLOAT";

    }
    else if(
        GPS.accuracy!==null &&
        GPS.accuracy<=0.05
    ){

        status="RTK FIX";

    }
    else if(
        GPS.accuracy!==null &&
        GPS.accuracy<=0.30
    ){

        status="RTK FLOAT";

    }
    else if(
        GPS.accuracy!==null &&
        GPS.accuracy<=3
    ){

        status="GNSS";

    }
    else{

        status="BAIXA";

    }


    document.getElementById(
        "gnssStatus"
    ).textContent=
    "● "+status;

}



/* =====================================================
   NMEA
===================================================== */

function nmeaCoordinate(
    value,
    hemisphere
){

    if(
        !value ||
        !hemisphere
    )
        return null;


    const n=
    parseFloat(value);


    if(Number.isNaN(n))
        return null;


    const degrees=
    Math.floor(n/100);


    const minutes=
    n-
    degrees*100;


    let result=
    degrees+
    minutes/60;


    if(
        hemisphere==="S" ||
        hemisphere==="W"
    ){

        result=-result;

    }


    return result;

}



/* =====================================================
   PROCESSAR NMEA
===================================================== */

function processNMEA(line){

    line=
    line.trim();


    if(!line)
        return;


    const p=
    line.split(",");


    if(!p[0])
        return;


    const type=
    p[0].slice(-3);


    /* ================= GGA ================= */

    if(
        type==="GGA" &&
        p.length>=10
    ){

        const lat=
        nmeaCoordinate(
            p[2],
            p[3]
        );


        const lon=
        nmeaCoordinate(
            p[4],
            p[5]
        );


        if(
            lat!==null &&
            lon!==null
        ){

            GPS.lat=lat;

            GPS.lon=lon;

        }


        const fixCode=
        parseInt(p[6]);


        const fixes={

            0:"NO FIX",

            1:"GPS",

            2:"DGPS",

            4:"RTK FIX",

            5:"RTK FLOAT",

            6:"ESTIMADO",

            7:"MANUAL",

            8:"SIMULAÇÃO"

        };


        GPS.fix=
        fixes[fixCode] ||
        String(fixCode);


        GPS.satellites=
        parseInt(p[7])||0;


        GPS.hdop=
        parseFloat(p[8]);


        GPS.altitude=
        parseFloat(p[9]);


        /*
          A precisão real do RTK deve ser
          obtida do receptor quando disponível.
        */

        if(
            GPS.accuracy===null &&
            GPS.hdop
        ){

            GPS.accuracy=
            GPS.hdop;

        }

    }


    /* ================= RMC ================= */

    if(
        type==="RMC" &&
        p.length>=9
    ){

        const knots=
        parseFloat(p[7]);


        if(
            !Number.isNaN(knots)
        ){

            GPS.speed=
            knots*1.852;

        }


        const heading=
        parseFloat(p[8]);


        if(
            !Number.isNaN(heading)
        ){

            GPS.heading=
            heading;

        }

    }


    updateGNSSStatus();

    updateHUD();

    draw();

}



/* =====================================================
   USB SERIAL
===================================================== */

let serialPort=null;

let serialReader=null;


async function connectExternalAntenna(){

    /*
      Necessário:
      - Android compatível
      - navegador com Web Serial
      - receptor expondo porta serial
      - receptor enviando NMEA
    */


    if(
        !("serial" in navigator)
    ){

        alert(

        "Web Serial não está disponível neste navegador.\n\n"+
        "Para USB/OTG direto, utilize um navegador/app Android "+
        "compatível com Web Serial ou transforme o projeto em APK nativo."

        );

        return;

    }


    try{

        serialPort=
        await navigator.serial.requestPort();


        /*
          Muitos receptores usam 115200.
          Se sua antena usar outro baud rate,
          altere aqui para 9600, 38400 etc.
        */

        await serialPort.open({

            baudRate:115200

        });


        GPS.source=
        "ANTENA EXTERNA";


        document.getElementById(
            "sourceStatus"
        ).textContent=
        "🛰️ ANTENA EXTERNA";


        toast(
            "Antena externa conectada"
        );


        readSerial();


    }
    catch(error){

        console.error(error);

        toast(
            "Erro ao conectar antena"
        );

    }

}



/* =====================================================
   LEITOR SERIAL
===================================================== */

async function readSerial(){

    if(!serialPort)
        return;


    const decoder=
    new TextDecoder();


    let buffer="";


    try{

        while(
            serialPort.readable
        ){

            serialReader=
            serialPort.readable.getReader();


            try{

                while(true){

                    const result=
                    await serialReader.read();


                    if(result.done)
                        break;


                    if(result.value){

                        buffer +=
                        decoder.decode(
                            result.value,
                            {
                                stream:true
                            }
                        );


                        const lines=
                        buffer.split(
                            /\r?\n/
                        );


                        buffer=
                        lines.pop();


                        for(
                            const line
                            of lines
                        ){

                            if(
                                line.startsWith("$")
                            ){

                                processNMEA(
                                    line
                                );

                            }

                        }

                    }

                }

            }
            finally{

                serialReader.releaseLock();

            }

        }

    }
    catch(error){

        console.error(error);

        toast(
            "Conexão da antena encerrada"
        );

    }

}



/* =====================================================
   PROJEÇÃO DO MAPA
===================================================== */

function projectPoint(
    point,
    ref,
    width,
    height
){

    const xy=
    localXY(
        point,
        ref
    );


    const scale=
    5*GPS.zoom;


    return {

        x:
        width/2+
        xy.x*scale,

        y:
        height/2-
        xy.y*scale

    };

}



/* =====================================================
   DESENHAR MAPA
===================================================== */

function draw(){

    const width=
    canvas.clientWidth;

    const height=
    canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.fillStyle=
    GPS.view3D
    ?" #d6dadd"
    :"#dfe2e2";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* GRID */

    const grid=
    Math.max(
        35,
        65*GPS.zoom
    );


    ctx.strokeStyle=
    "#c6cacc";

    ctx.lineWidth=1;


    for(
        let x=0;
        x<width;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            height
        );

        ctx.stroke();

    }


    for(
        let y=0;
        y<height;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    if(GPS.lat===null)
        return;


    const ref={

        lat:GPS.lat,

        lon:GPS.lon

    };


    /* ================= TALHÃO ================= */

    if(
        GPS.field.length>=2
    ){

        ctx.beginPath();


        GPS.field.forEach(
            (point,index)=>{

                const p=
                projectPoint(
                    point,
                    ref,
                    width,
                    height
                );


                if(index===0){

                    ctx.moveTo(
                        p.x,
                        p.y
                    );

                }
                else{

                    ctx.lineTo(
                        p.x,
                        p.y
                    );

                }

            }
        );


        ctx.closePath();


        ctx.fillStyle=
        "rgba(50,160,80,.18)";

        ctx.fill();


        ctx.strokeStyle=
        "#258449";

        ctx.lineWidth=3;

        ctx.stroke();

    }



    /* ================= COBERTURA ================= */

    for(
        const point
        of GPS.coverage
    ){

        const p=
        projectPoint(
            point,
            ref,
            width,
            height
        );


        ctx.fillStyle=
        "rgba(255,190,0,.40)";


        ctx.fillRect(
            p.x-3,
            p.y-3,
            6,
            6
        );

    }



    /* ================= TRILHA ================= */

    if(
        GPS.points.length>1
    ){

        ctx.beginPath();


        GPS.points.forEach(
            (point,index)=>{

                const p=
                projectPoint(
                    point,
                    ref,
                    width,
                    height
                );


                if(index===0){

                    ctx.moveTo(
                        p.x,
                        p.y
                    );

                }
                else{

                    ctx.lineTo(
                        p.x,
                        p.y
                    );

                }

            }
        );


        ctx.strokeStyle=
        "#147cff";

        ctx.lineWidth=4;

        ctx.stroke();

    }



    /* ================= A ================= */

    if(GPS.A){

        const p=
        projectPoint(
            GPS.A,
            ref,
            width,
            height
        );


        ctx.fillStyle=
        "#00b84d";


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            9,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle=
        "#111";

        ctx.font=
        "bold 15px Arial";


        ctx.fillText(
            "A",
            p.x+12,
            p.y-10
        );

    }



    /* ================= B ================= */

    if(
        GPS.A &&
        GPS.B
    ){

        const A=
        projectPoint(
            GPS.A,
            ref,
            width,
            height
        );


        const B=
        projectPoint(
            GPS.B,
            ref,
            width,
            height
        );


        ctx.strokeStyle=
        "#e53945";

        ctx.lineWidth=3;


        ctx.beginPath();

        ctx.moveTo(
            A.x,
            A.y
        );

        ctx.lineTo(
            B.x,
            B.y
        );

        ctx.stroke();


        ctx.fillStyle=
        "#e53945";


        ctx.beginPath();

        ctx.arc(
            B.x,
            B.y,
            9,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle=
        "#111";

        ctx.font=
        "bold 15px Arial";


        ctx.fillText(
            "B",
            B.x+12,
            B.y-10
        );


        /* ================= PARALELAS ================= */

        const angle=
        bearing(
            GPS.A,
            GPS.B
        );


        for(
            let k=-10;
            k<=10;
            k++
        ){

            const base=
            destination(
                GPS.A,
                angle+90,
                k*GPS.swath
            );


            const p1=
            destination(
                base,
                angle,
                -2500
            );


            const p2=
            destination(
                base,
                angle,
                2500
            );


            const P1=
            projectPoint(
                p1,
                ref,
                width,
                height
            );


            const P2=
            projectPoint(
                p2,
                ref,
                width,
                height
            );


            ctx.beginPath();

            ctx.moveTo(
                P1.x,
                P1.y
            );

            ctx.lineTo(
                P2.x,
                P2.y
            );


            ctx.strokeStyle=
            k===0
            ?"red"
            :"#89999f";


            ctx.lineWidth=
            k===0
            ?2
            :1;


            ctx.setLineDash(
                k===0
                ?[]
                :[7,7]
            );


            ctx.stroke();

            ctx.setLineDash([]);

        }

    }



    /* ================= POSIÇÃO ================= */

    ctx.fillStyle=
    "#0877ff";


    ctx.beginPath();

    ctx.arc(
        width/2,
        height/2,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle=
    "#fff";

    ctx.lineWidth=2;

    ctx.stroke();

}



/* =====================================================
   DESTINO GPS
===================================================== */

function destination(
    point,
    direction,
    meters
){

    const R=6378137;

    const q=Math.PI/180;

    const angular=
    meters/R;

    const bearingRad=
    direction*q;

    const lat=
    point.lat*q;

    const lon=
    point.lon*q;


    const newLat=

    Math.asin(

        Math.sin(lat)*
        Math.cos(angular)

        +

        Math.cos(lat)*
        Math.sin(angular)*
        Math.cos(bearingRad)

    );


    const newLon=

    lon+

    Math.atan2(

        Math.sin(bearingRad)*
        Math.sin(angular)*
        Math.cos(lat),

        Math.cos(angular)
        -
        Math.sin(lat)*
        Math.sin(newLat)

    );


    return {

        lat:
        newLat/q,

        lon:
        (
            newLon/q+
            540
        )%360-180

    };

}

function setA(){

function markPoint(){

        toast(
            "Aguardando GNSS"
        );

        return;

    }


    GPS.marks.push({

        lat:GPS.lat,

        lon:GPS.lon,

        time:
        new Date().toISOString()

    });


    toast(
        "Ponto marcado"
    );

}



/* =====================================================
   TALHÃO
===================================================== */

function addBoundaryPoint(){

    if(GPS.lat===null){

        toast(
            "Aguardando GNSS"
        );

        return;

    }


    GPS.field.push({

        lat:GPS.lat,

        lon:GPS.lon

    });


    GPS.area=
    calculateArea(
        GPS.field
    );


    draw();

    updateHUD();


    openPanel("field");

}


function finishBoundary(){

    if(
        GPS.field.length<3
    ){

        toast(
            "São necessários pelo menos 3 pontos"
        );

        return;

    }


    GPS.field.push({
        ...GPS.field[0]
    });


    GPS.area=
    calculateArea(
        GPS.field
    );


    draw();

    updateHUD();


    toast(
        "Talhão fechado"
    );

}

function applySetup(){

    const swath=
    parseFloat(
        document.getElementById(
            "swathInput"
        ).value
    );


    const overlap=
    parseFloat(
        document.getElementById(
            "overlapInput"
        ).value
    );


    const offset=
    parseFloat(
        document.getElementById(
            "offsetInput"
        ).value
    );


    const antennaHeight=
    parseFloat(
        document.getElementById(
            "antennaInput"
        ).value
    );


    GPS.swath=
    swath>0
    ?swath
    :24;


    GPS.overlap=
    overlap>=0
    ?overlap
    :0;


    GPS.offset=
    Number.isFinite(offset)
    ?offset
    :0;


    GPS.antennaHeight=
    antennaHeight>=0
    ?antennaHeight
    :0;


    updateHUD();

    draw();

    saveSession();

    toast(
        "Configuração aplicada"
    );

    closePanel();

}

===================================================== */

function zoom(amount){

    GPS.zoom +=
    amount*.25;


    if(GPS.zoom<0.5)
        GPS.zoom=0.5;


    if(GPS.zoom>5)
        GPS.zoom=5;


    draw();

}

   CENTRALIZAR
===================================================== */

function centerMap(){

    GPS.zoom=1;

    draw();

    toast(
        "Mapa centralizado"
    );

}



/* =====================================================
   2D / 3D
===================================================== */

function toggleView(){

    GPS.view3D=
    !GPS.view3D;


    document.getElementById(
        "viewButton"
    ).textContent=
    GPS.view3D
    ?"3D"
    :"2D";


    draw();

}



/* =====================================================
   SALVAR SESSÃO
===================================================== */

function saveSession(){

    try{

        localStorage.setItem(

            "PORTAL_SAT_GPS_SESSION",

            JSON.stringify(GPS)

        );


        toast(
            "Sessão salva no tablet"
        );

    }
    catch(error){

        toast(
            "Não foi possível salvar"
        );

    }

}



/* =====================================================
   CARREGAR SESSÃO
===================================================== */

function loadSession(){

    try{

        const saved=
        localStorage.getItem(
            "PORTAL_SAT_GPS_SESSION"
        );


        if(!saved)
            return;


        const data=
        JSON.parse(saved);


        Object.assign(
            GPS,
            data
        );


        updateHUD();

        draw();

    }
    catch(error){

        console.log(error);

    }

}



/* =====================================================
   EXPORTAR JSON
===================================================== */

function downloadFile(
    filename,
    content,
    type
){

    const blob=
    new Blob(
        [content],
        {type:type}
    );


    const url=
    URL.createObjectURL(
        blob
    );


    const link=
    document.createElement(
        "a"
    );


    link.href=url;

    link.download=
    filename;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(
        ()=>{
            URL.revokeObjectURL(
                url
            );
        },
        1000
    );

}

/* =====================================================
   EXPORTAR CSV
===================================================== */

function exportCSV(){

    let csv=
    "data,hora,latitude,longitude,velocidade_kmh,rumo,precisao_m\n";


    for(
        const point
        of GPS.points
    ){

        const date=
        new Date(
            point.time
        );


        csv +=

        date.toLocaleDateString(
            "pt-BR"
        )+

        ","+

        date.toLocaleTimeString(
            "pt-BR"
        )+

        ","+

        point.lat+

        ","+

        point.lon+

        ","+

        (point.speed||0)+

        ","+

        (point.heading??"")+

        ","+

        (point.accuracy??"")+

        "\n";

    }


    downloadFile(

        "portal_sat_gps_trilha.csv",

        csv,

        "text/csv"

    );


    toast(
        "CSV exportado"
    );

}



/* =====================================================
   LIMPAR SESSÃO
===================================================== */

function clearSession(){

    if(
        !confirm(
            "Limpar todos os dados desta sessão?"
        )
    ){

        return;

    }


    GPS.points=[];

    GPS.coverage=[];

    GPS.marks=[];

    GPS.field=[];

    GPS.A=null;

    GPS.B=null;

    GPS.area=0;


    draw();

    updateHUD();


    toast(
        "Sessão limpa"
    );

}



/* =====================================================
   RELÓGIO
===================================================== */

setInterval(

    ()=>{

        document.getElementById(
            "clock"
        ).textContent=

        new Date()
        .toLocaleTimeString(
            "pt-BR"
        );

    },

    1000

);



/* =====================================================
   ATUALIZAÇÃO
===================================================== */

setInterval(

    ()=>{

        if(
            GPS.field.length>=3
        ){

            GPS.area=
            calculateArea(
                GPS.field
            );

        }


        updateHUD();

    },

    1000

);



/* =====================================================
   PEDIR PAISAGEM
===================================================== */

async function requestLandscape(){

    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation.lock(
                "landscape"
            );

        }

    }
    catch(error){

        console.log(
            "Orientação controlada pelo Android"
        );

    }

}


/* =====================================================
   EVENTO DE PRIMEIRO TOQUE
===================================================== */

document.addEventListener(

    "click",

    function(){

        requestLandscape();

    },

    {
        once:true
    }

);



/* =====================================================
   INICIALIZAÇÃO
===================================================== */

loadSession();

updateHUD();

draw();

startAndroidGPS();

requestLandscape();

</script>
