<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PORTAL SAT GPS — Navegación Agrícola RTK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        jdgreen: '#008000',
                        jdyellow: '#FFCC00',
                        jdred: '#cc0000',
                        jdblue: '#0066FF',
                        darkbg: '#0F1A0F',
                    },
                    fontFamily: { mono: ['"Roboto Mono"', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0F1A0F;
            color: white;
            font-family: Roboto, sans-serif;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
        }
        .grid-field {
            background-image: 
                linear-gradient(rgba(0,200,0,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,200,0,0.08) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .light-bar-container { position: relative; width: 100%; height: 28px; }
        .light-bar {
            background: linear-gradient(90deg, #c00 0%, #f60 20%, #fc0 35%, #0c0 50%, #fc0 65%, #f60 80%, #c00 100%);
            border-radius: 999px; width: 100%; height: 100%; position: relative;
        }
        .center-marker {
            position: absolute; top: 0; bottom: 0; left: 50%; width: 3px;
            background: white; transform: translateX(-50%); z-index: 3;
        }
        .position-indicator {
            position: absolute; top: -4px; width: 10px; height: 36px;
            background: white; border-radius: 3px; z-index: 4;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
            transition: left 0.15s ease-out;
        }
        .cm-label { position: absolute; top: 30px; font-size: 9px; color: #aaa; transform: translateX(-50%); }
        .triangle-yellow {
            width: 0; height: 0;
            border-left: 35px solid transparent;
            border-right: 35px solid transparent;
            border-bottom: 55px solid #FFCC00;
            filter: drop-shadow(0 0 14px rgba(255,204,0,0.9));
            transition: transform 0.25s ease-out;
            z-index: 15;
        }
        .coverage-band {
            background: rgba(0,90,0,0.35);
            border: 2px solid rgba(0,220,0,0.45);
            border-radius: 2px;
        }
        .ab-line {
            position: absolute; width: 4px; background: linear-gradient(180deg, #0066FF 0%, #00CCFF 50%, #0066FF 100%);
            border-radius: 2px; z-index: 10; transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0,100,255,0.4);
        }
        .point-marker {
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; z-index: 11; position: absolute;
            box-shadow: 0 0 12px rgba(0,0,0,0.5);
        }
        .btn-round {
            width: 54px; height: 54px; border-radius: 50%; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; color: white; font-size: 20px;
            backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }
        .btn-round:active { transform: scale(0.92); background: rgba(0,200,0,0.3); }
        .btn-ab {
            width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: bold; transition: all 0.2s;
            border: 2px solid transparent;
        }
        .data-panel {
            background: rgba(0,0,0,0.6); border-radius: 10px; padding: 10px 12px;
            backdrop-filter: blur(8px); border: 1px solid rgba(0,255,0,0.1);
        }
        .status-badge {
            padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold;
        }
        .sat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin: 1px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .searching { animation: pulse 1s infinite; }
    </style>
</head>
<body class="grid-field">

    <!-- === BARRA SUPERIOR === -->
    <header class="bg-jdgreen px-3 py-2 relative z-50">
        <!-- Barra de Luz — Desvio Lateral em Centímetros -->
        <div class="light-bar-container mb-3">
            <div class="light-bar"></div>
            <div class="center-marker"></div>
            <div id="dev-indicator" class="position-indicator" style="left: 50%; transform: translateX(-50%);"></div>
            <!-- Marcas de cm do centro para ambos lados -->
            <span class="cm-label" style="left: 50%;">0</span>
            <span class="cm-label" style="left: 42.5%;">-15</span>
            <span class="cm-label" style="left: 35%;">-30</span>
            <span class="cm-label" style="left: 27.5%;">-45</span>
            <span class="cm-label" style="left: 20%;">-60</span>
            <span class="cm-label" style="left: 57.5%;">+15</span>
            <span class="cm-label" style="left: 65%;">+30</span>
            <span class="cm-label" style="left: 72.5%;">+45</span>
            <span class="cm-label" style="left: 80%;">+60</span>
        </div>

        <!-- Cabeçalho -->
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button id="btn-menu" class="w-9 h-9 rounded-full bg-black/20 flex items-center justify-center text-lg">
                    <i class="fa fa-bars"></i>
                </button>
                <span class="text-lg font-bold">PORTAL SAT GPS</span>
            </div>
            <div class="flex items-center gap-3 text-sm">
                <span id="clock" class="font-mono">00:00:00</span>
                <span id="fix-status" class="status-badge bg-green-600 text-white">RTK-FIX</span>
                <span id="sat-count" class="font-mono text-xs">14/14</span>
                <button id="btn-settings" class="w-9 h-9 rounded-full bg-black/20 flex items-center justify-center">
                    <i class="fa fa-cog text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- === ÁREA PRINCIPAL === -->
    <main class="absolute inset-0 pt-32 pb-4 px-3 overflow-hidden">

        <!-- Botões A / B — Definição de Linha -->
        <div class="absolute left-4 top-4 flex flex-col items-center gap-2 z-30">
            <button id="btn-set-a" class="btn-ab bg-green-600 border-2 border-green-400">A</button>
            <button id="btn-set-b" class="btn-ab bg-gray-700 text-gray-400 border-2 border-gray-600" disabled>B</button>
            <div class="w-0.5 h-6 bg-gray-500"></div>
        </div>

        <!-- 📊 Painel de Dados — Canto Superior Direito -->
        <div class="absolute top-4 right-4 data-panel z-30 w-52">
            <div class="flex justify-between items-center text-sm mb-2">
                <span class="text-gray-400">Rumbo</span>
                <span id="heading-val" class="font-mono font-bold text-lg">310.0°</span>
            </div>
            <div class="flex justify-between items-center text-sm mb-2">
                <span class="text-gray-400">Desvío</span>
                <span id="dev-val" class="font-mono font-bold text-lg text-jdyellow">-0.05 m</span>
            </div>
            <div class="flex justify-between items-center text-sm mb-2">
                <span class="text-gray-400">Velocidad</span>
                <span id="speed-val" class="font-mono font-bold text-lg">0.0 km/h</span>
            </div>
            <div class="border-t border-gray-700 my-2"></div>
            <div class="text-xs space-y-1">
                <div class="flex justify-between"><span class="text-gray-500">Latitud</span><span id="lat-val" class="font-mono">-24.489275°</span></div>
                <div class="flex justify-between"><span class="text-gray-500">Longitud</span><span id="lon-val" class="font-mono">-54.614722°</span></div>
                <div class="flex justify-between"><span class="text-gray-500">Precisión</span><span id="acc-val" class="font-mono text-green-400">±0.02 m</span></div>
                <div class="flex justify-between"><span class="text-gray-500">Ancho faja</span><span id="width-val" class="font-mono">12.0 m</span></div>
            </div>
            <div class="border-t border-gray-700 my-2"></div>
            <!-- Status Antena Externa -->
            <div class="flex items-center justify-between text-xs">
                <span class="text-gray-400"><i class="fa fa-wifi mr-1"></i> Antena Externa</span>
                <span id="antenna-status" class="text-green-400 font-bold">CONECTADA</span>
            </div>
            <!-- Satélites -->
            <div class="flex justify-center mt-2" id="sat-bars">
                <span class="sat-dot bg-green-400"></span><span class="sat-dot bg-green-400"></span>
                <span class="sat-dot bg-green-400"></span><span class="sat-dot bg-green-400"></span>
                <span class="sat-dot bg-green-400"></span><span class="sat-dot bg-green-400"></span>
                <span class="sat-dot bg-green-400"></span><span class="sat-dot bg-green-400"></span>
            </div>
        </div>

        <!-- Controles Esquerdos -->
        <div class="absolute left-4 top-36 flex flex-col items-center gap-4 z-30">
            <button id="btn-zoom-in" class="btn-round"><i class="fa fa-search-plus"></i></button>
            <button id="btn-zoom-out" class="btn-round"><i class="fa fa-search-minus"></i></button>
            <button id="btn-center" class="btn-round"><i class="fa fa-crosshairs"></i></button>
            <button id="btn-view" class="btn-round"><i class="fa fa-cubes"></i></button>
        </div>

        <!-- Controles Direitos -->
        <div class="absolute right-4 bottom-1/3 flex flex-col items-center gap-4 z-30">
            <button id="btn-start" class="btn-round bg-green-600/40 border border-green-400/40"><i class="fa fa-play"></i></button>
            <button id="btn-stop" class="btn-round"><i class="fa fa-times"></i></button>
            <button id="btn-reset" class="btn-round"><i class="fa fa-refresh"></i></button>
        </div>

        <!-- === LINHA AB + FAIXA DE COBERTURA === -->
        <div id="ab-line" class="ab-line absolute left-1/2 top-0 bottom-0" style="height: 0; opacity: 0; transform: translateX(-50%);"></div>
        <div id="point-a" class="point-marker bg-green-600 text-white border-2 border-green-400" style="bottom: 10%; left: 50%; transform: translateX(-50%) scale(0); opacity: 0;">A</div>
        <div id="point-b" class="point-marker bg-jdblue text-white border-2 border-blue-400" style="top: 15%; left: 50%; transform: translateX(-50%) scale(0); opacity: 0;">B</div>
        <div id="coverage" class="coverage-band absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-4/5 h-20 opacity-0 transition-opacity duration-500"></div>
        <div id="vehicle" class="triangle-yellow absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2" style="transform: translate(-50%, -50%) rotate(0deg);"></div>

    </main>

    <script>
        // ==================================================
        // 🛰️ SISTEMA DE NAVEGACIÓN AGRÍCOLA RTK — FUNCIONAL
        // ==================================================
        const state = {
            lat: -24.489275,
            lon: -54.614722,
            heading: 310.0,      // Rumbo en grados
            speed: 0.0,          // km/h
            devLateral: -0.05,   // Desvio lateral en metros (+ derecha, - izquierda)
            accuracy: 0.02,      // Precisión en metros
            fixType: 'RTK-FIX',  // NO_FIX, GPS, DGPS, RTK-FIX
            satellites: { total: 14, used: 14 },
            antennaConnected: true,
            lineA: null,         // Coordenadas punto A
            lineB: null,         // Coordenadas punto B
            lineActive: false,
            workingWidth: 12.0,  // Ancho de faixa en metros
            isRunning: false,
            zoom: 1,
            time: 0
        };

        // Elementos del DOM
        const el = {
            clock: document.getElementById('clock'),
            lat: document.getElementById('lat-val'),
            lon: document.getElementById('lon-val'),
            heading: document.getElementById('heading-val'),
            dev: document.getElementById('dev-val'),
            speed: document.getElementById('speed-val'),
            acc: document.getElementById('acc-val'),
            fixStatus: document.getElementById('fix-status'),
            satCount: document.getElementById('sat-count'),
            antenna: document.getElementById('antenna-status'),
            devIndicator: document.getElementById('dev-indicator'),
            btnA: document.getElementById('btn-set-a'),
            btnB: document.getElementById('btn-set-b'),
            abLine: document.getElementById('ab-line'),
            pointA: document.getElementById('point-a'),
            pointB: document.getElementById('point-b'),
            coverage: document.getElementById('coverage'),
            vehicle: document.getElementById('vehicle'),
            widthVal: document.getElementById('width-val')
        };

        // ========== UTILIDADES ==========
        function updateClock() {
            const now = new Date();
            el.clock.textContent = now.toLocaleTimeString('es-PY', { hour12: false });
        }

        // Convierte desvio (metros) → posición en la barra de luz (porcentaje)
        function devToPercent(dev) {
            const maxDev = 0.6; // ±60cm máximo visualizado
            let percent = 50 + (dev / maxDev) * 40;
            return Math.max(5, Math.min(95, percent));
        }

        // ========== ACTUALIZAR INTERFAZ ==========
        function updateUI() {
            el.lat.textContent = state.lat.toFixed(6) + '°';
            el.lon.textContent = state.lon.toFixed(6) + '°';
            el.heading.textContent = state.heading.toFixed(1) + '°';
            el.dev.textContent = (state.devLateral >= 0 ? '+' : '') + state.devLateral.toFixed(2) + ' m';
            el.dev.className = state.devLateral > 0.5 ? 'font-mono font-bold text-lg text-jdred'
                             : state.devLateral < -0.5 ? 'font-mono font-bold text-lg text-jdred'
                             : 'font-mono font-bold text-lg text-jdyellow';
            el.speed.textContent = state.speed.toFixed(1) + ' km/h';
            el.acc.textContent = '±' + state.accuracy.toFixed(2) + ' m';
            
            // Indicador visual de desvio en la barra de luz
            el.devIndicator.style.left = devToPercent(state.devLateral) + '%';
            
            // Estado de fix
            el.fixStatus.textContent = state.fixType;
            if (state.fixType === 'RTK-FIX') {
                el.fixStatus.className = 'status-badge bg-green-600 text-white';
            } else if (state.fixType === 'DGPS') {
                el.fixStatus.className = 'status-badge bg-blue-600 text-white';
            } else if (state.fixType === 'GPS') {
                el.fixStatus.className = 'status-badge bg-yellow-500 text-black';
            } else {
                el.fixStatus.className = 'status-badge bg-red-600 text-white searching';
            }

            el.satCount.textContent = state.satellites.used + '/' + state.satellites.total;
            el.antenna.textContent = state.antennaConnected ? 'CONECTADA' : 'SIN SEÑAL';
            el.antenna.className = state.antennaConnected ? 'text-green-400 font-bold' : 'text-red-400 font-bold';
            
            // Rotación del triángulo según rumbo
            el.vehicle.style.transform = `translate(-50%, -50%) rotate(${state.heading - 90}deg)`;
        }

        // ========== DEFINIR PUNTOS A Y B ==========
        el.btnA.addEventListener('click', () => {
            state.lineA = { lat: state.lat, lon: state.lon, heading: state.heading };
            el.btnA.classList.add('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-green-800');
            el.btnB.disabled = false;
            el.btnB.classList.remove('bg-gray-700', 'text-gray-400', 'border-gray-600');
            el.btnB.classList.add('bg-jdblue', 'border-blue-400', 'text-white');
            el.pointA.style.transform = 'translate(-50%, -50%) scale(1)';
            el.pointA.style.opacity = '1';
            el.abLine.style.height = '70%';
            el.abLine.style.opacity = '1';
            state.lineActive = false;
        });

        el.btnB.addEventListener('click', () => {
            if (!state.lineA) return;
            state.lineB = { lat: state.lat + 0.001, lon: state.lon, heading: state.heading };
            el.btnB.classList.add('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-blue-800');
            el.pointB.style.transform = 'translate(-50%, -50%) scale(1)';
            el.pointB.style.opacity = '1';
            el.coverage.style.opacity = '1';
            state.lineActive = true;
        });

        // ========== SIMULACIÓN DE MOVIMIENTO (como GPS real) ==========
        function simulateGPS() {
            if (!state.isRunning) return;
            
            // Simula avance
            const speedFactor = state.speed / 3.6; // m/s
            const rad = state.heading * Math.PI / 180;
            state.lat += (Math.cos(rad) * speedFactor * 0.00001);
            state.lon += (Math.sin(rad) * speedFactor * 0.00001);
            
            // Simula pequeño desvio lateral oscilante
            state.devLateral = -0.05 + Math.sin(Date.now() / 2000) * 0.08;
            
            updateUI();
        }

        // ========== CONTROLES ==========
        document.getElementById('btn-start').addEventListener('click', () => {
            state.isRunning = !state.isRunning;
            state.speed = state.isRunning ? 7.2 : 0;
            document.getElementById('btn-start').innerHTML = state.isRunning 
                ? '<i class="fa fa-pause"></i>' 
                : '<i class="fa fa-play"></i>';
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            state.lineA = null;
            state.lineB = null;
            state.lineActive = false;
            state.devLateral = -0.05;
            el.btnA.classList.remove('ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-green-800');
            el.btnB.classList.add('bg-gray-700', 'text-gray-400', 'border-gray-600');
            el.btnB.classList.remove('bg-jdblue', 'border-blue-400', 'text-white', 'ring-2', 'ring-white', 'ring-offset-2', 'ring-offset-blue-800');
            el.btnB.disabled = true;
            el.pointA.style.transform = 'translate(-50%, -50%) scale(0)';
            el.pointA.style.opacity = '0';
            el.pointB.style.transform = 'translate(-50%, -50%) scale(0)';
            el.pointB.style.opacity = '0';
            el.abLine.style.height = '0';
            el.abLine.style.opacity = '0';
            el.coverage.style.opacity = '0';
            state.isRunning = false;
            state.speed = 0;
            document.getElementById('btn-start').innerHTML = '<i class="fa fa-play"></i>';
            updateUI();
        });

        // Zoom
        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            state.zoom = Math.min(3, state.zoom * 1.2);
            document.body.style.backgroundSize = (70 / state.zoom) + 'px ' + (70 / state.zoom) + 'px';
        });
        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            state.zoom = Math.max(0.5, state.zoom / 1.2);
            document.body.style.backgroundSize = (70 / state.zoom) + 'px ' + (70 / state.zoom) + 'px';
        });

        // ========== CONEXIÓN CON GPS REAL (API Nativa) ==========
        if ('geolocation' in navigator) {
            const geoOptions = {
                enableHighAccuracy: true,  // ⚠️ Requiere antena externa
                maximumAge: 0,
                timeout: 1000
            };

            navigator.geolocation.watchPosition(
                (pos) => {
                    state.lat = pos.coords.latitude;
                    state.lon = pos.coords.longitude;
                    state.accuracy = Math.max(0.01, pos.coords.accuracy / 100 || 0.02);
                    state.antennaConnected = true;
                    
                    // Si hay datos de rumbo y velocidad
                    if (pos.coords.heading !== null) state.heading = pos.coords.heading;
                    if (pos.coords.speed !== null) state.speed = (pos.coords.speed * 3.6); // m/s → km/h
                    
                    // Determinar tipo de corrección según precisión
                    if (state.accuracy <= 0.03) state.fixType = 'RTK-FIX';
                    else if (state.accuracy <= 1.0) state.fixType = 'DGPS';
                    else state.fixType = 'GPS';
                    
                    updateUI();
                },
                (err) => {
                    console.warn('GPS Error:', err);
                    state.antennaConnected = false;
                    state.fixType = err.code === 1 ? 'NO_PERM' : 'NO_FIX';
                    updateUI();
                },
                geoOptions
            );
        } else {
            state.fixType = 'NO_FIX';
            state.antennaConnected = false;
            updateUI();
        }

        // ========== BUCLE PRINCIPAL ==========
        updateClock();
        updateUI();
        setInterval(updateClock, 1000);
        setInterval(simulateGPS, 200);
    </script>

</body>
</html>
