<!-- Configurações / Conexão -->
<section class="card" id="configCard" aria-label="Configurações e conexão">
  <h2>Configurações</h2>
  <div class="grid" style="align-items: start;">
    <div>
      <label for="port">Conexão (ex.: BLE, COM,/[Identificador]):</label>
      <input type="text" id="port" placeholder="Conexão (ex.: BLE-Trimble-001)" />
    </div>
    <div>
      <label for="baud">Baud Rate (ex.: 9600):</label>
      <input type="number" id="baud" value="9600" />
    </div>
    <div style="grid-column: 1 / 3;">
      <label>Sentences NMEA a enviar/esperar:</label>
      <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
        <label><input type="checkbox" checked disabled> GGA</label>
        <label><input type="checkbox" checked disabled> RMC</label>
        <label><input type="checkbox" checked disabled> GSA</label>
        <label><input type="checkbox" checked disabled> GSV</label>
      </div>
    </div>
  </div>
  <div style="margin-top:0.75rem;">
    <button id="connectBtn" title="Conectar com o dispositivo via bridge nativo">Conectar</button>
    <button class="secondary" id="simulateBtn" style="margin-left:0.5rem;">Simular Dados</button>
  </div>
  <p style="color:#9fb6d6; margin-top:0.5rem;">Observação: a conexão real requer um plugin nativo (Cordova/Capacitor) que passe dados para a página JS. Este HTML facilita a estrutura de tela e parsing básico.</p>
</section>

<!-- Logs / Debug -->
<section class="card" id="logsCard" aria-label="Logs">
  <h2>Logs</h2>
  <pre id="log">Aguardando dados...</pre>
</section>
