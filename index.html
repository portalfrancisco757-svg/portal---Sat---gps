<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PORTAL SAT GPS 🛰️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        html, body {
            width: 100vw; height: 100vh;
            overflow: hidden; background: #0f2040; color: #fff;
        }

        /* LAYOUT PRINCIPAL — SEMPRE VISÍVEL */
        .app {
            width: 100%; height: 100%;
            display: grid;
            grid-template-rows: 60px 1fr;
            grid-template-columns: 70px 1fr 70px;
            grid-template-areas:
                "topo topo topo"
                "esq mapa dir";
        }

        /* TOPO */
        .topo {
            grid-area: topo; background: #0f2040;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; border-bottom: 2px solid #2E7D32;
        }
        .logo { font-size: 22px; font-weight: bold; color: #4ade80; display: flex; align-items: center; gap: 8px; }
        .status { display: flex; gap: 15px; font-size: 13px; align-items: center; }
        .bolinha { width: 12px; height: 12px; border-radius: 50%; background: #444; }
        .bolinha.verde { background: #22c55e; box-shadow: 0 0 6px #22c55e; }

        /* BARRA DE LUZ — HORIZONTAL */
        .barra-luz {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            width: 450px; height: 22px; background: #1a1a1a; border-radius: 11px;
            display: flex; align-items: center; z-index: 100; overflow: hidden;
        }
        .luz-esq, .luz-dir {
            height: 100%; width: 200px;
            background: linear-gradient(90deg, #ef4444, #eab308, #22c55e);
            transform: scaleX(0); transition: transform 0.1s;
        }
        .luz-esq { transform-origin: right; }
        .luz-dir { transform-origin: left; }
        .centro { width: 3px; height: 22px; background: #fff; z-index: 5; }
        .desvio { position: absolute; top: 30px; font-size: 16px; color: #ffd700; font-weight: bold; }

        /* PAINEIS LATERAIS */
        .esq, .dir {
            background: #0f2040; display: flex; flex-direction: column;
            align-items: center; padding: 10px 0; gap: 12px;
            border-right: 2px solid #2E7D32;
        }
        .dir { border-right: none; border-left: 2px solid #2E7D32; }
        .btn {
            width: 50px; height: 50px; font-size: 24px; border-radius: 8px;
            border: none; background: #1e293b; color: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .btn.ativo { background: #2E7D32; box-shadow: 0 0 8px #22c55e; }
        .btn.pintando { background: #22c55e; animation: piscar 1s infinite; }
        @keyframes piscar { 0% {opacity:1;} 50% {opacity:0.6;} 100% {opacity:1;} }

        /* MAPA — GRADE VISÍVEL */
        .mapa {
            grid-area: mapa; background: #0a0f1a;
            background-image: 
                linear-gradient(rgba(46,125,50,0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46,125,50,0.15) 1px, transparent 1px);
            background-size: 30px 30px; position: relative; overflow: hidden;
        }
        #canvasCobertura { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }

        /* LINHA AB E PONTOS */
        .linha-ab {
            position: absolute; top: 0; bottom: 0; left: 50%; width: 4px;
            background: linear-gradient(180deg, #22c55e, #4ade80, #22c55e);
            transform: translateX(-50%); display: none; z-index: 10;
        }
        .ponto-a, .ponto-b {
            position: absolute; left: 50%; transform: translateX(-50%);
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; z-index: 11; display: none;
        }
        .ponto-a { background: #22c55e; bottom: 30px; }
        .ponto-b { background: #3b82f6; top: 80px; }

        /* SETA AMARELA */
        .trator {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 36px solid #ffd700;
            filter: drop-shadow(0 0 10px #ffd700);
            transform: translate(-50%, -50%);
            z-index: 15;
        }

        /* DADOS */
        .dados {
            position: absolute; bottom: 15px; left: 15px;
            background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px;
            border: 2px solid #2E7D32; font-size: 14px; line-height: 1.6; z-index: 20;
        }
        .dados span { color: #4ade80; font-weight: bold; }

        /* MODAL */
        .modal {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center;
            z-index: 200;
        }
        .modal-c {
            background: #1a2a4a; padding: 20px; border-radius: 10px;
            border: 2px solid #2E7D32; width: 90%; max-width: 350px;
        }
        .modal-c h3 { color: #4ade80; margin-bottom: 15px; text-align: center; }
        .campo { margin-bottom: 12px; }
        .campo label { display: block; margin-bottom: 5px; font-size: 14px; }
        .campo input { width: 100%; padding: 8px; border-radius: 5px; border: none; background: #253555; color: #fff; }
        .botoes { display: flex; gap: 10px; margin-top: 15px; }
        .btn-m { flex:1; padding:10px; border:none; border-radius:5px; font-weight:bold; cursor:pointer; }
        .btn-m.verde { background: #2E7D32; color: white; }
        .btn-m.cinza { background: #445566; color: white; }
    </style>
</head>
<body>

<div class="app">
    <!-- TOPO -->
    <div class="topo">
        <div class="logo">🛰️ PORTAL SAT GPS</div>
        <div class="status">
            <span><span id="gpsBol" class="bolinha"></span> GPS</span>
            <span id="precisao">2-5m</span>
            <span id="hora">00:00:00</span>
        </div>
    </div>

    <!-- BARRA DE LUZ -->
    <div class="barra-luz">
        <div class="luz-esq" id="luzEsq"></div>
        <div class="centro"></div>
        <div class="luz-dir" id="luzDir"></div>
        <div class="desvio" id="desvioValor">0.00 m</div>
    </div>

    <!-- PAINEL ESQUERDO -->
    <div class="esq">
        <button class="btn" id="btnPintar" onclick="alternarPintura()" title="Pintar">🖌️</button>
        <button class="btn" onclick="criarA()" title="Ponto A">📍</button>
        <button class="btn" onclick="criarB()" title="Ponto B">🎯</button>
        <button class="btn" onclick="centralizar()" title="Centralizar">🎯</button>
        <button class="btn" onclick="zoomIn()" title="Zoom +">➕</button>
        <button class="btn" onclick="zoomOut()" title="Zoom −">➖</button>
    </div>

    <!-- MAPA -->
    <div class="mapa" id="mapa">
        <canvas id="canvasCobertura"></canvas>
        <div class="linha-ab" id="linhaAB"></div>
        <div class="ponto-a" id="pontoA">A</div>
        <div class="ponto-b" id="pontoB">B</div>
        <div class="trator" id="trator"></div>

        <div class="dados">
            <div>Lat: <span id="dLat">-25.197674</span></div>
            <div>Lon: <span id="dLon">-54.924653</span></div>
            <div>Vel: <span id="dVel">0.0</span> km/h</div>
            <div>Faixa: <span id="dLarg">10.0m</span></div>
            <div>Área: <span id="dArea">0.00ha</span></div>
        </div>
    </div>

    <!-- PAINEL DIREITO -->
    <div class="dir">
        <button class="btn" onclick="abrirConfig()" title="Config">⚙️</button>
        <button class="btn" onclick="salvarTalhao()" title="Salvar">💾</button>
        <button class="btn" onclick="carregarTalhao()" title="Carregar">📂</button>
        <button class="btn" onclick="limpar()" title="Limpar">🗑️</button>
    </div>
</div>

<!-- MODAL CONFIG -->
<div class="modal" id="modalConfig">
    <div class="modal-c">
        <h3>⚙️ CONFIGURAÇÕES</h3>
        <div class="campo">
            <label>Largura (m)</label>
            <input type="number" id="inpLarg" value="10.0" step="0.1">
        </div>
        <div class="campo">
            <label>Talhão</label>
            <input type="text" id="inpNome" value="Talhão 1">
        </div>
        <div class="botoes">
            <button class="btn-m verde" onclick="salvarConfig()">Salvar</button>
            <button class="btn-m cinza" onclick="fecharConfig()">Fechar</button>
        </div>
    </div>
</div>

<script>
// ==============================================
// PORTAL SAT GPS — VERSÃO SIMPLES E FUNCIONAL
// ==============================================
const est = {
    lat: -25.197674, lon: -54.924653,
    vel: 0, rumo: 0,
    pontoA: null, pontoB: null,
    largura: 10.0, area: 0.00,
    pintando: false, escala: 1.0,
    ultimoPonto: null, distPercorrida: 0
};

const canvas = document.getElementById('canvasCobertura');
const ctx = canvas.getContext('2d');
const mapa = document.getElementById('mapa');

// Ajusta canvas
function ajustarCanvas() {
    const r = mapa.getBoundingClientRect();
    canvas.width = r.width;
    canvas.height = r.height;
}
ajustarCanvas();
window.addEventListener('resize', ajustarCanvas);

// Relógio
setInterval(() => {
    const h = new Date();
    document.getElementById('hora').textContent = h.toLocaleTimeString('pt-BR', {hour12:false});
}, 1000);

// GPS REAL
function iniciarGPS() {
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
            pos => {
                est.lat = pos.coords.latitude;
                est.lon = pos.coords.longitude;
                est.vel = pos.coords.speed ? pos.coords.speed * 3.6 : 0;
                est.rumo = pos.coords.heading || 0;
                atualizarTela();
                if (est.pintando) desenhar();
            },
            err => console.log("GPS disponível — mova para funcionar"),
            { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
        );
    }
    // SIMULAÇÃO — remover quando usar GPS real
    setInterval(() => {
        est.lat += 0.000003;
        est.lon += Math.sin(Date.now()/2000)*0.000002;
        est.vel = 7 + Math.random()*3;
        atualizarTela();
        if (est.pintando) desenhar();
    }, 500);
}

// Atualizar Tela
function atualizarTela() {
    document.getElementById('dLat').textContent = est.lat.toFixed(6);
    document.getElementById('dLon').textContent = est.lon.toFixed(6);
    document.getElementById('dVel').textContent = est.vel.toFixed(1);
    document.getElementById('dLarg').textContent = est.largura.toFixed(1)+'m';
    document.getElementById('dArea').textContent = est.area.toFixed(2)+'ha';

    // Seta
    document.getElementById('trator').style.transform = 
        `translate(-50%, -50%) rotate(${est.rumo}deg)`;

    // Linha AB
    document.getElementById('linhaAB').style.display = (est.pontoA && est.pontoB) ? 'block' : 'none';
    document.getElementById('pontoA').style.display = est.pontoA ? 'flex' : 'none';
    document.getElementById('pontoB').style.display = est.pontoB ? 'flex' : 'none';

    // Barra de Luz
    atualizarBarraLuz();
}

// Barra de Luz
function atualizarBarraLuz() {
    if (!est.pontoA || !est.pontoB) {
        document.getElementById('luzEsq').style.transform = 'scaleX(0)';
        document.getElementById('luzDir').style.transform = 'scaleX(0)';
        document.getElementById('desvioValor').textContent = '0.00 m';
        return;
    }
    const lonC = (est.pontoA.lon + est.pontoB.lon)/2;
    const metrosGrau = 111320 * Math.cos(est.lat * Math.PI/180);
    const desvio = (est.lon - lonC) * metrosGrau;
    document.getElementById('desvioValor').textContent = desvio.toFixed(2)+' m';
    
    const maxD = 0.5;
    const esc = Math.min(Math.abs(desvio)/maxD, 1);
    if (desvio < -0.02) {
        document.getElementById('luzEsq').style.transform = `scaleX(${esc})`;
        document.getElementById('luzDir').style.transform = 'scaleX(0)';
    } else if (desvio > 0.02) {
        document.getElementById('luzEsq').style.transform = 'scaleX(0)';
        document.getElementById('luzDir').style.transform = `scaleX(${esc})`;
    } else {
        document.getElementById('luzEsq').style.transform = 'scaleX(0)';
        document.getElementById('luzDir').style.transform = 'scaleX(0)';
    }
}

// PINTAR / PARAR
function alternarPintura() {
    est.pintando = !est.pintando;
    const btn = document.getElementById('btnPintar');
    if (est.pintando) {
        btn.classList.add('pintando');
        btn.innerHTML = '⏹';
        est.ultimoPonto = { lat: est.lat, lon: est.lon };
    } else {
        btn.classList.remove('pintando');
        btn.innerHTML = '🖌️';
        est.ultimoPonto = null;
    }
}

// DESENHAR COBERTURA
function desenhar() {
    const pxPorM = 6 / est.escala;
    const larg = est.largura * pxPorM;

    if (!est.ultimoPonto) {
        est.ultimoPonto = { lat: est.lat, lon: est.lon };
        return;
    }

    const dy = (est.lat - est.ultimoPonto.lat) * 111000 * pxPorM;
    const dx = (est.lon - est.ultimoPonto.lon) * 111000 * Math.cos(est.lat * Math.PI/180) * pxPorM;
    const dist = Math.sqrt(dx*dx + dy*dy) / pxPorM;
    est.distPercorrida += dist;
    est.area = (est.distPercorrida * est.largura) / 10000;

    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.fillStyle = 'rgba(34, 197, 94, 0.45)';
    ctx.fillRect(-larg/2, -2, larg, 4);
    ctx.restore();

    est.ultimoPonto = { lat: est.lat, lon: est.lon };
    document.getElementById('dArea').textContent = est.area.toFixed(2)+'ha';
}

// FUNÇÕES
function criarA() {
    est.pontoA = { lat: est.lat, lon: est.lon };
    est.pontoB = null;
    est.distPercorrida = 0;
    est.area = 0;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    atualizarTela();
}
function criarB() {
    if (!est.pontoA) return;
    est.pontoB = { lat: est.lat, lon: est.lon };
    atualizarTela();
}
function centralizar() {
    if (!est.pontoA || !est.pontoB) return;
    est.lon = (est.pontoA.lon + est.pontoB.lon)/2;
    est.ultimoPonto = null;
    atualizarTela();
}
function zoomIn() { est.escala *= 1.2; }
function zoomOut() { est.escala /= 1.2; }

function abrirConfig() {
    document.getElementById('modalConfig').style.display = 'flex';
    document.getElementById('inpLarg').value = est.largura;
}
function fecharConfig() {
    document.getElementById('modalConfig').style.display = 'none';
}
function salvarConfig() {
    est.largura = parseFloat(document.getElementById('inpLarg').value);
    fecharConfig();
    atualizarTela();
}
function salvarTalhao() {
    localStorage.setItem('talhao', JSON.stringify({
        a: est.pontoA, b: est.pontoB, larg: est.largura, area: est.area
    }));
}
function carregarTalhao() {
    const d = localStorage.getItem('talhao');
    if (d) {
        const t = JSON.parse(d);
        est.pontoA = t.a; est.pontoB = t.b;
        est.largura = t.larg; est.area = t.area || 0;
        atualizarTela();
    }
}
function limpar() {
    est.pontoA = null; est.pontoB = null;
    est.area = 0; est.distPercorrida = 0;
    est.ultimoPonto = null;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    atualizarTela();
}

// INICIAR
window.onload = () => {
    ajustarCanvas();
    atualizarTela();
    iniciarGPS();
};
</script>
</body>
</html>
