<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Portal Sat GPS</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:Arial,sans-serif;background:#020b12;color:#fff
}
body{touch-action:none}
.app{height:100%;display:flex;flex-direction:column;background:#07131b}

/* CABEÇALHO */
.top{
  height:82px;display:flex;align-items:center;
  padding:7px 18px;background:#03101a;
  border-bottom:2px solid #12455c;gap:18px
}
.logo{
  display:flex;align-items:center;gap:10px;
  width:330px;flex:none
}
.logoIcon{font-size:42px}
.logo b{font-size:28px;font-style:italic}
.logo b span{color:#20ff49}
.logo small{
  display:block;color:#aebfc9;font-size:11px;
  margin-top:2px
}

/* BARRA DE LUZ */
.lightbar{
  height:48px;flex:1;max-width:700px;
  border:2px solid #16485d;border-radius:30px;
  display:flex;align-items:center;justify-content:center;
  gap:10px;background:#041a25;
  box-shadow:0 0 20px #0008 inset
}
.l{
  width:17px;height:17px;border-radius:50%;
  background:#16ed51;box-shadow:0 0 11px #16ed51
}
.l.y{background:#ffd51c;box-shadow:0 0 11px #ffd51c}
.l.r{background:#ff2027;box-shadow:0 0 11px #ff2027}

/* INFORMAÇÕES */
.stats{
  display:flex;align-items:center;gap:22px;
  white-space:nowrap
}
.fix{color:#20ff4c;font-size:18px;font-weight:bold}
.accuracy{font-size:25px;font-weight:bold;color:#16e8ff}
.compass{font-size:27px}
.speed{font-size:27px;font-weight:bold}
.time{text-align:right;font-size:25px}
.date{font-size:12px;color:#b9c6ce;margin-top:2px}

/* ÁREA DE TRABALHO */
.main{
  position:relative;flex:1;overflow:hidden;
  background:#278b31
}
canvas{
  position:absolute;inset:0;width:100%;height:100%
}

/* MENUS LATERAIS */
.side{
  position:absolute;top:0;bottom:0;width:145px;
  background:rgba(2,12,20,.95);
  z-index:10;display:flex;flex-direction:column;
  border-right:1px solid #15465e;
  transition:.25s
}
.right{
  right:0;left:auto;
  border-right:0;border-left:1px solid #15465e
}
.side.closed.left{transform:translateX(-145px)}
.side.closed.right{transform:translateX(145px)}

.item{
  height:88px;flex:none;border:0;
  background:transparent;color:#fff;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:6px
}
.item:hover{background:#0b2635}
.ico{font-size:29px;color:#1cff50}
.item span:last-child{
  font-size:14px;font-weight:bold
}

/* BOTÃO ABRIR/FECHAR */
.handle{
  position:absolute;top:42%;
  width:32px;height:88px;
  background:#07843e;border:0;color:#fff;
  font-size:30px;z-index:12
}
.left .handle{
  right:-32px;border-radius:0 17px 17px 0
}
.right .handle{
  left:-32px;border-radius:17px 0 0 17px
}

/* DESVIO */
.deviation{
  position:absolute;z-index:5;top:14px;
  left:50%;transform:translateX(-50%);
  min-width:310px;text-align:center;
  padding:10px 25px;border-radius:18px;
  background:rgba(2,17,29,.93);
  border:1px solid #18506a;
  box-shadow:0 10px 25px #0008
}
.devnum{font-size:32px;font-weight:bold}
.devlabel{font-size:14px;color:#b9c8d1}

/* CARTÕES */
.bottom{
  position:absolute;z-index:6;bottom:18px;
  display:flex;gap:10px
}
.coverage{left:165px}

.rightCards{
  right:165px;display:flex
}

.card{
  background:rgba(2,16,25,.94);
  border:1px solid #1b4d63;
  border-radius:17px;
  padding:15px 20px;
  min-width:235px;
  box-shadow:0 8px 24px #0009
}
.card .title{
  font-size:15px;color:#c2d0d7
}
.card .value{
  font-size:28px;font-weight:bold;
  color:#21ff4d;margin-top:5px
}
.bar{
  height:8px;border-radius:5px;
  background:#103328;margin-top:9px;
  overflow:hidden
}
.bar i{
  display:block;height:100%;
  width:0;background:#21ff4d
}

/* BOTÕES */
.actions{
  position:absolute;z-index:8;
  right:18px;top:18px;
  display:flex;gap:7px
}
.btn{
  border:1px solid #20566d;
  border-radius:9px;padding:9px 12px;
  color:#fff;background:#061824
}
.btn.active{
  background:#087d3b;
  border-color:#21ff4d
}

/* JANELA */
.modal{
  display:none;
  position:absolute;z-index:30;
  top:95px;left:50%;
  transform:translateX(-50%);
  width:min(520px,90vw);
  background:#061720f7;
  border:1px solid #1bd2ff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 20px 50px #000d
}
.modal.show{display:block}
.modal h2{margin:0 0 14px}
.modal input{
  width:100%;padding:11px;
  border-radius:8px;
  border:1px solid #2a6077;
  background:#06131c;color:#fff;
  margin-bottom:10px
}
.modal button{
  padding:10px 14px;
  border-radius:8px;
  border:1px solid #20ff4d;
  background:#087c3b;color:#fff
}

/* TABLET */
@media(max-width:950px){

.top{
  height:68px;
  padding:5px 8px;
  gap:7px
}

.logo{width:190px}
.logoIcon{font-size:27px}
.logo b{font-size:19px}
.logo small{display:none}

.lightbar{
  height:36px;
  gap:5px
}
.l{
  width:11px;
  height:11px
}

.stats{gap:8px}
.accuracy,.speed,.time{font-size:16px}
.fix{font-size:13px}
.compass{font-size:18px}
.date{font-size:9px}

.side{width:105px}
.side.closed.left{transform:translateX(-105px)}
.side.closed.right{transform:translateX(105px)}

.item{height:72px}
.ico{font-size:24px}
.item span:last-child{font-size:11px}

.coverage{left:112px}
.rightCards{right:112px}

.card{
  min-width:160px;
  padding:10px
}
.card .value{font-size:21px}
.rightCards .card{min-width:145px}

.deviation{
  min-width:230px;
  padding:7px 16px
}
.devnum{font-size:24px}
}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="logo">
  <div class="logoIcon">🛰️</div>
  <div>
    <b>Portal Sat <span>GPS</span></b>
    <small>AGRÍCOLA • PRECISÃO QUE PLANTA RESULTADOS</small>
  </div>
</div>

<div class="lightbar" id="lights"></div>

<div class="stats">

  <div class="fix">🛰️ FIX</div>

  <div class="accuracy">
    ±<span id="acc">2</span> cm
  </div>

  <div class="compass" id="heading">N</div>

  <div class="speed" id="speed">
    0,0 km/h
  </div>

  <div class="time">
    <span id="clock">00:00</span>
    <div class="date" id="date"></div>
  </div>

</div>
</header>


<main class="main">

<canvas id="scene"></canvas>


<!-- MENU ESQUERDO -->

<aside class="side left" id="L">

<button class="handle" onclick="toggle('L')">‹</button>

<button class="item" onclick="panel('talhao')">
<span class="ico">🗺️</span>
<span>Talhão</span>
</button>

<button class="item" onclick="mark('A')">
<span class="ico">A</span>
<span>Linha A-B</span>
</button>

<button class="item" onclick="panel('veiculo')">
<span class="ico">🚜</span>
<span>Veículo</span>
</button>

<button class="item" onclick="panel('implemento')">
<span class="ico">↔</span>
<span>Implemento</span>
</button>

<button class="item" onclick="panel('config')">
<span class="ico">⚙️</span>
<span>Configurações</span>
</button>

</aside>


<!-- MENU DIREITO -->

<aside class="side right" id="R">

<button class="handle" onclick="toggle('R')">›</button>

<button class="item" onclick="panel('relatorios')">
<span class="ico">📊</span>
<span>Relatórios</span>
</button>

<button class="item" onclick="panel('mapas')">
<span class="ico">🗺️</span>
<span>Mapas</span>
</button>

<button class="item" onclick="panel('talhoes')">
<span class="ico">🌾</span>
<span>Talhões</span>
</button>

<button class="item" onclick="panel('ferramentas')">
<span class="ico">🔧</span>
<span>Ferramentas</span>
</button>

<button class="item" onclick="panel('mais')">
<span class="ico">☰</span>
<span>Mais</span>
</button>

</aside>


<!-- DESVIO -->

<div class="deviation">

<div class="devnum" id="dev">
0,12 m
</div>

<div class="devlabel">
Desvio da linha
</div>

</div>


<!-- COBERTURA -->

<div class="bottom coverage card">

<div class="title">
🌱 Cobertura
</div>

<div class="value">
<span id="cov">100</span>%
</div>

<div class="bar">
<i id="bar"></i>
</div>

</div>


<!-- ÁREA / IMPLEMENTO -->

<div class="bottom rightCards">

<div class="card">

<div class="title">
▥ Área trabalhada
</div>

<div class="value">
<span id="area">12,6</span> ha
</div>

</div>


<div class="card">

<div class="title">
↔ Largura do implemento
</div>

<div class="value">
<span id="width">12,0</span> m
</div>

</div>

</div>


<!-- AÇÕES -->

<div class="actions">

<button class="btn" id="run" onclick="run()">
▶ Iniciar
</button>

<button class="btn" onclick="resetWork()">
↺ Zerar
</button>

<button class="btn" onclick="panel('salvar')">
💾 Salvar
</button>

</div>


<!-- JANELA DE CONFIGURAÇÃO -->

<div class="modal" id="modal"></div>

</main>

</div>


<script>

const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');

let W,H;
let go=false;
let t=0;
let dev=.12;
let cov=100;
let area=12.6;
let width=12;
let A=null;


/* TAMANHO */

function size(){

W=canvas.width=canvas.clientWidth;
H=canvas.height=canvas.clientHeight;

}

addEventListener('resize',size);
size();


/* BARRA DE LUZ */

for(let i=0;i<19;i++){

let d=document.createElement('i');

d.className='l '+
(i==8?'y':
(i==9||i==10?'r':''));

document.getElementById('lights').appendChild(d);

}


/* DESENHO DA LAVOURA */

function draw(){

ctx.clearRect(0,0,W,H);


/* CÉU E CAMPO */

let sky=ctx.createLinearGradient(0,0,0,H);

sky.addColorStop(0,'#4aa9df');
sky.addColorStop(.30,'#79c76c');
sky.addColorStop(1,'#147027');

ctx.fillStyle=sky;
ctx.fillRect(0,0,W,H);

ctx.fillStyle='#255e2b';
ctx.fillRect(0,H*.28,W,H*.72);


/* LINHAS */

let cx=W/2;
let hy=H*.28;

for(let n=-6;n<=6;n++){

ctx.strokeStyle=
n==0?'#ffffff':'#19f14b';

ctx.lineWidth=n==0?4:2;

ctx.beginPath();

ctx.moveTo(cx+n*25,hy);

ctx.lineTo(cx+n*150,H);

ctx.stroke();

}


/* COBERTURA */

ctx.fillStyle='rgba(18,255,64,.40)';

ctx.fillRect(
cx-190,
H*.56,
380,
H*.44
);


/* TRATOR */

let tx=cx+dev*45;
let ty=H*.67;

ctx.save();

ctx.translate(tx,ty);


/* RODAS */

ctx.fillStyle='#111a1d';

ctx.beginPath();
ctx.ellipse(-50,25,18,48,0,0,7);
ctx.fill();

ctx.beginPath();
ctx.ellipse(50,25,18,48,0,0,7);
ctx.fill();


/* CORPO */

ctx.fillStyle='#20b93c';
ctx.fillRect(-44,-8,88,62);


/* CABINE */

ctx.fillStyle='#80bdd7';
ctx.fillRect(-27,-48,54,37);

ctx.fillStyle='#10232b';
ctx.fillRect(-22,-43,44,27);


/* IMPLEMENTO */

ctx.fillStyle='#1ddd49';
ctx.fillRect(-82,52,164,9);

ctx.restore();


/* LINHA CENTRAL */

ctx.strokeStyle='#fff';
ctx.lineWidth=4;

ctx.beginPath();
ctx.moveTo(cx,H*.50);
ctx.lineTo(cx,H);
ctx.stroke();

}


/* SIMULAÇÃO */

function loop(){

if(go){

t+=.02;

dev=Math.sin(t)*.32;

document.getElementById('dev').textContent=
Math.abs(dev).toFixed(2).replace('.',',')+' m';

let sp=8.4+Math.sin(t*.7);

document.getElementById('speed').textContent=
sp.toFixed(1).replace('.',',')+' km/h';

document.getElementById('heading').textContent=
['N','NE','E','SE','S','SW','W','NW']
[Math.floor((t*10)%8)];

}

draw();

requestAnimationFrame(loop);

}

loop();


/* INICIAR */

function run(){

go=!go;

let b=document.getElementById('run');

b.textContent=
go?'⏸ Pausar':'▶ Iniciar';

b.classList.toggle('active',go);

}


/* ZERAR */

function resetWork(){

go=false;
t=0;
dev=.12;

document.getElementById('run').textContent='▶ Iniciar';

document.getElementById('run')
.classList.remove('active');

}


/* ABRIR / FECHAR LATERAIS */

function toggle(id){

document.getElementById(id)
.classList.toggle('closed');

}


/* A-B */

function mark(p){

if(p==='A'){

A=Date.now();

alert(
'Ponto A registrado.\
\
Avance na direção desejada e registre o ponto B.'
);

}else{

if(!A){

alert('Registre o ponto A primeiro.');

return;

}

alert(
'Ponto B registrado.\
\
Linhas paralelas criadas.'
);

}

}


/* PAINÉIS */

function panel(type){

let modal=document.getElementById('modal');

modal.classList.add('show');

let titles={

talhao:'Talhão / Lote',
veiculo:'Veículo',
implemento:'Implemento',
config:'Configurações',
relatorios:'Relatórios',
mapas:'Mapas',
talhoes:'Talhões',
ferramentas:'Ferramentas',
mais:'Mais',
salvar:'Salvar trabalho'

};

let field=
type==='implemento'
?
`<input id="input"
value="${width}"
placeholder="Largura do implemento (m)">`
:
`<input id="input"
placeholder="${
type==='salvar'
?'Nome do trabalho'
:'Configuração'
}">`;

modal.innerHTML=`

<h2>${titles[type]||'Portal Sat GPS'}</h2>

${field}

<br>

<button onclick="savePanel('${type}')">
Salvar
</button>

<button onclick="closePanel()">
Fechar
</button>

`;

}


/* FECHAR PAINEL */

function closePanel(){

document.getElementById('modal')
.classList.remove('show');

}


/* SALVAR CONFIGURAÇÃO */

function savePanel(type){

let v=document.getElementById('input').value;

if(type==='implemento'){

let n=parseFloat(
v.replace(',','.')
);

if(n>0){

width=n;

document.getElementById('width')
.textContent=
n.toFixed(1).replace('.',',');

}

}

if(type==='salvar'){

localStorage.setItem(
'PortalSatGPS',
JSON.stringify({

area:area,
cobertura:cov,
largura:width,
data:new Date().toISOString()

})
);

alert('Trabalho salvo neste aparelho.');

}

closePanel();

}


/* RELÓGIO */

function clock(){

let d=new Date();

document.getElementById('clock')
.textContent=
d.toLocaleTimeString(
'pt-BR',
{
hour:'2-digit',
minute:'2-digit'
}
);

document.getElementById('date')
.textContent=
d.toLocaleDateString('pt-BR');

}

setInterval(clock,1000);

clock();

</script>

</body>
</html>
